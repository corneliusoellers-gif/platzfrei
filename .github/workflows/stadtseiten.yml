# Platzfrei: Stadtseiten (platzfrei.app/bolzplaetze/...) jede Woche neu erzeugen.
# Läuft montags nach dem Platz-Import und lässt sich unter "Actions" →
# "Stadtseiten" → "Run workflow" auch von Hand starten.
name: Stadtseiten

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stadtseiten
  cancel-in-progress: false

jobs:
  seiten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow shapely numpy
      - run: python import/stadtseiten.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      - name: Seiten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bolzplaetze sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Nichts geändert"; exit 0; fi
          git commit -m "Stadtseiten aktualisiert"
          git pull --rebase
          git push
