   der Liste verschwindet die Markierung wieder. */
function istOffen(o){
  return ["detail", "bearbeiten", "melden"].includes(Z.ansicht) && String(o.id) === String(Z.auswahlId);
}

function punktZeichnen(o){
  const spiel = naechstesSpiel(o.id);
  if (spiel && new Date(spiel.beginn) - Date.now() < 24 * 3600e3 && (Z.aktiv[o.id] || 0) < 2)
    L.marker([o.lat, o.lon], {
      icon: L.divIcon({ className:"spiel-ring", html:"<span></span>", iconSize:[26,26] }),
      interactive:false, keyboard:false
    }).addTo(markerEbene);
  if ((Z.aktiv[o.id] || 0) >= 2 || hierHier(o.id))
    L.marker([o.lat, o.lon], {
      icon: L.divIcon({ className:"live-ring", html:"<span></span>", iconSize:[30,30] }),
      interactive:false, keyboard:false
    }).addTo(markerEbene);
  const grau = farbe(o) === "#8E8E93";
  const gewaehlt = istOffen(o);
  /* Nicht nur Farbe: Vermutete Plätze haben einen gestrichelten Rand,
     ungeklärte sind hohl, bestätigte voll mit weißem Rand. */
  const stufe = zugangStufe(o).stufe;
  const klein = karte.getZoom() < 15;
  L.circleMarker([o.lat, o.lon], {
    renderer: stift,
    radius: gewaehlt ? 9 : grau ? (klein ? 4 : 5) : (klein ? 6 : 7),
    color: gewaehlt ? "#0F1A15" : stufe === "bestaetigt" ? "#fff" : stufe === "vermutet" ? "#0F1A15" : farbe(o),
    weight: gewaehlt ? 3 : stufe === "ungeklaert" ? 2 : stufe === "vermutet" ? 1.5 : 2,
    dashArray: !gewaehlt && stufe === "vermutet" ? "2 2" : null,
    fillColor: farbe(o), fillOpacity: gewaehlt ? 1 : stufe === "ungeklaert" ? .25 : 1
  })
  .bindTooltip(`${o.name} · ${zugangStufe(o).titel}`, { direction:"top", offset:[0,-6] })
  .on("click", () => {
    Z.auswahlId=o.id; Z.ansicht="detail"; zeichne();
    sheet.mitte();
    karte.flyTo([o.lat, o.lon], Math.max(karte.getZoom(), 16), { duration:.6 });
  })
  .addTo(markerEbene);
}

function buendelZeichnen(gruppe, mitte){
  const n = gruppe.length;
  let lat = 0, lon = 0, rang = BUENDEL_RANG.length - 1;
  for (const o of gruppe) {
    lat += o.lat; lon += o.lon;
    const r = BUENDEL_RANG.indexOf(farbe(o));
    if (r >= 0 && r < rang) rang = r;
  }
  const groesse = buendelGroesse(n);
  const text = n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(".", ",") + "k" : n;
  L.marker(mitte ? karte.unproject(mitte, karte.getZoom()) : [lat / n, lon / n], {
    icon: L.divIcon({
      className: "buendel",
      html: `<span style="--ring:${BUENDEL_RANG[rang]};width:${groesse}px;height:${groesse}px">${text}</span>${
        gruppe.some(o => (Z.aktiv[o.id] || 0) >= 2) ? `<i title="Hier wird gerade gespielt"></i>` : ``}`,
      iconSize: [groesse, groesse]
    }),
    keyboard: false
  })
  .on("click", () => {
    karte.flyToBounds(L.latLngBounds(gruppe.map(o => [o.lat, o.lon])),
      { padding:[50,50], maxZoom:16, duration:.6 });
  })
  .addTo(markerEbene);
}

function buendelGroesse(n){ return Math.round(Math.min(48, 26 + Math.log10(n) * 9)); }

function bildMitte(orte, zoom){
  let x = 0, y = 0;
  for (const o of orte) { const p = karte.project([o.lat, o.lon], zoom); x += p.x; y += p.y; }
  return L.point(x / orte.length, y / orte.length);
}

function markerZeichnen(){
  if (losPille) losPilleAktualisieren();
  markerEbene.clearLayers();
  if (rasterNutzen()) return rasterZeichnen();
  const rahmen = karte.getBounds().pad(0.5);
  const imBild = sichtbareOrte().filter(o => rahmen.contains([o.lat, o.lon]));

  /* Graue zuerst, damit die farbigen obenauf liegen. */
  const grauZuerst = (a,b) => (farbe(b) === "#8E8E93") - (farbe(a) === "#8E8E93");

  if (karte.getZoom() > BUENDEL_BIS_ZOOM) {
    imBild.sort(grauZuerst).forEach(punktZeichnen);
    return;
  }

  /* Bündeln über ein Raster in Bildschirmpunkten – schnell genug für
     zehntausende Orte und ohne zusätzliche Bibliothek. */
  const zoom = karte.getZoom();
  const zellen = new Map();
  for (const o of imBild) {
    const p = karte.project([o.lat, o.lon], zoom);
    const schluessel = Math.floor(p.x / BUENDEL_ZELLE) + ":" + Math.floor(p.y / BUENDEL_ZELLE);
    if (!zellen.has(schluessel)) zellen.set(schluessel, []);
    zellen.get(schluessel).push(o);
  }
  /* Rasterzellen schneiden Nachbarn mitten durch, und ein Bündel liegt in
     der Mitte seiner Orte, nicht seiner Zelle – so können sich Kreise
     überlappen. Deshalb so lange zusammenlegen, bis keine zwei Kreise sich
     mehr berühren. Die neue Mitte ist nach Anzahl gewichtet. */
  let gruppen = [...zellen.values()].map(orte => ({ orte, mitte: bildMitte(orte, zoom) }));
  const ABSTAND = 6;    // Mindestlücke zwischen zwei Kreisen in Punkten
  for (let geaendert = true; geaendert; ) {
    geaendert = false;
    gruppen.sort((a, b) => b.orte.length - a.orte.length);
    for (let i = 0; i < gruppen.length; i++) {
      const a = gruppen[i];
      if (!a) continue;
      for (let j = i + 1; j < gruppen.length; j++) {
        const b = gruppen[j];
        if (!b) continue;
        const ra = a.orte.length > 1 ? buendelGroesse(a.orte.length) / 2 : 7;
        const rb = b.orte.length > 1 ? buendelGroesse(b.orte.length) / 2 : 7;
        if (a.mitte.distanceTo(b.mitte) >= ra + rb + ABSTAND) continue;
        const na = a.orte.length, nb = b.orte.length;
        a.mitte = L.point((a.mitte.x * na + b.mitte.x * nb) / (na + nb),
                          (a.mitte.y * na + b.mitte.y * nb) / (na + nb));
        a.orte = a.orte.concat(b.orte);
        gruppen[j] = null;
        geaendert = true;
      }
    }
    gruppen = gruppen.filter(Boolean);
  }
  const einzelne = [];
  for (const { orte: gruppe, mitte } of gruppen) {
    const offen = gruppe.find(istOffen);
    const rest = offen ? gruppe.filter(o => o !== offen) : gruppe;
    if (offen) einzelne.push(offen);
    if (rest.length === 1) einzelne.push(rest[0]);
    else if (rest.length > 1) buendelZeichnen(rest, offen ? null : mitte);
  }
  einzelne.sort(grauZuerst).forEach(punktZeichnen);
}

/* --------------------------------------------------------------------------
   "In diesem Bereich suchen"
   --------------------------------------------------------------------------
   Erscheint, sobald man die Karte spürbar verschoben hat. Damit findet man
   Plätze am Auswärtsort, statt immer nur die eigene Umgebung zu sehen.
   -------------------------------------------------------------------------- */
const bereichKnopf = document.createElement("button");
bereichKnopf.className = "bereich-knopf";
bereichKnopf.textContent = "In diesem Bereich suchen";
bereichKnopf.hidden = true;
document.getElementById("karte").appendChild(bereichKnopf);

/* Grüne Pille oben auf der Karte, sobald in der Nähe etwas los ist –
   damit man die Community auch sieht, wenn die Liste zugeklappt ist. */
var losPille = document.createElement("button");   // var: markerZeichnen läuft evtl. schon vorher
losPille.className = "los-pille";
losPille.hidden = true;
document.getElementById("karte").appendChild(losPille);
function losPilleAktualisieren(){
  const nah = id => { const o = ort(id) || ort(+id); return o && entfernungKm(Z.position, o) <= LOS_RADIUS_KM; };
  const spielen = Object.entries(Z.aktiv).filter(([id, n]) => n >= 2 && nah(id))
    .reduce((summe, [, n]) => summe + n, 0);
  const spiele = Z.spiele.filter(sp => new Date(sp.beginn) > new Date(Date.now() - 2 * 3600e3) && nah(sp.ort_id)).length;
  const teile = [];
  if (spielen) teile.push(`<span class="puls" aria-hidden="true"></span>${spielen} spielen gerade`);
  if (spiele) teile.push(`📅 ${spiele} ${spiele === 1 ? "Spiel" : "Spiele"}`);
  losPille.innerHTML = teile.join(" · ");
  losPille.hidden = !teile.length || Z.ansicht === "neu" || Z.nurLos;
}
losPille.addEventListener("click", () => {
  Z.ansicht = "liste"; Z.nurLos = true; zeichne();
  sheet.mitte();
});

/* Gleich beim Start setzen – sonst wird die erste Kartenbewegung
   verschluckt und der Knopf erscheint erst beim zweiten Mal. */
let mitteBeimZeichnen = karte.getCenter();

karte.on("moveend", () => {
  markerZeichnen();
  /* Besucher: Plätze im neuen Ausschnitt holen. Admin: solange ganz
     Deutschland noch lädt, den neuen Ausschnitt vorziehen. */
  if (AUSSCHNITT) {
    ausschnittPlanen();
    if (!mitKm() && Z.ansicht === "liste" && !Z.suche.trim()) ansichtListe(true);
  }
  else if (Z.laedtNoch && karte.getZoom() >= 10) {
    const m = karte.getCenter();
    umgebungLaden({ lat:m.lat, lon:m.lng });
  }
  if (Z.ansicht !== "liste") { bereichKnopf.hidden = true; return; }
  const jetzt = karte.getCenter();
  /* Erst ab einer halben Kartenbreite Versatz – sonst blinkt der Knopf
     schon beim kleinsten Verschieben auf. */
  const versatz = jetzt.distanceTo(mitteBeimZeichnen);
  const breite = karte.getBounds().getNorthWest()
                      .distanceTo(karte.getBounds().getNorthEast());
  bereichKnopf.hidden = versatz < breite * 0.35;
});

bereichKnopf.addEventListener("click", () => {
  Z.bereich = karte.getBounds();
  mitteBeimZeichnen = karte.getCenter();
  bereichKnopf.hidden = true;
  zeichne();
  melde(`${sichtbareOrte().length} Plätze in diesem Bereich.`);
});

// Klick auf die Karte im Modus "neuer Ort" setzt die Koordinaten.
karte.on("click", e => {
  if (Z.ansicht !== "neu") return;
  Z.neuEntwurf = neuFormularWerte();
  Z.neuerPunkt = { lat:+e.latlng.lat.toFixed(6), lon:+e.latlng.lng.toFixed(6) };
  zeichne();
});

/* ==========================================================================
   4. HILFSFUNKTIONEN
   ========================================================================== */

function entfernungKm(a,b){
  const R=6371, rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad;
  const dLon=(b.lon-a.lon)*rad*Math.cos((a.lat+b.lat)/2*rad);
  return Math.sqrt(dLat*dLat+dLon*dLon)*R;
}
function entfText(km){
  if (km < 0.1) return "hier";
  if (km < 10) return km.toFixed(1).replace(".",",")+" km";
  return Math.round(km)+" km";
}
function ort(id){ return DATEN.find(o=>o.id===id); }
function esc(s){
  return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function heute(){ return new Date().toISOString().slice(0,10); }
function frei(o){
  return o.zugang==="öffentlich" || o.zugang==="Vereinsgelände frei betretbar";
}
/* Aus der Lage geschlossen (Park, Spielplatz, Schulgelände in OSM),
   aber nicht belegt. Eigene, hellere Stufe. */
function vermutlichFrei(o){ return o.zugang === "vermutlich öffentlich"; }
/* Ampel: die eine Antwort auf "Darf ich hier spielen?". */
function ampel(o){
  if (o.zugang === "Vereinsgelände abgeschlossen" || o.zugang === "nicht öffentlich") return "rot";
  if (frei(o) || vermutlichFrei(o)) return "gruen";
  if (o.zugang === "unklar" && !belegt(o) && nutzerBestaetigt(o)) return "gruen";
  if (o.zugang.includes("Absprache") || o.zugang.includes("Schulhof")) return "orange";
  if (o.zugang === "unklar" && vereinsMarke(o)) return "orange";
  return "grau";
}
function markeArt(o){
  const a = ampel(o);
  if (a === "gruen") return belegt(o) || nutzerBestaetigt(o) ? ["frei","frei zum Spielen"] : ["vermutet","vermutlich frei"];
  if (a === "orange") return ["absprache","vorher fragen"];
  return ["unklar", a === "rot" ? "nicht frei" : "Zugang unklar"];
}

/* Vereinsanlage: sicher, wenn der Zugang es sagt – sonst Verdacht aus dem
   Namen (Vereinskürzel, "Sportanlage", "Bezirkssportanlage" …). Der Verdacht
   ändert NICHTS an den Daten, er ist nur eine Anzeige. So bleibt die Regel
   intakt: Der Zugang wird nur mit Beleg gesetzt. */
const VEREINSMUSTER = /\b(fc|tsv|sv|sc|djk|tv|spvgg|vfl|vfb|esv|asv|fsv|sg)\b|sportanlage|sportpark|sportzentrum|sportgelände|bezirkssportanlage|vereins/i;

function vereinsMarke(o){
  if (o.zugang.startsWith("Vereinsgelände"))
    return ["Vereinsanlage", false];
  if (o.verein)
    return ["vermutlich Vereinsanlage · " + o.verein, true];
  if (VEREINSMUSTER.test(o.name + " " + (o.notizen || "")))
    return ["vermutlich Vereinsanlage", true];
  return null;
}

/* Ist die Zugangsangabe belegt oder nur geraten? */
function belegt(o){
  return ["Auskunft Gemeinde","Auskunft Verein","Auskunft Schule","Schild vor Ort"]
    .includes(o.bestaetigtDurch);
}

/* Von Nutzern bestätigt: mindestens drei Geräte haben "Hier gespielt"
   gedrückt, und es gibt mehr Bestätigungen als Meldungen. Das ändert den
   Zugang nicht – es ist eine eigene, schwächere Stufe neben dem Beleg. */
const NUTZER_SCHWELLE = 3;
function nutzerBestaetigt(o){
  const n = Z.bestaetigungen[o.id] || 0;
  return n >= NUTZER_SCHWELLE && n > (Z.meldungen[o.id] || 0);
}

/* --------------------------------------------------------------------------
   Wie verlässlich ist die Zugangsangabe? Drei Stufen, überall gleich:
   bestätigt (Beleg oder Nutzer), vermutet (aus Lage oder Annahme),
   ungeklärt. Immer mit Symbol und Text, nie nur mit Farbe.
   -------------------------------------------------------------------------- */
const VERALTET_MONATE = 24;
function zugangStufe(o){
  const a = ampel(o), v = vereinsMarke(o);
  const sicher = belegt(o) && o.zugang !== "unklar";
  const nutzer = !belegt(o) && nutzerBestaetigt(o);
  const laut = { "Auskunft Gemeinde":"laut Gemeinde", "Auskunft Verein":"laut Verein",
    "Auskunft Schule":"laut Schule", "Schild vor Ort":"laut Schild vor Ort" }[o.bestaetigtDurch] || "";
  const stufe = sicher || (nutzer && a === "gruen") ? "bestaetigt" : a === "grau" ? "ungeklaert" : "vermutet";
  const art = a === "gruen" ? "frei" : a === "orange" ? "absprache" : "unklar";
  const icon = a === "rot" ? "✕" : a === "orange" ? "!" : a === "grau" ? "?" : stufe === "bestaetigt" ? "✓" : "≈";
  const titel = { gruen:"Frei zum Spielen", orange:"Vorher fragen", grau:"Wissen wir noch nicht", rot:"Nicht frei" }[a];
  let kurz;
  if (a === "gruen") kurz = sicher ? "Bestätigt " + laut
    : nutzer ? "Bestätigt: mehrere Leute haben hier gespielt"
    : "Vermutet, noch nicht bestätigt";
  else if (a === "orange") {
    const verein = o.zugang.startsWith("Vereinsgelände") || o.zugang === "unklar";
    kurz = verein ? `Vereinsanlage${o.verein ? " (" + o.verein + ")" : ""}: beim Verein fragen`
      : o.zugang === "vermutlich Schulhof" ? "Vermutlich Schulhof: vorher fragen"
      : o.zugang.includes("Schulhof") ? "Schulhof: meist nach dem Unterricht"
      : "Nur nach Absprache";
    if (sicher) kurz += " · " + laut;
  }
  else if (a === "rot") kurz = (o.zugang === "nicht öffentlich" ? "Nicht öffentlich nutzbar" : "Abgeschlossen, nur für den Verein")
    + (sicher ? " · " + laut : "");
  else kurz = "Vorher klären, ob man hier darf";
  return { stufe, art, icon, titel, kurz, ampel:a, vereinHinweis: !!(v && v[1]) };
}

/* Woher die Angabe stammt und wie alt sie ist – für Liste und Detail. */
function quelleText(o){
  const q = { "Schild vor Ort":"Schild vor Ort", "Auskunft Gemeinde":"Auskunft Gemeinde",
    "Auskunft Verein":"Auskunft Verein", "Auskunft Schule":"Auskunft Schule",
    "Lage (OSM)":"Kartenlage (OSM)", "nur vermutet":"Vermutung" }[o.bestaetigtDurch] || "ohne Quelle";
  const nutzer = !belegt(o) && nutzerBestaetigt(o) ? `${Z.bestaetigungen[o.id]} Nutzer` : null;
  return nutzer ? nutzer + " · " + q : q;
}
function standText(o){
  if (!o.geprueft) return { text:"nie geprüft", alt:true };
  const d = new Date(o.geprueft);
  if (isNaN(d)) return { text:"", alt:false };
  const monate = (Date.now() - d) / (30.4 * 864e5);
  const mmjj = d.toLocaleDateString("de-DE", { month:"short", year:"numeric" });
  return monate > VERALTET_MONATE ? { text:`Stand ${mmjj} · evtl. veraltet`, alt:true }
                                  : { text:`Stand ${mmjj}`, alt:false };
}

/* Für die Suche: Groß/klein, Akzente und ß egal. */
function normal(t){
  return String(t || "").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss");
}
function passtZurSuche(o){
  const woerter = normal(Z.suche).split(/\s+/).filter(Boolean);
  if (!woerter.length) return true;
  const text = normal(o.name + " " + o.ort + " " + o.sportarten.join(" "));
  return woerter.every(w => text.includes(w));
}

function sichtbareOrte(){
  const sucht = !!Z.suche.trim();
  const gefiltert = DATEN
    .filter(o => !o._doppelt)
    .filter(o => !sucht || passtZurSuche(o))
    .filter(o => Z.sportart==="alle" || o.sportarten.includes(Z.sportart))
    .filter(o => !Z.nurFrei || frei(o) || vermutlichFrei(o))
    .filter(o => !Z.nurBelegt || belegt(o) || nutzerBestaetigt(o))
    .filter(o => !Z.nurGemerkt || GEMERKT.has(o.id))
    .filter(o => !Z.nurLicht || o.beleuchtung === "ja")
    .filter(o => !Z.nurLos || (Z.aktiv[o.id] || 0) >= 2 || naechstesSpiel(o.id))
    .filter(o => sucht || !Z.maxKm || !mitKm() || entfernungKm(Z.position,o) <= Z.maxKm)
    /* "In diesem Bereich suchen": zeigt, was man gerade auf der Karte sieht,
       statt was in der Nähe ist – für Auswärtsspiele und Urlaub. */
    .filter(o => sucht || !Z.bereich || Z.bereich.contains([o.lat, o.lon]));

  /* Ohne Standort zählt die Kartenmitte ("Nahe Kartenmitte"). */
  const mitteKarte = () => { const m = karte.getCenter(); return { lat:m.lat, lon:m.lng }; };
  const bezug = Z.bereich
    ? { lat:Z.bereich.getCenter().lat, lon:Z.bereich.getCenter().lng }
    : mitKm() ? Z.position : mitteKarte();

  const nachEntfernung = (a,b) => entfernungKm(bezug,a) - entfernungKm(bezug,b);

  if (Z.sortierung === "zustand")
    return gefiltert.sort((a,b) => (b.zustand||0) - (a.zustand||0) || nachEntfernung(a,b));

  if (Z.sortierung === "geprueft")
    return gefiltert.sort((a,b) =>
      (b.geprueft || "").localeCompare(a.geprueft || "") || nachEntfernung(a,b));

  return gefiltert.sort(nachEntfernung);
}

/* Welche offenen Felder fehlen noch? Steuert den Lücken-Hinweis. */
const PFLEGBAR = [
  ["untergrund","Untergrund"], ["groesse","Größe"], ["ausstattung","Ausstattung"],
  ["umzaeunt","Umzäunung"], ["beleuchtung","Beleuchtung"], ["drumherum","Drumherum"]
];
function luecken(o){
  return PFLEGBAR.filter(([feld]) => {
    const w = o[feld];
    return !w || w === "—" || w === "";
  }).map(([, titel]) => titel);
}

/* Satellitenausschnitt für die Listenkarte. Ein Bild pro Platz über den
   Export-Dienst von Esri – lädt erst, wenn die Zeile sichtbar wird. */
function satellitBild(o, px = 132){
  const dLat = 0.00042, dLon = 0.00063;      // rund 90 Meter Kantenlänge
  const bbox = [(o.lon - dLon).toFixed(6), (o.lat - dLat).toFixed(6),
                (o.lon + dLon).toFixed(6), (o.lat + dLat).toFixed(6)].join(",");
  return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/"
       + "MapServer/export?bbox=" + bbox
       + "&bboxSR=4326&imageSR=3857&size=" + px + "," + px
       + "&format=jpg&transparent=false&f=image";
}

/* ==========================================================================
   4b. WETTER UND LICHT
   --------------------------------------------------------------------------
   Open-Meteo: kostenlos, ohne Schlüssel, ohne Anmeldung. Wir holen den
   Regen der letzten und nächsten Stunden sowie den Sonnenuntergang.
   ========================================================================== */

async function wetterLaden(){
  try {
    const u = new URL("https://api.open-meteo.com/v1/forecast");
    u.searchParams.set("latitude",  Z.position.lat.toFixed(2));
    u.searchParams.set("longitude", Z.position.lon.toFixed(2));
    u.searchParams.set("hourly", "precipitation");
    u.searchParams.set("daily", "sunset");
    u.searchParams.set("past_hours", "12");
    u.searchParams.set("forecast_hours", "6");
    u.searchParams.set("timezone", "auto");

    const antwort = await fetch(u);
    if (!antwort.ok) return;
    const d = await antwort.json();

    const regen = d.hourly?.precipitation || [];
    Z.wetter = {
      // Wie nass ist der Boden? Summe der letzten 12 Stunden.
      nassMm: regen.slice(0, 12).reduce((a,b)=>a+(b||0), 0),
      // Regnet es gleich? Nächste 3 Stunden.
      regnetGleich: regen.slice(12, 15).some(v => (v||0) > 0.3),
      sonnenuntergang: d.daily?.sunset?.[0] ? new Date(d.daily.sunset[0]) : null
    };
    zeichne();
  } catch { /* ohne Wetter läuft die App genauso */ }
}

/* Minuten bis Sonnenuntergang, oder null wenn schon dunkel/unbekannt. */
function minutenBisDunkel(){
  const su = Z.wetter?.sonnenuntergang;
  if (!su) return null;
  const m = Math.round((su - new Date()) / 60000);
  return m > 0 ? m : null;
}

/* Wie gut ist der Belag bei der aktuellen Wetterlage bespielbar? */
function bespielbarkeit(o){
  const w = Z.wetter;
  if (!w || w.nassMm < 2) return null;          // trocken: kein Hinweis nötig
  const u = (o.untergrund || "").toLowerCase();

  if (u.includes("kunstrasen") || u.includes("tartan"))
    return ["gut", "auch bei Nässe bespielbar"];
  if (u.includes("asche"))
    return ["schlecht", "Asche: bei Nässe schmierig"];
  if (u.includes("naturrasen"))
    return w.nassMm > 8 ? ["schlecht", "Rasen: nach Regen weich"]
                        : ["mittel", "Rasen: evtl. weich"];
  if (u.includes("beton") || u.includes("asphalt"))
    return ["mittel", "nass, aber spielbar"];
  if (u.includes("sand"))
    return ["mittel", "Sand: nach Regen schwer"];
  return null;
}

function melde(text, gehe, dauer = 3200){
  const m = document.getElementById("meldung");
  m.textContent = text;
  /* Mit "gehe" lässt sich die Meldung antippen und öffnet diese Ansicht. */
  if (gehe) m.dataset.gehe = gehe; else delete m.dataset.gehe;
  m.classList.add("zeigen");
  clearTimeout(melde.t);
  melde.t = setTimeout(()=>{ m.classList.remove("zeigen"); delete m.dataset.gehe; }, dauer);
}

function auswahlFeld(name, liste, wert, gesperrt){
  const opt = liste.map(v=>
    `<option value="${esc(v)}"${v===wert?" selected":""}>${esc(v)}</option>`).join("");
  return `<select name="${name}"${gesperrt?" disabled":""}
            class="${gesperrt?"gesperrt":""}">${opt}</select>`;
}

/* --------------------------------------------------------------------------
   "Was ist los in deiner Nähe" – die Community ganz oben in der Liste
   --------------------------------------------------------------------------
   Zeigt, wo gerade gespielt wird, welche Spiele anstehen, und – wenn man
   auf einem Platz steht – den Knopf zum Einchecken. Ist nichts los, lädt
   eine Karte dazu ein, selbst ein Spiel anzusetzen. Nur Anzahlen, keine
   Namen (Jugendschutz, wie überall).
   -------------------------------------------------------------------------- */
const LOS_RADIUS_KM = 30;
/* teil "oben": Check-in und "Jetzt spielen" – breit über der Liste, weil sie
   direkt zu einem Platz führen. teil "leiste": was sonst los ist, als
   Karussell nach den ersten Plätzen. */
function losLeiste(teil = "leiste"){
  const karten = [];
  const kmText = km => km < 1 ? Math.round(km * 1000) + " m" : (km < 10 ? km.toFixed(1).replace(".", ",") : Math.round(km)) + " km";

  /* Eingecheckt, oder gerade auf einem Platz? */
  const ich = meinCheckin();
  const meinOrt = ich && ort(ich.ort);
  if (meinOrt) {
    const bis = new Date(ich.bis).toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
    karten.push(`<div class="los-karte hier" data-ort="${meinOrt.id}" role="button" tabindex="0">
      <span class="los-art"><span class="puls" aria-hidden="true"></span>Du bist eingecheckt</span>
      <span class="los-name">${esc(meinOrt.name)}</span><small>bis ${bis} Uhr</small>
      <button class="inline-knopf" data-hierweg="1">Wieder weg</button></div>`);
  } else if (Z.positionEcht) {
    let naechster = null, best = 0.3;
    for (const o of DATEN) {
      if (Math.abs(o.lat - Z.position.lat) > 0.004 || Math.abs(o.lon - Z.position.lon) > 0.006) continue;
      const km = entfernungKm(Z.position, o);
      if (km <= best) { best = km; naechster = o; }
    }
    if (naechster) karten.push(`<div class="los-karte hier" data-ort="${naechster.id}" role="button" tabindex="0">
      <span class="los-art">📍 Du bist ganz nah</span>
      <span class="los-name">${esc(naechster.name)}</span><small>Zeig anderen, dass hier gespielt wird</small>
      <button class="inline-knopf" data-hier="${naechster.id}">Ich bin gerade hier</button></div>`);
  }

  /* Jetzt spielen: der beste Platz für sofort */
  const jetztK = jetztKarte();
  if (jetztK) karten.push(jetztK);
  if (teil === "oben") return karten.length
    ? `<div class="oben-karten">${karten.join("")}</div>` : ``;
  karten.length = 0;

  /* Wo gerade gespielt wird (ab 2 Personen) */
  const live = Object.entries(Z.aktiv).filter(([, n]) => n >= 2)
    .map(([id, n]) => ({ o: ort(id) || ort(+id), n })).filter(x => x.o && passtHauptsport(x.o.sportarten))
    .map(x => ({ ...x, km: entfernungKm(Z.position, x.o) })).filter(x => x.km <= LOS_RADIUS_KM)
    .sort((a, b) => a.km - b.km).slice(0, 6);
  for (const { o, n, km } of live) karten.push(`<button class="los-karte live" data-ort="${o.id}">
      <span class="los-art"><span class="puls" aria-hidden="true"></span>${n} spielen gerade</span>
      <span class="los-name">${esc(o.name)}</span><small>${esc(o.sportarten.join(" · "))}${mitKm() ? " · " + kmText(km) : ""}</small></button>`);

  /* Kommende Spiele in der Nähe */
  const jetzt = new Date();
  const spiele = Z.spiele.filter(sp => new Date(sp.beginn) > new Date(jetzt - 2 * 3600e3))
    .filter(sp => passtHauptsport(sp.sportart))
    .map(sp => ({ sp, o: ort(sp.ort_id) || ort(+sp.ort_id) })).filter(x => x.o)
    .map(x => ({ ...x, km: entfernungKm(Z.position, x.o) })).filter(x => x.km <= LOS_RADIUS_KM)
    .sort((a, b) => new Date(a.sp.beginn) - new Date(b.sp.beginn)).slice(0, 8);
  for (const { sp, o, km } of spiele) karten.push(`<button class="los-karte spiel" data-ort="${o.id}">
      <span class="los-art">📅 ${esc(spielZeit(sp.beginn))}</span>
      <span class="los-name">${esc(sp.sportart)} · ${esc(o.name)}</span>
      <small>${sp.dabei} von ${sp.brauchen} dabei${mitKm() ? " · " + kmText(km) : ""}</small></button>`);

  /* Immer ein Knopf zum Spiel ansetzen – am nächsten passenden Platz. */
  const ziel = sichtbareOrte().find(o => passtHauptsport(o.sportarten));
  if (ziel) karten.push(`<button class="los-karte ansetzen" data-ort="${ziel.id}" data-spielauf="1">
      <span class="los-art">＋ Mitspieler suchen</span>
      <span class="los-name">Spiel ansetzen</span>
      <small>${!live.length && !spiele.length ? "Noch nichts los. Mach den Anfang" : "Selbst eins starten"} · ${esc(ziel.name)}</small></button>`);
  else if (!live.length && !spiele.length) karten.push(`<div class="los-karte leer">
      <span class="los-art">👥 Noch nichts los</span>
      <small>Öffne einen Platz und setz ein Spiel an. Dann sehen andere hier, wann sie dazukommen können.</small></div>`);

  const zahl = live.length + spiele.length;
  const innen = k => { const a = k.indexOf(">") + 1, z = k.lastIndexOf("</");
    return k.slice(0, a) + `<span class="los-innen">` + k.slice(a, z) + `</span>` + k.slice(z); };
  karten.splice(0, karten.length, ...karten.map(innen));
  if (!karten.length) return ``;
  /* Breite Zeilen untereinander wie "Jetzt spielen" – erst drei, der Rest
     auf Wunsch, damit die Plätze nicht zu weit nach unten rutschen. */
  const MAX = 3, alle = Z.losAlle || karten.length <= MAX + 1;
  return `<section class="los" aria-label="Was ist los in der Nähe"><div class="los-titel">Was ist los in der Nähe${
      zahl ? `<small>${zahl} aktiv</small>` : ``}<button class="los-sport" data-gehe="einstellungen"
      title="Hauptsportart in den Einstellungen ändern">${HAUPTSPORT ? esc(HAUPTSPORT) : "Alle Sportarten"} ⚙︎</button></div>
    <div class="oben-karten los-zeilen">${(alle ? karten : karten.slice(0, MAX)).join("")}</div>${
      karten.length > MAX + 1 ? `<button class="inline-knopf los-mehr" data-losalle="${alle ? "0" : "1"}">${
        alle ? "Weniger zeigen" : `${karten.length - MAX} weitere zeigen`}</button>` : ``}</section>`;
}

/* --------------------------------------------------------------------------
   "Jetzt spielen": ein Tipp, und die App nimmt den besten Platz in der Nähe
   --------------------------------------------------------------------------
   Frei zugänglich (oder von Nutzern bestätigt), zur gewählten Sportart
   passend, nicht matschig und noch hell – sonst nur mit Flutlicht. Belegte
   Plätze und Plätze, auf denen gerade gespielt wird, rücken etwas nach vorn.
   -------------------------------------------------------------------------- */
const JETZT_KM = 15;
function jetztVorschlag(){
  const bisDunkel = minutenBisDunkel();
  const dunkel = !!Z.wetter?.sonnenuntergang && bisDunkel === null;
  const lichtNoetig = dunkel || (bisDunkel !== null && bisDunkel < 45);
  let best = null, bestWert = Infinity;
  for (const o of DATEN) {
    if (o._doppelt || Math.abs(o.lat - Z.position.lat) > 0.14 || Math.abs(o.lon - Z.position.lon) > 0.21) continue;
    if (Z.sportart !== "alle" ? !o.sportarten.includes(Z.sportart) : !passtHauptsport(o.sportarten)) continue;
    const bestaetigt = nutzerBestaetigt(o);
    if (!frei(o) && !vermutlichFrei(o) && !bestaetigt) continue;
    if ((Z.meldungen[o.id] || 0) >= 3 && !bestaetigt) continue;
    if (lichtNoetig && o.beleuchtung !== "ja") continue;
    const bs = bespielbarkeit(o);
    if (bs && bs[0] === "schlecht") continue;
    const km = entfernungKm(Z.position, o);
    if (km > JETZT_KM) continue;
    let wert = km;
    if (!belegt(o) && !bestaetigt) wert += 0.6;
    if (belegt(o) || bestaetigt) wert -= 0.4;
    if ((Z.aktiv[o.id] || 0) >= 2) wert -= 0.5;
    if (wert < bestWert) { bestWert = wert; best = o; }
  }
  return best && { o:best, km:entfernungKm(Z.position, best), lichtNoetig, bisDunkel };
}

function jetztGrund(v){
  const o = v.o, teile = mitKm() ? [entfText(v.km)] : [];
  teile.push(belegt(o) ? "✓ frei, bestätigt" : nutzerBestaetigt(o) ? "✓ von Nutzern bestätigt" : "≈ vermutlich frei, ungeprüft");
  const bs = bespielbarkeit(o);
  if (Z.wetter) teile.push(Z.wetter.regnetGleich ? "gleich Regen" : bs ? bs[1] : "trocken");
  if (v.lichtNoetig) teile.push("mit Flutlicht");
  else if (v.bisDunkel !== null && v.bisDunkel <= 180) teile.push(v.bisDunkel >= 120
    ? `noch ${Math.floor(v.bisDunkel / 60)} h hell` : `noch ${v.bisDunkel} min hell`);
  if ((Z.aktiv[o.id] || 0) >= 2) teile.push(`${Z.aktiv[o.id]} spielen gerade`);
  return teile.join(" · ");
}

function jetztKarte(){
  if (!mitKm()) return null;   // ohne Standort wäre "der nächste Platz" geraten
  const v = jetztVorschlag();
  if (!v) return null;
  return `<button class="los-karte jetzt" data-jetzt="1">
      <span class="los-art">⚡ Jetzt spielen</span>
      <span class="los-name">${esc(v.o.name)}</span>
      <small>${esc(jetztGrund(v))}</small></button>`;
}

function jetztSpielen(){
  const v = jetztVorschlag();
  if (!v) return melde(`Gerade kein passender Platz im Umkreis von ${JETZT_KM} km. Zu dunkel oder zu nass?`);
  Z.auswahlId = v.o.id; Z.ansicht = "detail"; zeichne();
  karte.flyTo([v.o.lat, v.o.lon], Math.max(karte.getZoom(), 16), { duration:.6 });
  sheet.aufmachen();
  melde("Jetzt spielen: " + jetztGrund(v));
}

/* --------------------------------------------------------------------------
   "Wann ist hier meist was los?" – aus den Check-ins der letzten 8 Wochen
   --------------------------------------------------------------------------
   Die Datenbank liefert nur relative Werte (0–100) je Wochentag und Stunde,
   und erst, wenn an mindestens 5 Tagen von 3 Geräten eingecheckt wurde.
   Einzelne Personen lassen sich daraus nicht ablesen.
   -------------------------------------------------------------------------- */
const AUSL_TAGE = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const AUSL_VON = 8, AUSL_BIS = 22;
Z.auslastung = {};
function heuteIso(){ return new Date().getDay() || 7; }

async function auslastungLaden(id){
  Z.auslastung[id] = "laedt";
  const { data, error } = await db.rpc("auslastung", { p_ort:String(id) });
  if (error) { console.warn("Auslastung:", error.message); Z.auslastung[id] = null; }
  else {
    const raster = {};
    for (const z of data || []) (raster[z.wochentag] ||= {})[z.stunde] = z.wert;
    Z.auslastung[id] = (data || []).length ? raster : null;
  }
  const kasten = document.getElementById("auslastung");
  if (kasten && String(Z.auswahlId) === String(id)) kasten.outerHTML = auslastungBlock(ort(id) || ort(+id));
}

function auslastungBlock(o){
  if (!ECHT || !o) return ``;
  const r = Z.auslastung[o.id];
  if (r === undefined) { auslastungLaden(o.id); return `<div id="auslastung"></div>`; }
  if (r === "laedt") return `<div id="auslastung"></div>`;
  if (!r) return `<div class="auslastung ausl-leer" id="auslastung">
      <p>📊 Wann hier meist was los ist, siehst du, sobald öfter jemand eincheckt.</p></div>`;

  const tag = Z.auslastungTag || heuteIso();
  const jetzt = new Date(), istHeute = tag === heuteIso();
  const werte = [];
  for (let h = AUSL_VON; h < AUSL_BIS; h++) werte.push(r[tag]?.[h] || 0);
  const balken = werte.map((w, i) => `<span class="${istHeute && AUSL_VON + i === jetzt.getHours() ? "jetzt" : ""}"
      style="height:${Math.max(4, w)}%" title="${AUSL_VON + i} Uhr"></span>`).join("");
  const spitze = Math.max(...werte);
  const ab = werte.findIndex(w => w >= Math.max(40, spitze * .6));
  const satz = !spitze ? `An diesem Tag ist hier bisher kaum jemand.`
    : `Am meisten los ist meist ${ab >= 0 ? `ab ${AUSL_VON + ab} Uhr` : `um ${AUSL_VON + werte.indexOf(spitze)} Uhr`}.`;
  return `<div class="auslastung" id="auslastung">
      <h4>Wann ist hier meist was los?</h4>
      <div class="ausl-tage">${AUSL_TAGE.map((t, i) =>
        `<button data-ausltag="${i + 1}" aria-pressed="${tag === i + 1}">${t}</button>`).join("")}</div>
      <div class="ausl-balken" role="img" aria-label="${esc(satz)}">${balken}</div>
      <div class="ausl-achse"><span>${AUSL_VON} Uhr</span><span>15 Uhr</span><span>${AUSL_BIS} Uhr</span></div>
      <p>${satz} Aus den Check-ins der letzten 8 Wochen.</p></div>`;
}

/* --------------------------------------------------------------------------
   Einführung beim ersten Start: drei Karten, danach nie wieder
   (außer man öffnet sie unter "Über Platzfrei").
   -------------------------------------------------------------------------- */
const EINF_SCHLUESSEL = "platzfrei.einfuehrung";
const EINF_SEITEN = [
  { bild:"📍", titel:"Ab deinem Standort rechnen?",
    text:"Dann siehst du Entfernungen, die nächsten Plätze zuerst und kannst einchecken. Gespeichert wird dein Standort nicht. Er verlässt dein Gerät nur beim Einchecken und gerundet fürs Wetter.",
    standort:true },
  { bild:`<svg width="54" height="71" viewBox="0 0 320 420" aria-hidden="true"><path d="M160 0C71.634 0 0 70 0 158C0 244 84 348 149 414C155 420 165 420 171 414C236 348 320 244 320 158C320 70 248.366 0 160 0Z" fill="#05B630"/><path d="M124 62V100H196V62M124 282V244H196V282M70 172H250M86 62H234C244.667 62 250 67.3333 250 78V266C250 276.667 244.667 282 234 282H86C75.3333 282 70 276.667 70 266V78C70 67.3333 75.3333 62 86 62ZM187 172C187 186.912 174.912 199 160 199C145.088 199 133 186.912 133 172C133 157.088 145.088 145 160 145C174.912 145 187 157.088 187 172Z" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    titel:"Wo darf ich spielen?",
    text:"Platzfrei zeigt Bolz-, Basketball- und Sportplätze in deiner Nähe und ob du dort frei spielen darfst.",
    legende:true },
  { bild:"👥", titel:"Sieh, wo was los ist",
    text:"Check ein, wenn du auf dem Platz bist, oder setz ein Spiel an. Andere sehen nur, wie viele kommen, nie deinen Namen." },
];

function einfuehrungZeigen(immer){
  if (!immer) { try { if (localStorage.getItem(EINF_SCHLUESSEL)) return; } catch { return; } }
  document.querySelector(".einf")?.remove();
  const el = document.createElement("div");
  el.className = "einf";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-modal", "true");
  el.setAttribute("aria-label", "Einführung");
  let i = 0, gewaehlt = false;
  /* Erste Seite: Standort ja oder nein. Die Antwort zählt sofort (der
     Browser fragt gleich), danach geht die Einführung weiter. */
  const standortWahl = ja => {
    gewaehlt = true;
    try { localStorage.setItem("platzfrei.ohnestandort", ja ? "" : "1"); } catch {}
    if (ja && !Z.positionEcht) zuMeinemStandort();
    i++; bauen();
  };
  const fertig = () => {
    try { localStorage.setItem(EINF_SCHLUESSEL, "1"); } catch {}
    el.remove();
    document.removeEventListener("keydown", taste);
    /* Ohne Antwort geschlossen: dann fragt der Browser direkt. */
    if (!gewaehlt && !Z.positionEcht && !Z.startpunkt) standortHolen();
  };
  const taste = e => { if (e.key === "Escape") fertig(); };
  const bauen = () => {
    const s = EINF_SEITEN[i], letzte = i === EINF_SEITEN.length - 1;
    el.innerHTML = `<div class="einf-karte">
        ${s.standort ? `` : `<button class="einf-weg" data-einfweg="1">Überspringen</button>`}
        <div class="einf-bild">${s.bild}</div>
        <h2>${s.titel}</h2><p>${s.text}</p>
        ${s.legende ? `<div class="einf-legende">
          <span><i class="z-bestaetigt" style="background:#34C759">✓</i>Grün: darfst du</span>
          <span><i style="background:#FF9F0A">!</i>Orange: vorher fragen</span>
          <span><i class="z-unklar" style="background:#8E8E93">?</i>Grau: wissen wir nicht</span>
          <span><i style="background:#FF3B30">✕</i>Rot: nicht frei</span></div>` : ``}
        <button class="einf-recht" data-einfrecht="1">Impressum &amp; Datenschutz</button>
        <div class="einf-punkte" aria-hidden="true">${EINF_SEITEN.map((_, k) => `<i class="${k === i ? "an" : ""}"></i>`).join("")}</div>
        ${s.standort ? `<button class="knopf" data-einfstandort="1">Ja, ab meinem Standort</button>
        <button class="knopf zweit einf-ohne" data-einfohne="1">Nein, ohne Standort</button>`
        : `<button class="knopf" data-einfweiter="1">${letzte ? "Los geht’s" : "Weiter"}</button>`}</div>`;
    el.querySelector("[data-einfweiter],[data-einfstandort]").focus();
  };
  el.addEventListener("click", e => {
    if (e.target.closest("[data-einfstandort]")) return standortWahl(true);
    if (e.target.closest("[data-einfohne]")) return standortWahl(false);
    if (e.target.closest("[data-einfweg]")) return fertig();
    if (e.target.closest("[data-einfrecht]")) {
      el.remove(); document.removeEventListener("keydown", taste);   // beim nächsten Start wieder
      Z.ansicht = "rechtliches"; zeichne(); sheet.aufmachen(); return;
    }
    if (e.target.closest("[data-einfweiter]")) {
      if (i === EINF_SEITEN.length - 1) return fertig();
      i++; bauen();
    }
  });
  let x0 = null;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive:true });
  el.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (EINF_SEITEN[i].standort) return;   // hier bitte mit Ja oder Nein antworten
    if (dx < -50 && i < EINF_SEITEN.length - 1) { i++; bauen(); }
    else if (dx > 50 && i > 0 && !EINF_SEITEN[i - 1].standort) { i--; bauen(); }
  });
  document.addEventListener("keydown", taste);
  document.body.appendChild(el);
  bauen();
}

/* --------------------------------------------------------------------------
   Bezugspunkt: Ab wo rechnen die Entfernungen?
   --------------------------------------------------------------------------
   (Die Leiste darüber wird seit 21.10.2026 nicht mehr gezeigt; ohne Standort
   gibt es keine Kilometer, siehe mitKm().) Ohne Standort-Freigabe rechnete die App ab München-Mitte. Das stand immer
   sichtbar über der Liste, damit niemand die Kilometer für die eigene
   Umgebung hält. Man kann einen Ort eintippen oder die Kartenmitte nehmen.
   -------------------------------------------------------------------------- */
const STARTPUNKT_SCHLUESSEL = "platzfrei.startpunkt";
/* Kilometer zeigen wir nur, wenn wir wissen, wo man ist. Ohne Standort
   gibt es keine Entfernungen – sonst hält man sie für die eigenen. */
function mitKm(){ return Z.positionEcht || !!Z.startpunkt; }
function bezugName(){
  return Z.positionEcht ? "deinem Standort" : Z.startpunkt ? Z.startpunkt.name : "München-Mitte";
}
function bezugZeile(){
  const echt = Z.positionEcht;
  return `<div class="bezug${echt ? "" : " ohne"}">
      <span class="bezug-text"><span aria-hidden="true">📍</span> Entfernungen ab <b>${esc(bezugName())}</b>${
        !echt && !Z.startpunkt ? ` <small>(nicht dein Standort)</small>` : ``}</span>
      <button class="inline-knopf" data-startpunkt="${Z.startpunktOffen ? "zu" : "auf"}"
        aria-expanded="${Z.startpunktOffen}">${Z.startpunktOffen ? "Schließen" : "Ändern"}</button>
    </div>${Z.startpunktOffen ? `<div class="startpunkt">
      <button class="knopf" data-standort="1">📍 Meinen Standort nutzen</button>
      <p class="hinweis">Die App rechnet mit deinem Standort Entfernungen und findet
        bei „Jetzt spielen“ den nächsten Platz. Gespeichert wird er nicht. Er verlässt
        dein Gerät nur kurz: beim Einchecken zur Abstandsprüfung und auf etwa 1 km
        gerundet fürs Wetter.</p>
      <form class="startpunkt-form" data-startpunktform="1">
        <label for="startpunkt-feld">Oder Ort wählen</label>
        <div class="startpunkt-reihe">
          <input id="startpunkt-feld" type="search" enterkeyhint="search" autocomplete="off"
            placeholder="Stadt, Stadtteil oder Adresse" value="">
          <button class="knopf zweit" type="submit">Übernehmen</button>
        </div>
      </form>
      <button class="inline-knopf" data-startpunkt="karte">Kartenmitte als Startpunkt</button>${
        Z.startpunkt ? ` <button class="inline-knopf" data-startpunkt="weg">Zurück zu München-Mitte</button>` : ``}
    </div>` : ``}`;
}
function startpunktSetzen(sp){
  Z.startpunkt = sp;
  Z.startpunktOffen = false;
  if (sp) {
    Z.position = { lat:sp.lat, lon:sp.lon };
    Z.positionEcht = false;
    if (ichMarker) { karte.removeLayer(ichMarker); ichMarker = null; }
    try { localStorage.setItem(STARTPUNKT_SCHLUESSEL, JSON.stringify(sp)); } catch {}
    karte.flyTo([sp.lat, sp.lon], Math.max(karte.getZoom(), 13), { duration:.6 });
  } else {
    Z.position = { ...STANDARD_POSITION };
    try { localStorage.removeItem(STARTPUNKT_SCHLUESSEL); } catch {}
  }
  Z.bereich = null;
  zeichne();
  wetterLaden();
  melde("Entfernungen jetzt ab " + bezugName() + ".");
}
async function startpunktSuchen(text){
  if (!text.trim()) return;
  melde("Suche „" + text.trim() + "“ …");
  try {
    const u = new URL("https://nominatim.openstreetmap.org/search");
    u.search = new URLSearchParams({ format:"jsonv2", q:text.trim(), countrycodes:"de",
                                     limit:"1", "accept-language":"de" });
    const [t] = await (await fetch(u)).json();
    if (!t) return melde("Ort nicht gefunden. Anders schreiben?");
    const name = String(t.name || t.display_name || text).split(",")[0];
    startpunktSetzen({ name, lat:+t.lat, lon:+t.lon });
  } catch { melde("Ortssuche gerade nicht erreichbar."); }
}
function startpunktLaden(){
  try {
    const sp = JSON.parse(localStorage.getItem(STARTPUNKT_SCHLUESSEL) || "null");
    if (sp && isFinite(sp.lat) && isFinite(sp.lon)) {
      Z.startpunkt = sp; Z.position = { lat:sp.lat, lon:sp.lon };
      karte.setView([sp.lat, sp.lon], 13);
      return true;
    }
  } catch {}
  return false;
}

document.addEventListener("focusin", e => {

});

  e.preventDefault();
  e.target.blur();
  const treffer = sichtbareOrte().slice(0, 25);
  if (!treffer.length) return;
  if (treffer.length === 1) karte.flyTo([treffer[0].lat, treffer[0].lon], 16, { duration:.6 });
  else karte.flyToBounds(L.latLngBounds(treffer.map(o => [o.lat, o.lon])).pad(0.2),
                         { maxZoom:15, duration:.6 });

});

/* --------------------------------------------------------------------------
   Mitspieler gesucht
   -------------------------------------------------------------------------- */
function spielZeit(iso){
  const d = new Date(iso), jetzt = new Date();
  const tage = Math.round((new Date(d.toDateString()) - new Date(jetzt.toDateString())) / 864e5);
  const uhr = d.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
  if (d <= jetzt) return "läuft seit " + uhr;
  const tag = tage === 0 ? "heute" : tage === 1 ? "morgen"
    : d.toLocaleDateString("de-DE", { weekday:"short", day:"numeric", month:"numeric" });
  return `${tag} ${uhr}`;
}
function spieleAm(id){
  return Z.spiele.filter(s => String(s.ort_id) === String(id));
}
function naechstesSpiel(id){
  return spieleAm(id).find(s => new Date(s.beginn) > new Date());
}

function spieleBlock(o){
  const liste = spieleAm(o.id);
  const zeilen = liste.map(s => {
    const dabei = ZUSAGEN.has(String(s.id));
    const meins = MEINE_SPIELE.has(String(s.id));
    return `<div class="spiel">
      <span class="spiel-text"><b>${esc(spielZeit(s.beginn)).replace(/^./, c => c.toUpperCase())}</b>
        <small>${SPORT_ICON[s.sportart] || ""} ${esc(s.sportart)} · ${s.dabei} von ${s.brauchen} dabei${meins ? " · von dir" : ""}</small></span>
      ${meins ? `` : `<button class="inline-knopf${dabei ? " dabei" : ""}" data-zusage="${s.id}">${dabei ? "✓ Dabei" : "Bin dabei"}</button>`}
      ${meins || Z.admin ? `<button class="weg" data-spielweg="${s.id}" aria-label="Spiel löschen">×</button>` : ``}
    </div>`;
  }).join("");

  let form = `<p style="margin-top:${liste.length ? 10 : 0}px">
      <button class="inline-knopf" data-spielform="1">＋ Spiel ansetzen</button></p>`;
  if (Z.spielFormOffen) {
    const jetzt = new Date();
    const tage = [...Array(7)].map((_, i) => {
      const d = new Date(jetzt); d.setDate(d.getDate() + i);
      return `<option value="${i}">${i === 0 ? "Heute" : i === 1 ? "Morgen"
        : d.toLocaleDateString("de-DE", { weekday:"long", day:"numeric", month:"numeric" })}</option>`;
    }).join("");
    const uhrzeiten = [];
    for (let m = 8 * 60; m <= 21 * 60 + 30; m += 30)
      uhrzeiten.push(`${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`);
    const vorschlag = uhrzeiten.find(u => +u.slice(0, 2) * 60 + +u.slice(3) > jetzt.getHours() * 60 + jetzt.getMinutes() + 30) || "16:00";
    form = `<div class="spielform">
        <label>Tag<select id="spiel-tag">${tage}</select></label>
        <label>Uhrzeit<select id="spiel-uhr">${uhrzeiten.map(u =>
          `<option${u === vorschlag ? " selected" : ""}>${u}</option>`).join("")}</select></label>
        <label>Sportart<select id="spiel-sport">${o.sportarten.map(s =>
          `<option${s === HAUPTSPORT ? " selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
        <label>Wie viele insgesamt?<select id="spiel-anzahl">${[4,6,8,10,12,14,16,22].map(n =>
          `<option${n === 10 ? " selected" : ""}>${n}</option>`).join("")}</select></label>
        <div class="reihe">
          <button class="inline-knopf" data-spielansetzen="${o.id}">Ansetzen</button>
          <button class="inline-knopf" data-spielform="0" style="background:none">Abbrechen</button>
        </div>
      </div>
      <p class="hinweis" style="margin-top:8px">Ohne Namen und ohne Chat. Alle sehen nur Zeit,
      Sportart und wie viele kommen. Triff dich am besten mit Leuten, die du kennst.</p>`;
  }
  return `<div class="abschnitt" style="margin:12px 0 0">
      <h3>Mitspieler gesucht</h3>
      ${zeilen || (Z.spielFormOffen ? `` : `<p>Noch kein Spiel geplant. Setz eins an, dann sehen andere, wann sie dazukommen können.</p>`)}
      ${form}
    </div>`;
}

async function spieleLaden(){
  if (!ECHT) return false;
  const { data, error } = await db.rpc("spiele_offen");
  if (error) { console.warn("Spiele:", error.message); return false; }
  const neu = data || [];
  const geaendert = JSON.stringify(neu) !== JSON.stringify(Z.spiele);
  Z.spiele = neu;
  return geaendert;
}

async function spielAnsetzen(){
  const o = ort(Z.auswahlId);
  if (!o) return;
  const tag = +document.getElementById("spiel-tag").value;
  const [h, m] = document.getElementById("spiel-uhr").value.split(":").map(Number);
  const beginn = new Date(); beginn.setDate(beginn.getDate() + tag); beginn.setHours(h, m, 0, 0);
  if (beginn < new Date()) return melde("Die Uhrzeit ist schon vorbei.");
  const sportart = document.getElementById("spiel-sport").value;
  const brauchen = +document.getElementById("spiel-anzahl").value;
  if (!ECHT) return melde("Geht nur in der echten App.");
  const { data, error } = await db.rpc("spiel_ansetzen", {
    p_ort:String(o.id), p_geraet:geraetId(), p_sportart:sportart,
    p_beginn:beginn.toISOString(), p_brauchen:brauchen });
  if (error) {
    console.warn("Spiel ansetzen:", error.message);
    return melde(/3 offene/.test(error.message) ? "Du hast schon 3 offene Spiele." : "Konnte das Spiel nicht ansetzen.");
  }
  MEINE_SPIELE.add(String(data)); mengeSpeichern("platzfrei.meinespiele", MEINE_SPIELE);
  ZUSAGEN.add(String(data));     mengeSpeichern("platzfrei.zusagen", ZUSAGEN);
  Z.spielFormOffen = false;
  await spieleLaden();
  zeichne();
  melde("Spiel angesetzt. Andere sehen es jetzt am Platz.");
  zaehle("spiele");
}

async function spielZusagen(spielId){
  const dabei = !ZUSAGEN.has(String(spielId));
  if (ECHT) {
    const { error } = await db.rpc("spiel_zusagen", { p_spiel:+spielId, p_geraet:geraetId(), p_dabei:dabei });
    if (error) { console.warn("Zusagen:", error.message); return melde("Hat nicht geklappt."); }
  }
  if (dabei) ZUSAGEN.add(String(spielId)); else ZUSAGEN.delete(String(spielId));
  mengeSpeichern("platzfrei.zusagen", ZUSAGEN);
  await spieleLaden();
  zeichne();
  melde(dabei ? "Du bist dabei!" : "Abgesagt.");
  if (dabei) zaehle("zusagen");
}

async function spielLoeschen(spielId){
  if (!confirm("Spiel wirklich löschen?")) return;
  if (ECHT) {
    const { error } = await db.rpc("spiel_loeschen", { p_spiel:+spielId, p_geraet:geraetId() });
    if (error) { console.warn("Spiel löschen:", error.message); return melde("Hat nicht geklappt."); }
  }
  MEINE_SPIELE.delete(String(spielId)); mengeSpeichern("platzfrei.meinespiele", MEINE_SPIELE);
  await spieleLaden();
  zeichne();
  melde("Spiel gelöscht.");
}

   Platz-Tipps
   -------------------------------------------------------------------------- */
function tippsBlock(o){
  const zahlen = Z.tipps[o.id];
  if (zahlen === undefined) tippsLaden(o.id);
  const z = zahlen || {};
  const meins = k => MEINE_TIPPS.has(o.id + "|" + k);
  const knopf = k => `<button class="tipp" data-tipp="${k}" aria-pressed="${meins(k)}">${TIPPS[k]}${
    z[k] ? `<b>${z[k]}</b>` : ``}</button>`;
  const da = Object.keys(TIPPS).filter(k => z[k] || meins(k)).sort((a, b) => (z[b] || 0) - (z[a] || 0));
  const rest = Object.keys(TIPPS).filter(k => !da.includes(k));
  return `<div class="abschnitt" style="margin:12px 0 0">
      <h3>Tipps von Spielern</h3>
      ${da.length ? `<div class="tipps">${da.map(knopf).join("")}</div>`
                  : `<p>Noch keine Tipps. Warst du schon hier? Dann hilf den Nächsten.</p>`}
      ${Z.tippsOffen
        ? `<div class="tipps tipps-neu">${rest.map(knopf).join("")}</div>
           <p style="margin-top:10px"><button class="inline-knopf" data-tippsoffen="0">Fertig</button></p>`
        : `<p style="margin-top:10px"><button class="inline-knopf" data-tippsoffen="1">Tipp geben</button></p>`}
    </div>`;
}

async function tippsLaden(id){
  Z.tipps[id] = Z.tipps[id] || null;   // nicht doppelt laden
  if (!ECHT) { Z.tipps[id] = {}; return; }
  const { data, error } = await db.rpc("tipps_fuer", { p_ort:String(id) });
  if (error) { console.warn("Tipps:", error.message); Z.tipps[id] = {}; return; }
  const z = {};
  for (const r of data || []) z[r.tipp] = r.anzahl;
  Z.tipps[id] = z;
  if (Z.ansicht === "detail" && String(Z.auswahlId) === String(id)) zeichne();
}

async function tippUmschalten(k){
  const o = ort(Z.auswahlId);
  if (!o) return;
  const schl = o.id + "|" + k;
  const an = !MEINE_TIPPS.has(schl);
  if (ECHT) {
    const { error } = await db.rpc("tipp_setzen", { p_ort:String(o.id), p_tipp:k, p_geraet:geraetId(), p_an:an });
    if (error) { console.warn("Tipp:", error.message); return melde("Hat nicht geklappt."); }
  }
  const z = Z.tipps[o.id] || (Z.tipps[o.id] = {});
  z[k] = Math.max(0, (z[k] || 0) + (an ? 1 : -1));
  if (an) MEINE_TIPPS.add(schl); else MEINE_TIPPS.delete(schl);
  mengeSpeichern("platzfrei.tipps", MEINE_TIPPS);
  zeichne();
  if (an) zaehle("tipps");
}

/* Aus den Häkchen einen kurzen Text machen: gleiche Zeiten an
   aufeinanderfolgenden Tagen zusammenfassen, z. B. "Mo–Fr 17:00–20:00". */
function zeitenAusRaster(w){
  const tage = WOCHENTAGE.map((t,i) => w["tag-"+i] ? (w["von-"+i]||"") + "–" + (w["bis-"+i]||"") : null);
  const teile = [];
  for (let i = 0; i < 7; i++) {
    if (!tage[i]) continue;
    let j = i;
    while (j + 1 < 7 && tage[j+1] === tage[i]) j++;
    teile.push((j > i ? WOCHENTAGE[i] + (j > i+1 ? "–" : ", ") + WOCHENTAGE[j] : WOCHENTAGE[i]) + " " + tage[i]);
    i = j;
  }
  return teile.join(", ");
}

async function vereinszeitenSenden(){
  const o = ort(Z.auswahlId);
  const f = document.getElementById("formular");
  const w = formularWerte();
  for (const el of f.querySelectorAll("input[type=checkbox]")) w[el.name] = el.checked;
  let zeiten = zeitenAusRaster(w);
  if (!zeiten) return melde("Bitte mindestens einen Tag anhaken.");
  if (w.zusatz) zeiten += " (" + w.zusatz + ")";
  if (!w.verein || w.verein.length < 2) return melde("Bitte den Verein eintragen.");
  if (!w.name || w.name.length < 2) return melde("Bitte deinen Namen eintragen.");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(w.kontakt || "")) return melde("Bitte eine gültige E-Mail eintragen.");
  if (ECHT) {
    const { error } = await db.from("vereinszeiten").insert({
      ort_id:String(o.id), zeiten:zeiten.slice(0,300), verein:w.verein, name:w.name,
      funktion:w.funktion || null, kontakt:w.kontakt });
    if (error) { console.error(error); return melde("Senden hat nicht geklappt: " + error.message); }
  }
  Z.ansicht = "detail";
  zeichne();
  melde("Danke! Wir prüfen die Zeiten und tragen sie dann ein.");
}

async function neuenOrtPruefen(id, annehmen){
  if (ECHT) {
    const beleg = document.querySelector(`select[name="beleg-${id}"]`)?.value || "nur vermutet";
    let { data, error } = await db.rpc("neuen_ort_pruefen", { p_id:+id, p_annehmen:annehmen, p_beleg:beleg });
    // Ältere Datenbankfunktion ohne p_beleg.
    if (error && /p_beleg|function/i.test(error.message || ""))
      ({ data, error } = await db.rpc("neuen_ort_pruefen", { p_id:+id, p_annehmen:annehmen }));
    if (error) { console.error(error); return melde("Abgelehnt: " + error.message); }
    if (annehmen && data) {
      const { data:zeile } = await db.from("orte").select("*").eq("id", data).single();
      if (zeile) { DATEN.push(ausDb(zeile)); doppelteMarkieren(); speicherVeraltet(); }
    }
  }
  NEUE_ORTE = NEUE_ORTE.filter(n => String(n.id) !== String(id));
  zeichne();
  melde(annehmen ? "Angenommen – der Platz ist jetzt auf der Karte." : "Abgelehnt.");
}

async function vereinszeitenPruefen(id, annehmen){
  const v = VEREINSZEITEN.find(x => String(x.id) === String(id));
  if (ECHT) {
    const { error } = await db.rpc("vereinszeiten_pruefen", { p_id:+id, p_annehmen:annehmen });
    if (error) { console.error(error); return melde("Abgelehnt: " + error.message); }
  }
  const o = v && ort(v.ort_id);
  if (annehmen && o) {
    o.zeiten = v.zeiten; o.bestaetigtDurch = "Auskunft Verein"; o.geprueft = heute();
    if (!o.verein) o.verein = v.verein;
    if (o.zugang === "unklar" || o.zugang === "Vereinsgelände abgeschlossen")
      o.zugang = "Vereinsgelände frei betretbar";
  }
  VEREINSZEITEN = VEREINSZEITEN.filter(x => String(x.id) !== String(id));
  zeichne();
  melde(annehmen ? "Zeiten übernommen." : "Abgelehnt.");
}
