/* Route: öffnet die Karten-App des Geräts mit dem Platz als Ziel.
   Apple Maps auf iOS und Mac, sonst Google Maps. */
/* --------------------------------------------------------------------------
   Straße ergänzen: Viele Plätze aus OpenStreetMap heißen nur „Fußballplatz
   Krailling“. Öffnet jemand so einen Platz, fragen wir bei Nominatim
   (OpenStreetMap) die Straße ab und speichern sie für alle. Nominatim
   erlaubt höchstens eine Anfrage pro Sekunde – deshalb eine Warteschlange.
   -------------------------------------------------------------------------- */
const ADRESSE_WARTE = [];
const ADRESSE_VERSUCHT = new Set();
let adresseLaeuft = false;

function adresseErgaenzen(o){
  if (!o || (o.ort && o.ort.includes(",")) || ADRESSE_VERSUCHT.has(o.id)) return;
  ADRESSE_VERSUCHT.add(o.id);
  ADRESSE_WARTE.push(o);
  if (!adresseLaeuft) adresseNaechste();
}

async function adresseNaechste(){
  const o = ADRESSE_WARTE.shift();
  if (!o) { adresseLaeuft = false; return; }
  adresseLaeuft = true;
  try {
    const u = new URL("https://nominatim.openstreetmap.org/reverse");
    u.search = new URLSearchParams({ format:"jsonv2", lat:o.lat, lon:o.lon, zoom:"17",
                                     addressdetails:"1", "accept-language":"de" });
    const a = (await (await fetch(u)).json()).address || {};
    const strasse = a.road || a.pedestrian || a.footway || a.path || a.cycleway
                 || a.square || a.park || a.neighbourhood || a.hamlet;
    const stadt = a.city || a.town || a.village || a.municipality;
    const teil  = a.city && (a.suburb || a.city_district);
    const ortNeu = stadt ? (teil && teil !== stadt ? `${stadt}-${teil}` : stadt) : null;
    if (strasse && ortNeu) adresseUebernehmen(o, ortNeu, strasse);
  } catch {}
  setTimeout(adresseNaechste, 1100);
}

/* Gleiche Regel wie die Datenbankfunktion adresse_ergaenzen: Endet der Name
   auf den alten Ort, wird der Ort ersetzt und die Straße angehängt. */
function neuerNameMitAdresse(name, altOrt, ortNeu, strasse){
  if (altOrt && altOrt !== "—" && name.endsWith(" " + altOrt))
    return name.slice(0, name.length - altOrt.length) + ortNeu + ", " + strasse;
  return name;
}

async function adresseUebernehmen(o, ortNeu, strasse){
  const nameNeu = neuerNameMitAdresse(o.name, o.ort, ortNeu, strasse);
  o.name = nameNeu;
  o.ort = ortNeu + ", " + strasse;
  if (ECHT) {
    try { await db.rpc("adresse_ergaenzen", { p_id:o.id, p_ort:ortNeu, p_strasse:strasse }); } catch {}
  }
  /* Nur das Nötigste neu zeichnen, damit nichts springt. */
  if (Z.ansicht === "detail" && Z.auswahlId === o.id) {
    const n = seite.querySelector(".dname"), d = seite.querySelector(".dort");
    if (n) n.textContent = o.name;
    if (d) d.textContent = `${o.ort} · ${entfText(entfernungKm(Z.position,o))} entfernt`;
  }
  const zeile = seite.querySelector(`.zeile[data-ort="${CSS.escape(String(o.id))}"] .zname`);
  if (zeile) zeile.textContent = o.name;
}

/* Teilen: Link direkt auf den Platz – zum Verabreden mit Freunden. */
async function teilen(id){
  const o = ort(id);
  if (!o) return;
  const url = location.origin + location.pathname + "#platz=" + encodeURIComponent(id);
  const text = `${o.name} – ${markeArt(o)[1]}. Lass uns da spielen!`;
  if (navigator.share) {
    try { await navigator.share({ title:o.name, text, url }); } catch {}
    return;
  }
  try { await navigator.clipboard.writeText(url); melde("Link kopiert."); }
  catch { prompt("Link zum Platz:", url); }
}
function platzAusAdresse(){
  const m = location.hash.match(/^#platz=(.+)$/);
  if (!m) return;
  const o = ort(decodeURIComponent(m[1]));
  history.replaceState(history.state, "", location.pathname + location.search);
  if (!o) return;
  Z.auswahlId = o.id; Z.ansicht = "detail"; zeichne();
  karte.setView([o.lat, o.lon], 16);
  sheet.mitte();
}

function routeOeffnen(id){
  const o = ort(id);
  if (!o) return;
  const apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  const url = apple
    ? `https://maps.apple.com/?daddr=${o.lat},${o.lon}&dirflg=w`
    : `https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lon}&travelmode=walking`;
  window.open(url, "_blank", "noopener");
}

/* ==========================================================================
   6b. ANMELDUNG
   --------------------------------------------------------------------------
   Der Browser fragt nur: "bin ich Admin?" Die Antwort kommt aus der
   Datenbank über die Funktion ist_admin(). Wer Z.admin im Browser von
   Hand auf true setzt, sieht zwar mehr Knöpfe – aber jeder Schreibversuch
   auf die geschützten Spalten wird von Postgres abgelehnt.
   ========================================================================== */

async function anmelden(){
  if (!ECHT) {                      // Testmodus: nur umschalten
    Z.admin = !Z.admin;
    Z.ansicht = "liste";
    zeichne();
    return melde(Z.admin ? "Testmodus: Admin an (keine echte Sicherung)."
                         : "Testmodus: Admin aus.");
  }

  const f = document.getElementById("anmeldeformular");
  const email    = f.email.value.trim();
  const passwort = f.passwort.value;
  if (!email || !passwort) return melde("E-Mail und Passwort ausfüllen.");

  Z.laden = true; zeichne();

  const { error } = await db.auth.signInWithPassword({ email, password: passwort });

  Z.laden = false;
  if (error) {
    zeichne();
    console.error("Anmeldung:", error);
    const m = (error.message || "").toLowerCase();
    if (m.includes("invalid login credentials"))
      return melde("E-Mail oder Passwort stimmen nicht – oder der Nutzer existiert noch nicht.");
    if (m.includes("email not confirmed"))
      return melde("Der Nutzer ist angelegt, aber die E-Mail nicht bestätigt. In Supabase: Nutzer öffnen → E-Mail bestätigen.");
    if (m.includes("failed to fetch") || m.includes("network"))
      return melde("Keine Verbindung zu Supabase – Internet oder Project-URL prüfen.");
    return melde("Anmeldung fehlgeschlagen: " + error.message);
  }

  await adminPruefen();
  if (Z.admin) await Promise.all([vorschlaegeLaden(), bestaetigungenLaden(), fehlerLaden(), pruefungLaden()]);
  Z.ansicht = "liste";
  zeichne();
  melde(Z.admin ? "Angemeldet als Admin." : "Angemeldet – aber nicht als Admin freigeschaltet.");
}

async function abmelden(){
  if (ECHT) await db.auth.signOut();
  Z.admin = false; Z.email = null;
  await bestaetigungenLaden();   // ungeprüfte Fotos wieder ausblenden
  zeichne();
  melde("Abgemeldet.");
}

/* Fragt die Datenbank, ob der angemeldete Nutzer in der Tabelle admins steht. */
async function adminPruefen(){
  if (!ECHT) return;
  const { data: sitzung } = await db.auth.getSession();
  if (!sitzung?.session) { Z.admin = false; Z.email = null; return; }

  Z.email = sitzung.session.user.email;
  const { data, error } = await db.rpc("ist_admin");
  Z.admin = !error && data === true;
}

/* Admin: Platz endgültig löschen. Läuft über die Datenbankfunktion
   ort_loeschen(), die selbst prüft, ob der Aufrufer Admin ist, und auch die
   Meldungen, Vorschläge und Bestätigungen zu diesem Platz entfernt. */
async function ortLoeschen(ortId){
  const o = ort(ortId);
  if (!o || !Z.admin) return;
  if (!confirm(`„${o.name}“ endgültig löschen?\n\nDas lässt sich nicht rückgängig machen.`)) return;
  if (ECHT) {
    const { error } = await db.rpc("ort_loeschen", { p_ort_id: ortId });
    if (error) { console.error(error); return melde("Löschen abgelehnt: " + error.message); }
  }
  DATEN = DATEN.filter(x => x.id !== ortId);
  if (GEMERKT.delete(ortId)) {
    try { localStorage.setItem(MERK_SCHLUESSEL, JSON.stringify([...GEMERKT])); } catch {}
  }
  Z.auswahlId = null;
  Z.ansicht = "liste";
  zeichne();
  melde(`„${o.name}“ gelöscht.`);
}

/* Geschützte Felder gehen nie per normalem Update raus, sondern immer über
   die Datenbankfunktion – die prüft selbst, ob der Aufrufer Admin ist. */
async function zugangSetzen(ortId, zugang, zeiten, bestaetigtDurch){
  if (!ECHT) return true;
  const { error } = await db.rpc("zugang_setzen", {
    p_ort_id: ortId, p_zugang: zugang,
    p_zeiten: zeiten, p_bestaetigt_durch: bestaetigtDurch
  });
  if (error) { melde("Abgelehnt: " + error.message); return false; }
  return true;
}


/* ==========================================================================
   6c. IMPORT AUS OPENSTREETMAP
   --------------------------------------------------------------------------
   Nimmt eine GeoJSON-Datei aus overpass-turbo.eu entgegen und übersetzt sie
   in unsere Orte. Grundsatz dabei: Der Zugang wird IMMER als "unklar" mit
   "nur vermutet" gespeichert – OSM weiß nicht, ob man dort spielen darf.
   Genau das ist ja die Frage, die nur ihr vor Ort beantworten könnt.
   ========================================================================== */

/* Welcher OSM-Sportwert wird welche unserer Sportarten? Alles andere
   (Tennis, Golf, Reiten …) wird bewusst übersprungen. */
const OSM_SPORT = {
  soccer:"Fußball", football:"Fußball",
  basketball:"Basketball", streetball:"Basketball",
  table_tennis:"Tischtennis",
  beachvolleyball:"Beachvolleyball", volleyball:"Beachvolleyball",
  running:"Laufen", athletics:"Laufen",
  fitness:"Calisthenics", calisthenics:"Calisthenics", exercise:"Calisthenics",
  skateboard:"Skaten",
  multi:"Fußball"   // Multifunktionsfelder sind fast immer Bolzplätze
};

const OSM_BELAG = {
  grass:"Naturrasen",
  artificial_turf:"Kunstrasen", artificial_grass:"Kunstrasen",
  asphalt:"Beton/Asphalt", concrete:"Beton/Asphalt", paved:"Beton/Asphalt",
  clay:"Asche", dirt:"Asche", earth:"Asche", fine_gravel:"Asche", compacted:"Asche",
  tartan:"Tartan", sand:"Sand"
};

function sportartenAusTags(t){
  const roh = (t.sport || "").split(";").map(s=>s.trim().toLowerCase()).filter(Boolean);
  const menge = new Set();
  for (const r of roh) {
    if (OSM_SPORT[r]) menge.add(OSM_SPORT[r]);
    if (r === "multi") menge.add("Basketball");
  }
  if (!menge.size && t.leisure === "fitness_station") menge.add("Calisthenics");
  return [...menge];
}

/* Overpass liefert Punkte, Linien und Flächen. Für Flächen nehmen wir die
   Mitte des Umrisses – für "wo ist der Platz" ist das genau genug. */
function mittelpunkt(g){
  if (!g) return null;
  if (g.type === "Point") return { lat:g.coordinates[1], lon:g.coordinates[0] };
  let ring = null;
  if (g.type === "Polygon")           ring = g.coordinates[0];
  else if (g.type === "MultiPolygon") ring = g.coordinates[0][0];
  else if (g.type === "LineString")   ring = g.coordinates;
  if (!ring || !ring.length) return null;
  let lat = 0, lon = 0;
  for (const p of ring) { lon += p[0]; lat += p[1]; }
  return { lat:+(lat/ring.length).toFixed(6), lon:+(lon/ring.length).toFixed(6) };
}

function ortSchluessel(name, lat, lon){
  return name + "|" + lat.toFixed(5) + "|" + lon.toFixed(5);
}

/* --------------------------------------------------------------------------
   CSV aus dem Open-Data-Portal München
   --------------------------------------------------------------------------
   Der Datensatz "Öffentliche Spielplätze München" listet in der Spalte
   "Besondere Angebote" genau das, was uns interessiert: Bolzplatz,
   Streetball, Tischtennis, Skateanlage, Beachvolleyball, Fitness Parcours.
   Alles andere (Wasserspiel, Rodelhügel, Klettern …) wird übersprungen.

   Eigenheiten des Datensatzes, die der Import abfangen muss:
   - Felder können Kommas UND Zeilenumbrüche enthalten, in "" eingeschlossen
   - mehrere Angebote pro Feld, durch Zeilenumbruch getrennt
   - derselbe Ort erscheint mehrfach mit verschiedenen SERVICE.IDs
   -------------------------------------------------------------------------- */

/* Kleiner, aber vollständiger CSV-Parser: kommt mit Anführungszeichen,
   verdoppelten Anführungszeichen und Umbrüchen im Feld zurecht. */
function csvLesen(text){
  const zeilen = [];
  let feld = "", zeile = [], inAnf = false;

  for (let i = 0; i < text.length; i++) {
    const z = text[i];

    if (inAnf) {
      if (z === '"') {
        if (text[i+1] === '"') { feld += '"'; i++; }   // "" = ein "
        else inAnf = false;
      } else feld += z;
      continue;
    }

    if (z === '"')       { inAnf = true; }
    else if (z === ",")  { zeile.push(feld); feld = ""; }
    else if (z === "\n") { zeile.push(feld); zeilen.push(zeile); zeile = []; feld = ""; }
    else if (z !== "\r") { feld += z; }
  }
  if (feld !== "" || zeile.length) { zeile.push(feld); zeilen.push(zeile); }
  return zeilen;
}

/* Angebot aus dem München-Datensatz -> unsere Sportart */
const MUC_SPORT = {
  "bolzplatz":"Fußball",
  "streetball":"Basketball",
  "tischtennis":"Tischtennis",
  "skateanlage":"Skaten",
  "beachvolleyball":"Beachvolleyball",
  "fitness parcours":"Calisthenics"
};

/* "Spielplatz ""Luitpoldpark Bolzplatz""" -> "Luitpoldpark Bolzplatz" */
function mucName(roh){
  let n = (roh || "").replace(/\s+/g, " ").trim();
  const treffer = n.match(/"([^"]+)"/);
  if (treffer) n = treffer[1].trim();
  n = n.replace(/^(Service\s+)?Spielplatz\s*/i, "").trim();
  return n || "Sportfläche";
}

async function importMuenchen(text){
  const zeilen = csvLesen(text);
  if (zeilen.length < 2) return melde("Die CSV-Datei ist leer.");

  const kopf = zeilen[0].map(s => s.trim());
  const sp = {
    id:      kopf.indexOf("ADDRESS.ID"),
    name:    kopf.indexOf("ADDRESS.Bezeichnung"),
    lat:     kopf.indexOf("ADDRESS.Lat"),
    lon:     kopf.indexOf("ADDRESS.Lon"),
    angebot: kopf.indexOf("Besondere Angebote")
  };
  if (sp.lat < 0 || sp.angebot < 0)
    return melde("Das sieht nicht nach dem Münchner Spielplatz-Datensatz aus.");

  /* Erst alle Zeilen je Ort zusammenfassen – ein Ort kann mehrfach vorkommen. */
  const orte = new Map();
  for (let i = 1; i < zeilen.length; i++) {
    const r = zeilen[i];
    if (!r[sp.lat]) continue;

    const schluessel = r[sp.id] || (r[sp.lat] + "," + r[sp.lon]);
    if (!orte.has(schluessel))
      orte.set(schluessel, {
        name: mucName(r[sp.name]),
        lat: +(+r[sp.lat]).toFixed(6),
        lon: +(+r[sp.lon]).toFixed(6),
        sportarten: new Set()
      });

    const o = orte.get(schluessel);
    for (const a of (r[sp.angebot] || "").split(/[\n;]/)) {
      const treffer = MUC_SPORT[a.trim().toLowerCase()];
      if (treffer) o.sportarten.add(treffer);
    }
  }

  const vorhanden = new Set(DATEN.map(o => ortSchluessel(o.name, o.lat, o.lon)));
  const zeilenNeu = [];
  let ohneSportart = 0, schonDa = 0;

  for (const o of orte.values()) {
    if (!o.sportarten.size) { ohneSportart++; continue; }
    if (!Number.isFinite(o.lat) || !Number.isFinite(o.lon)) continue;

    const schluessel = ortSchluessel(o.name, o.lat, o.lon);
    if (vorhanden.has(schluessel)) { schonDa++; continue; }
    vorhanden.add(schluessel);

    zeilenNeu.push({
      name: o.name, ort: "München",
      lat: o.lat, lon: o.lon,
      sportarten: [...o.sportarten],
      zugang: "öffentlich",          // öffentliche Spielplätze der Stadt
      zeiten: "unbekannt",
      bestaetigt_durch: "Auskunft Gemeinde",
      notizen: "Aus dem Open-Data-Datensatz der Stadt München. Ausstattung und Zustand vor Ort prüfen.",
      freigegeben: true
    });
  }

  await stapelEinfuegen(zeilenNeu, { schonDa, ohneSportart });
}

/* Gemeinsames Einfügen in Stapeln – von beiden Importwegen benutzt. */
async function stapelEinfuegen(zeilen, zaehler){
  let uebernommen = 0, dubletten = 0;

  if (!zeilen.length) {
    Z.importText = `Nichts Neues: ${zaehler.schonDa} schon vorhanden, `
                 + `${zaehler.ohneSportart} ohne passende Sportart.`;
    return zeichne();
  }

  if (ECHT) {
    for (let i = 0; i < zeilen.length; i += 100) {
      const stapel = zeilen.slice(i, i + 100);
      melde(`Importiere … ${Math.min(i + 100, zeilen.length)} / ${zeilen.length}`);

      const { data, error } = await db.from("orte").insert(stapel).select();
      if (!error) { uebernommen += data.length; DATEN.push(...data.map(ausDb)); continue; }

      if (!(error.message || "").includes("duplicate")) {
        console.error(error);
        melde("Import abgebrochen: " + error.message);
        break;
      }
      for (const z of stapel) {
        const r = await db.from("orte").insert(z).select().single();
        if (r.error) {
          if ((r.error.message || "").includes("duplicate")) dubletten++;
          else console.error(r.error);
        } else { uebernommen++; DATEN.push(ausDb(r.data)); }
      }
    }
  } else {
    for (const z of zeilen) DATEN.push(ausDb({ ...z, id:"T" + (DATEN.length + 1) }));
    uebernommen = zeilen.length;
  }

  Z.importText = `${uebernommen} Orte übernommen · `
               + `${zaehler.schonDa + dubletten} lagen auf bekannten Flächen`
               + (zaehler.alsOeffentlichErkannt
                   ? ` (davon ${zaehler.alsOeffentlichErkannt} amtlich als öffentlich bestätigt)` : ``)
               + ` · ${zaehler.ohneSportart} ohne passende Sportart übersprungen.`;
  zeichne();
  melde(`Fertig: ${uebernommen} Orte übernommen.`);
}

/* --------------------------------------------------------------------------
   Kodierung reparieren
   --------------------------------------------------------------------------
   Behördliche CSV-Exporte kommen in drei Varianten daher, und man sieht es
   erst am Ergebnis:
     1. saubere UTF-8-Datei                        -> nichts zu tun
     2. Windows-1252 / Latin-1                     -> als UTF-8 gelesen gibt
                                                      es Ersatzzeichen
     3. UTF-8, die schon einmal falsch gelesen und
        wieder gespeichert wurde ("StraÃŸe")       -> doppelt kodiert
   Diese Funktion erkennt alle drei Fälle und macht daraus lesbaren Text.
   -------------------------------------------------------------------------- */
function textReparieren(puffer){
  let text = new TextDecoder("utf-8").decode(puffer);

  // Fall 2: Ersatzzeichen im Text -> die Datei war gar kein UTF-8.
  if (text.includes("\uFFFD")) {
    const latin = new TextDecoder("windows-1252").decode(puffer);
    console.info("Kodierung: Datei als Windows-1252 gelesen.");
    return latin;
  }

  // Fall 3: typische Doppelkodierung. Ã¤ Ã¶ Ã¼ ÃŸ Ã„ Ã– Ãœ
  if (/Ã[¤¶¼\u009f„–œ]/.test(text)) {
    try {
      const bytes = new Uint8Array([...text].map(z => z.charCodeAt(0) & 0xFF));
      const repariert = new TextDecoder("utf-8", { fatal:true }).decode(bytes);
      console.info("Kodierung: Doppelkodierung repariert.");
      return repariert;
    } catch {
      console.warn("Kodierung: Doppelkodierung erkannt, Reparatur fehlgeschlagen.");
    }
  }

  return text;
}

/* Weiche: GeoJSON oder CSV? */
async function importVerarbeiten(datei){
  const text = textReparieren(await datei.arrayBuffer());
  const anfang = text.trimStart().slice(0, 1);

  if (anfang === "{" || anfang === "[") return importGeoJson(text);
  return importMuenchen(text);
}

/* Sucht einen schon bekannten Ort in der Nähe. 100 Meter Radius – nah genug,
   dass es dieselbe Anlage ist, weit genug für unterschiedliche Messpunkte
   (Stadt misst den Spielplatz-Eingang, OSM die Flächenmitte). */
const MISCH_RADIUS_M = 100;

function bekannterOrtInDerNaehe(lat, lon, radiusM = MISCH_RADIUS_M){
  for (const o of DATEN) {
    if (entfernungKm({lat, lon}, o) * 1000 <= radiusM) return o;
  }
  return null;
}

/* Versucht, einen neuen Eintrag mit einem bereits gesammelten neuen Eintrag
   zu verschmelzen. Regeln wie im Aufräum-SQL:
     gleiche Sportart bis 100 m, beliebige Sportart bis 40 m.
   So wird eine Calisthenics-Anlage aus fünf Geräte-Punkten EIN Ort. */
function mitNeuenMischen(gesammelt, k){
  for (const z of gesammelt) {
    const abstand = entfernungKm({lat:z.lat, lon:z.lon}, {lat:k.lat, lon:k.lon}) * 1000;
    const gleicherSport = z.sportarten.some(s => k.sportarten.includes(s));
    if (!(abstand <= 40 || (gleicherSport && abstand <= MISCH_RADIUS_M))) continue;

    for (const s of k.sportarten)
      if (!z.sportarten.includes(s)) z.sportarten.push(s);
    if (!z.untergrund && k.untergrund) z.untergrund = k.untergrund;

    // Ein echter Name schlägt den Platzhalter "…-Fläche".
    if (/-Fläche$/.test(z.name) && !/-Fläche$/.test(k.name)) z.name = k.name;

    z._teile = (z._teile || 1) + 1;
    return true;
  }
  return false;
}

async function importGeoJson(text){
  let geo;
  try { geo = JSON.parse(text); }
  catch { return melde("Das ist keine gültige GeoJSON-Datei."); }

  const features = geo.features || [];
  if (!features.length) return melde("Die Datei enthält keine Einträge.");

  const vorhanden = new Set(DATEN.map(o => ortSchluessel(o.name, o.lat, o.lon)));

  /* Erster Durchgang: Vereinsgelände einsammeln (sports_centre, club=sport).
     Sie werden nicht selbst als Orte importiert – sie dienen als Anker:
     Jeder ungeklärte Platz im Umkreis von 180 m gilt als vermutliche
     Vereinsanlage und bekommt den Vereinsnamen. */
  const vereine = [];
  for (const f of features) {
    const t = f.properties || {};
    if (t.leisure === "sports_centre" || t.club === "sport") {
      const p = mittelpunkt(f.geometry);
      if (p) vereine.push({ lat:p.lat, lon:p.lon, name:(t.name || "").trim() });
    }
  }
  function vereinInDerNaehe(lat, lon){
    for (const v of vereine)
      if (entfernungKm({lat, lon}, {lat:v.lat, lon:v.lon}) * 1000 <= 180) return v;
    return null;
  }

  const zeilen = [];
  let ohneSportart = 0, schonDa = 0, alsOeffentlichErkannt = 0;

  for (const f of features) {
    const t = f.properties || {};

    /* Vereinsgelände selbst überspringen – die Spielfelder darauf kommen
       als eigene OSM-Einträge und werden gleich richtig eingefärbt. */
    if (t.leisure === "sports_centre" || t.club === "sport") continue;

    const sp = sportartenAusTags(t);
    if (!sp.length) { ohneSportart++; continue; }

    const p = mittelpunkt(f.geometry);
    if (!p) continue;

    /* Abgleich: Liegt hier schon eine Fläche aus einer amtlichen Liste?
       Dann ist es dieselbe Anlage – wir übernehmen sie nicht doppelt,
       ergänzen aber fehlende Sportarten und den Untergrund aus OSM. */
    const treffer = bekannterOrtInDerNaehe(p.lat, p.lon);
    if (treffer) {
      schonDa++;
      if (treffer.bestaetigt_durch === "Auskunft Gemeinde" || treffer.zugang === "öffentlich")
        alsOeffentlichErkannt++;

      /* Liegt der bekannte Ort ungeklärt neben einem Verein? Dann jetzt
         kennzeichnen – so bekommen auch früher importierte Punkte die Farbe. */
      if (treffer.zugang === "unklar" && !treffer.verein) {
        const v = vereinInDerNaehe(p.lat, p.lon);
        if (v) {
          const name = v.name || "Verein in der Nähe";
          if (ECHT) {
            const { error } = await db.from("orte").update({ verein:name }).eq("id", treffer.id);
            if (!error) treffer.verein = name;
          } else treffer.verein = name;
        }
      }

      const fehlende = sp.filter(s => !treffer.sportarten.includes(s));
      const belag = OSM_BELAG[(t.surface || "").toLowerCase()];
      if (ECHT && (fehlende.length || (belag && (!treffer.untergrund || treffer.untergrund === "—")))) {
        const zeile = {};
        if (fehlende.length) zeile.sportarten = [...treffer.sportarten, ...fehlende];
        if (belag && (!treffer.untergrund || treffer.untergrund === "—")) zeile.untergrund = belag;
        const { error } = await db.from("orte").update(zeile).eq("id", treffer.id);
        if (!error) Object.assign(treffer, {
          sportarten: zeile.sportarten || treffer.sportarten,
          untergrund: zeile.untergrund || treffer.untergrund
        });
      }
      continue;
    }

    const name = t.name || sp[0] + "-Fläche";
    const vereinHier = vereinInDerNaehe(p.lat, p.lon);

    const neuerEintrag = {
      name, ort: t["addr:city"] || null,
      lat: p.lat, lon: p.lon,
      sportarten: sp,
      zugang: "unklar", zeiten: "unbekannt", bestaetigt_durch: "nur vermutet",
      untergrund: OSM_BELAG[(t.surface || "").toLowerCase()] || null,
      beleuchtung: t.lit === "yes" ? "ja" : (t.lit === "no" ? "nein" : null),
      verein: vereinHier ? (vereinHier.name || "Verein in der Nähe") : null,
      notizen: "",
      freigegeben: true
    };
    neuerEintrag._verdacht = !!vereinHier
                          || t.access === "private" || t.access === "customers"
                          || !!t.club || t.leisure === "sports_centre"
                          || /verein|sv |tsv |sc |fc |sportanlage|sportzentrum/i.test(name);

    /* Gehört der Punkt zu einem schon gesammelten neuen Ort (Gerät derselben
       Anlage, zweites Feld desselben Geländes)? Dann verschmelzen statt anhängen. */
    if (mitNeuenMischen(zeilen, neuerEintrag)) { continue; }

    const schluessel = ortSchluessel(name, p.lat, p.lon);
    if (vorhanden.has(schluessel)) { schonDa++; continue; }
    vorhanden.add(schluessel);

    zeilen.push(neuerEintrag);
  }

  /* Notizen erst jetzt schreiben – nach dem Verschmelzen wissen wir,
     aus wie vielen OSM-Punkten ein Ort besteht. */
  for (const z of zeilen) {
    const basis = z._verdacht
      ? "Aus OpenStreetMap. Steht in keiner amtlichen Liste öffentlicher Flächen und trägt Hinweise auf eine Vereins- oder Schulanlage – Zugang beim Betreiber klären."
      : "Aus OpenStreetMap. Steht in keiner amtlichen Liste öffentlicher Flächen. Zugang ungeklärt, vor Ort oder bei der Gemeinde prüfen.";
    z.notizen = basis + (z._teile > 1 ? ` ${z._teile} OSM-Einträge zu einer Anlage zusammengefasst.` : "");
    delete z._teile;
    delete z._verdacht;
  }

  await stapelEinfuegen(zeilen, { schonDa, ohneSportart, alsOeffentlichErkannt });
}

// Datenschutzerklärung von PrivacyBee. Das Skript wird erst geladen, wenn
// jemand diese Seite öffnet. Lädt es nicht, erscheint unsere eigene Fassung.
function privacyBeeLaden(){
  const eigen = () => {
    const w = document.getElementById("datenschutzWidget");
    const e = document.getElementById("datenschutzEigen");
    if (w && e){ w.hidden = true; e.hidden = false; }
  };
  if (window.customElements && customElements.get("privacybee-widget")) return;
  let sk = document.getElementById("privacybeeSkript");
  if (!sk){
    sk = document.createElement("script");
    sk.id = "privacybeeSkript";
    sk.src = "https://app.privacybee.io/widget.js";
    sk.defer = true;
    sk.addEventListener("error", () => { sk.dataset.fehler = "1"; eigen(); });
    document.head.appendChild(sk);
  } else if (sk.dataset.fehler){
    eigen();
  }
}

function fehlerTechnik(){
  const o = ort(Z.auswahlId);
  return [
    "Version: 0.1",

async function fehlerSenden(){
  const text = (document.getElementById("fehlertext")?.value || "").trim();
  const kontakt = (document.getElementById("fehlerkontakt")?.value || "").trim();
  if (!text) return melde("Bitte kurz beschreiben, was passiert ist.");
  const technik = fehlerTechnik();

  if (ECHT) {
    const { error } = await db.from("fehlerberichte")
      .insert({ text, kontakt: kontakt || null, technik });
    if (!error) {
      Z.ansicht = "liste"; zeichne();
      return melde("Danke! Deine Meldung ist angekommen.");
    }
    console.error(error);
  }
  /* Notlösung: Mailprogramm mit fertiger Nachricht öffnen. */
  if (!confirm("Die Meldung konnte nicht gespeichert werden. Stattdessen per Mail schicken?")) return;
  location.href = "mailto:" + RECHT.email
    + "?subject=" + encodeURIComponent("Platzfrei Fehlermeldung")
    + "&body=" + encodeURIComponent(text + (kontakt ? "\n\nKontakt: " + kontakt : "")
                                    + "\n\n--- Technische Angaben ---\n" + technik);
}

/* ==========================================================================
   9. BOTTOM-SHEET (nur mobil)
   --------------------------------------------------------------------------
   Hier stecken die Prinzipien aus Apples "Designing Fluid Interfaces":
     §2  Der Inhalt klebt 1:1 am Finger, mit Rücksicht auf den Greifpunkt.
     §3  Jede Bewegung ist unterbrechbar – Anfassen stoppt die Feder sofort.
     §5  Beim Loslassen übernimmt die Feder die Geschwindigkeit des Fingers.
     §6  Das Ziel wird aus dem Schwung projiziert, nicht aus der Endposition.
     §9  An den Rändern wird gummiartig gebremst statt hart gestoppt.
   ========================================================================== */

const sheet = (function(){
  const aside  = document.querySelector("aside");
  const griff  = document.getElementById("griff");
  const mobil  = window.matchMedia("(max-width: 880px)");
  const sanft  = window.matchMedia("(prefers-reduced-motion: reduce)");

  /* Rastpunkte als Anteil der Bildschirmhöhe, den das Sheet einnimmt. */
  /* Unterste Stufe: nur Griff und Suchfeld schauen heraus, die Karte hat
     fast den ganzen Bildschirm. Ihr Anteil hängt von der Bildschirmhöhe ab. */
  const RASTEN = [0.14, 0.42, 0.68, 0.94];
  const sicherUnten = (() => {        // Höhe des Home-Balkens beim iPhone
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden";
    document.body.appendChild(d);
    const h = parseFloat(getComputedStyle(d).paddingBottom) || 0;
    d.remove();
    return h;
  })();
  const untersteRaste = () => {
    RASTEN[0] = Math.min(0.2, (92 + sicherUnten) / window.innerHeight);
  };
  untersteRaste();
  const HOEHE  = 0.94;              // muss zur CSS-Höhe passen

  let y = 0;                        // aktuelle Verschiebung in Pixeln
  let ziel = 0;
  let v = 0;                        // Geschwindigkeit in px/s
  let laeuft = false;
  let zieht = false;
  let griffOffset = 0;
  let verlauf = [];                 // die letzten Punkte für die Geschwindigkeit

  const vh = () => window.innerHeight;
  const yFuer = anteil => (HOEHE - anteil) * vh();
  const minY = () => yFuer(RASTEN[RASTEN.length - 1]);   // ganz offen
  const maxY = () => yFuer(RASTEN[0]);                   // ganz zu

  function setzen(neu){
    y = neu;
    aside.style.transform = `translateY(${y}px)`;
    /* Die Innenhöhe folgt dem sichtbaren Teil – sonst rutscht die
       Fußleiste unter den Bildschirmrand, sobald das Sheet halb zu ist. */
    /* Das Sheet ist HOEHE hoch und um y nach unten geschoben –
       sichtbar bleibt also HOEHE minus y, nicht Fensterhöhe minus y. */
    aside.style.setProperty("--sichtbar", Math.max(0, HOEHE * vh() - y) + "px");
    /* Für den Standort-Knopf, der auf dem Handy über dem Blatt schwebt. */
    document.documentElement.style.setProperty("--blatt-sichtbar", Math.max(0, HOEHE * vh() - y) + "px");
  }

  /* §9 Je weiter über den Rand, desto weniger folgt das Sheet. */
  function gummi(ueber, groesse, k = 0.55){
    return (ueber * groesse * k) / (groesse + k * Math.abs(ueber));
  }

  function begrenzen(roh){
    if (roh < minY()) return minY() - gummi(minY() - roh, vh());
    if (roh > maxY()) return maxY() + gummi(roh - maxY(), vh());
    return roh;
  }

  /* §6 Wohin würde der Schwung das Sheet tragen? Exponentieller Auslauf,
     dieselbe Formel wie beim Scrollen. */
  function projektion(geschwindigkeit, bremse = 0.998){
    return (geschwindigkeit / 1000) * bremse / (1 - bremse);
  }

  function naechsteRaste(punkt){
    let beste = yFuer(RASTEN[0]), abstand = Infinity;
    for (const r of RASTEN) {
      const py = yFuer(r);
      if (Math.abs(py - punkt) < abstand) { abstand = Math.abs(py - punkt); beste = py; }
    }
    return beste;
  }

  /* §4 Kritisch gedämpfte Feder – kein Überschwingen. Sie startet immer
     beim aktuellen Bildschirmwert und mit der übergebenen Geschwindigkeit,
     damit zwischen Ziehen und Animieren keine Naht entsteht (§5). */
  function federZu(neuesZiel, startGeschwindigkeit = 0){
    ziel = neuesZiel;
    v = startGeschwindigkeit;

    if (sanft.matches) { setzen(ziel); laeuft = false; return; }
    if (laeuft) return;                 // läuft schon, neues Ziel reicht
    laeuft = true;

    const steifheit = 170, daempfung = 26;   // daempfung ≈ 2·√steifheit
    let zuletzt = performance.now();

    (function schritt(jetzt){
      if (!laeuft) return;
      const dt = Math.min((jetzt - zuletzt) / 1000, 1 / 30);
      zuletzt = jetzt;

      const kraft = -steifheit * (y - ziel) - daempfung * v;
      v += kraft * dt;
      setzen(y + v * dt);

      if (Math.abs(y - ziel) < 0.4 && Math.abs(v) < 12) {
        setzen(ziel); v = 0; laeuft = false; return;
      }
      requestAnimationFrame(schritt);
    })(zuletzt);
  }

  // ----- Gesten -----

  griff.addEventListener("pointerdown", e => {
    if (!mobil.matches) return;
    griff.setPointerCapture(e.pointerId);
    laeuft = false;                    // §3 Anfassen unterbricht sofort
    zieht = true;
    griffOffset = e.clientY - y;       // §2 Greifpunkt respektieren
    verlauf = [{ y: e.clientY, t: performance.now() }];
    e.preventDefault();
  });

  griff.addEventListener("pointermove", e => {
    if (!zieht) return;
    setzen(begrenzen(e.clientY - griffOffset));
    verlauf.push({ y: e.clientY, t: performance.now() });
    if (verlauf.length > 6) verlauf.shift();
  });

  function loslassen(e){
    if (!zieht) return;
    try { griff.releasePointerCapture(e.pointerId); } catch {}
    abschliessen();
  }

  let letzteRaste = null;
  function abschliessen(){
    zieht = false;
    /* Geschwindigkeit aus den letzten Punkten, nicht nur dem letzten. */
    const a = verlauf[0], b = verlauf[verlauf.length - 1];
    const dt = b && a ? (b.t - a.t) / 1000 : 0;
    const geschwindigkeit = dt > 0.008 ? (b.y - a.y) / dt : 0;

    const projiziert = y + projektion(geschwindigkeit);
    const raste = naechsteRaste(projiziert);
    /* Kurzes Ticken beim Einrasten auf einer neuen Stufe (nur Android). */
    if (letzteRaste !== null && Math.abs(raste - letzteRaste) > 1) {
      try { navigator.vibrate?.(8); } catch {}
    }
    letzteRaste = raste;
    federZu(raste, geschwindigkeit);
  }

  /* Größere Anfassfläche: Nicht nur der Griff, auch Kopfbereich,
     Filterleiste und Fußleiste ziehen das Blatt. In der Liste gilt wie in
     Apple Karten: Ist das Blatt noch nicht ganz offen, zieht ein Wisch nach
     oben zuerst das Blatt auf; steht die Liste ganz oben, zieht ein Wisch
     nach unten das Blatt wieder zu. */
  let beruehrung = null;
  let gezogenBis = 0;

  aside.addEventListener("touchstart", e => {
    beruehrung = null;
    if (!mobil.matches || e.touches.length !== 1) return;
    if (e.target.closest("#griff, input, textarea, select")) return;
    const t = e.touches[0];
    beruehrung = { x:t.clientX, y:t.clientY, modus:"?",
                   liste:e.target.closest(".rolle") };
  }, { passive:true });

  aside.addEventListener("touchmove", e => {
    const b = beruehrung;
    if (!b || e.touches.length !== 1) return;
    const t = e.touches[0];
    if (b.modus === "?") {
      const dx = t.clientX - b.x, dy = t.clientY - b.y;
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      if (Math.abs(dx) > Math.abs(dy)) { b.modus = "lassen"; return; }
      let ziehen = true;
      if (b.liste) {
        const ganzOffen = y <= minY() + 2;
        ziehen = (dy < 0 && !ganzOffen) || (dy > 0 && b.liste.scrollTop <= 0);
      }
      if (!ziehen) { b.modus = "lassen"; return; }
      b.modus = "ziehen";
      laeuft = false;                  // §3 Anfassen unterbricht sofort
      zieht = true;
      griffOffset = t.clientY - y;
      verlauf = [{ y:t.clientY, t:performance.now() }];
    }
    if (b.modus !== "ziehen") return;
    if (e.cancelable) e.preventDefault();
    setzen(begrenzen(t.clientY - griffOffset));
    verlauf.push({ y:t.clientY, t:performance.now() });
    if (verlauf.length > 6) verlauf.shift();
  }, { passive:false });

  function beruehrungEnde(){
    if (beruehrung?.modus === "ziehen") { gezogenBis = Date.now() + 350; abschliessen(); }
    beruehrung = null;
  }
  aside.addEventListener("touchend", beruehrungEnde);
  aside.addEventListener("touchcancel", beruehrungEnde);

  /* Nach dem Ziehen soll kein Platz aus Versehen aufgehen. */
  aside.addEventListener("click", e => {
    if (Date.now() < gezogenBis) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  griff.addEventListener("pointerup", loslassen);
  griff.addEventListener("pointercancel", loslassen);

  /* Tippen auf den Griff schaltet zwischen klein und groß um –
     §2 Agency: es gibt immer auch einen Weg ohne Geste. */
  griff.addEventListener("click", () => {
    if (!mobil.matches || verlauf.length > 3) return;
    const offen = y < (yFuer(RASTEN[1]) + yFuer(RASTEN[3])) / 2;
    federZu(yFuer(offen ? RASTEN[1] : RASTEN[3]));
  });
  griff.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    griff.click();
  });

  function ausrichten(){
    if (!mobil.matches) { aside.style.transform = ""; return; }
    untersteRaste();
    setzen(naechsteRaste(y || yFuer(RASTEN[2])));
  }

  window.addEventListener("resize", ausrichten);
  mobil.addEventListener("change", ausrichten);

  return {
    start(){ if (mobil.matches) setzen(yFuer(RASTEN[2])); },
    /* Beim Öffnen eines Platzes soll die Liste Platz machen. */
    aufmachen(){ if (mobil.matches) federZu(yFuer(RASTEN[3])); },
    /* Mindestens halb offen, damit man die Angaben eines Platzes sieht. */
    mitte(){ if (mobil.matches && y > yFuer(RASTEN[2]) + 1) federZu(yFuer(RASTEN[2])); },
    /* Wer die Karte verschiebt, will die Karte sehen. */
    klein(){ if (mobil.matches && !zieht && y < yFuer(RASTEN[1]) - 1) federZu(yFuer(RASTEN[1])); }
  };
})();

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-sport],[data-nurfrei],[data-ort],[data-gehe],"+
                             "[data-speichern],[data-neuspeichern],[data-geprueft],"+
                             "[data-export],[data-anmelden],[data-km],"+
                             "[data-merken],[data-gemerkt],[data-melden],[data-route],"+
                             "[data-nurlicht],[data-belegt],[data-sortierung],[data-bereich],[data-mehr],"+
                             "[data-schildok],[data-schildweg],[data-loeschen],[data-fehlersenden],[data-fehlererledigt],"+
                             "[data-suchweg],[data-teilen],[data-abmelden],[data-hierpunkt],[data-vereinszeitensenden],"+
                             "[data-neuok],[data-neuweg],[data-vzok],[data-vzweg]");
  if (!t) return;

  if (t.dataset.hierpunkt)  { return hierPunktSetzen(); }
  if (t.dataset.vereinszeitensenden) { return vereinszeitenSenden(); }
  if (t.dataset.neuok)      { return neuenOrtPruefen(t.dataset.neuok, true); }
  if (t.dataset.neuweg)     { return neuenOrtPruefen(t.dataset.neuweg, false); }
  if (t.dataset.vzok)       { return vereinszeitenPruefen(t.dataset.vzok, true); }
  if (t.dataset.vzweg)      { return vereinszeitenPruefen(t.dataset.vzweg, false); }
  if (t.dataset.belegt)     { Z.nurBelegt = !Z.nurBelegt; return zeichne(); }
  if (t.dataset.suchweg)    { Z.suche = ""; zeichne(); return; }
  if (t.dataset.teilen)     { return teilen(t.dataset.teilen); }
  if (t.dataset.abmelden)   { return abmelden(); }
  if (t.dataset.schildok)   { return schildPruefen(t.dataset.schildok, true); }
  if (t.dataset.schildweg)  { return schildPruefen(t.dataset.schildweg, false); }
  if (t.dataset.loeschen)   { return ortLoeschen(t.dataset.loeschen); }
  if (t.dataset.fehlersenden) { return fehlerSenden(); }
  if (t.dataset.fehlererledigt) { return fehlerErledigt(t.dataset.fehlererledigt); }
  if (t.dataset.mehr)       { Z.filterOffen = t.dataset.mehr === "1"; return zeichne(); }
  if (t.dataset.sortierung) { Z.sortierung = t.dataset.sortierung; return zeichne(); }
  if (t.dataset.bereich)    { Z.bereich = null; mitteBeimZeichnen = karte.getCenter();
                              return zeichne(); }

  /* Stern zuerst prüfen: er sitzt innerhalb der Zeile und darf nicht
     gleichzeitig den Platz öffnen. */
  if (t.dataset.merken)     { e.stopPropagation(); return merkenUmschalten(t.dataset.merken); }
  if (t.dataset.gemerkt)    { Z.nurGemerkt = t.dataset.gemerkt === "1"; return zeichne(); }
  if (t.dataset.melden)     { return meldungAbgeben(t.dataset.melden); }
  if (t.dataset.route)      { return routeOeffnen(t.dataset.route); }
  if (t.dataset.nurlicht)   { Z.nurLicht = t.dataset.nurlicht === "1"; return zeichne(); }
  if (t.dataset.km !== undefined) { Z.maxKm = +t.dataset.km || null; return zeichne(); }
  if (t.dataset.anmelden)   { return anmelden(); }

  if (t.dataset.sport)      { Z.sportart = t.dataset.sport; return zeichne(); }
  if (t.dataset.nurfrei)    { Z.nurFrei = t.dataset.nurfrei==="1"; return zeichne(); }
  if (t.dataset.ort) {
    Z.auswahlId = t.dataset.ort; Z.ansicht = "detail"; zeichne();
    const o = ort(t.dataset.ort);
    if (o) karte.flyTo([o.lat, o.lon], Math.max(karte.getZoom(), 16), { duration:.6 });
    sheet.aufmachen();
    return;
  }
  if (t.dataset.gehe)       { Z.ansicht=t.dataset.gehe; return zeichne(); }
  if (t.dataset.speichern)  { return speichern(); }
  if (t.dataset.neuspeichern){ return neuSpeichern(); }
  if (t.dataset.export)     { return exportieren(); }
  if (t.dataset.geprueft)   { return alsGepruefT(t.dataset.geprueft); }
});

/* Versteckter Weg zur Admin-Anmeldung: Es gibt keinen sichtbaren Knopf.
   Entweder die Adresse mit #admin öffnen oder fünfmal schnell aufs Logo
   tippen. Das ist nur Sichtschutz – die eigentliche Sicherheit liegt in
   Supabase (Passwort, Zeilenrechte, ist_admin()). */
function anmeldungOeffnen(){
  if (Z.admin) return;
  Z.ansicht = "anmelden";
  zeichne();
  sheet.aufmachen();
  setTimeout(()=>document.getElementById("feld-email")?.focus(), 30);
}
function adminAdresseOeffnen(){
  if (location.hash !== "#admin") return;
  history.replaceState(history.state, "", location.pathname + location.search);
  anmeldungOeffnen();
}
window.addEventListener("hashchange", adminAdresseOeffnen);
let logoTipps = [];
/* Logo oben (Desktop) oder Logo im Suchfeld (Handy). */
document.addEventListener("click", e => {

  const jetzt = Date.now();

/* Dateiauswahl beim Import – "change" steigt nicht wie "click" im Baum auf,
   deshalb ein eigener Lauscher. */
document.addEventListener("change", e=>{
  if (e.target.id === "importdatei" && e.target.files?.[0])
    importVerarbeiten(e.target.files[0]);
  if (e.target.id === "schild-datei" && e.target.files?.[0])
    schildHochladen(e.target.files[0]);
  if (e.target.id === "neu-foto" && e.target.files?.[0]) {

    Z.neuFoto = e.target.files[0];
    Z.neuEntwurf = neuFormularWerte();
    zeichne();
    melde("Foto gewählt.");
  }
});

/* "Ich stehe gerade dort": Standort holen und als Position des neuen
   Ortes nehmen. */
function hierPunktSetzen(){
  if (!navigator.geolocation) return melde("Dein Gerät gibt keinen Standort heraus.");
  Z.neuEntwurf = neuFormularWerte();
  melde("Standort wird gesucht …");
  navigator.geolocation.getCurrentPosition(
    p => {
      Z.position = { lat:p.coords.latitude, lon:p.coords.longitude };
      Z.positionEcht = true;
      Z.neuerPunkt = { lat:+p.coords.latitude.toFixed(6), lon:+p.coords.longitude.toFixed(6) };
      karte.setView([Z.neuerPunkt.lat, Z.neuerPunkt.lon], Math.max(karte.getZoom(), 17));
      zeichne();
      melde("Position gesetzt.");
    },
    () => melde("Standort nicht freigegeben. Tippe stattdessen auf die Karte."),
    { enableHighAccuracy:true, timeout:10000 });
}

function standortHolen(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => {
      Z.position = { lat:p.coords.latitude, lon:p.coords.longitude };
      Z.positionEcht = true;
      if (ichMarker) karte.removeLayer(ichMarker);
      ichMarker = L.circleMarker([Z.position.lat, Z.position.lon], {
        radius:7, color:"#fff", weight:2.5, fillColor:"#2E6BE0", fillOpacity:1
      }).addTo(karte);
      zeichne();
      wetterLaden();   // jetzt mit der echten Position
    },
    () => {}   // kein Standort: München-Mitte bleibt der Bezugspunkt
  );
}

/* Knopf unten links: springt zum eigenen Standort. Fragt beim ersten Mal
   nach der Freigabe, falls das beim Start noch nicht passiert ist. */
function zuMeinemStandort(){
  if (!navigator.geolocation) return melde("Dein Browser kann keinen Standort bestimmen.");
  navigator.geolocation.getCurrentPosition(
    p => {
      const neu = !Z.positionEcht;
      Z.position = { lat:p.coords.latitude, lon:p.coords.longitude };
      Z.positionEcht = true;
      if (ichMarker) karte.removeLayer(ichMarker);
      ichMarker = L.circleMarker([Z.position.lat, Z.position.lon], {
        radius:7, color:"#fff", weight:2.5, fillColor:"#2E6BE0", fillOpacity:1
      }).addTo(karte);
      karte.flyTo([Z.position.lat, Z.position.lon], Math.max(karte.getZoom(), 15), { duration:.6 });
      if (neu) { zeichne(); wetterLaden(); }
    },
    () => melde("Standort nicht freigegeben. Erlaube ihn in den Browser-Einstellungen."),
    { enableHighAccuracy:true, timeout:10000, maximumAge:30000 }
  );
}

const StandortKnopf = L.Control.extend({
  options:{ position:"bottomleft" },
  onAdd(){
    const box = L.DomUtil.create("div", "leaflet-bar standort-knopf");
    box.innerHTML = `<a href="#" role="button" title="Zu meinem Standort" aria-label="Zu meinem Standort">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></a>
      <a href="#" role="button" class="neu-knopf" title="Platz hinzufügen" aria-label="Platz hinzufügen">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
        stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>`;
    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.on(box.firstElementChild, "click", e => { L.DomEvent.preventDefault(e); zuMeinemStandort(); });
    L.DomEvent.on(box.lastElementChild, "click", e => {
      L.DomEvent.preventDefault(e);
      Z.ansicht = "neu"; zeichne();
      sheet.mitte();
      melde("Tippe auf die Karte, wo der Platz ist.");
    });
    return box;
  }
});
new StandortKnopf().addTo(karte);

zeichne();
standortHolen();

/* Reihenfolge beim Start: erst schauen, ob eine Sitzung aus einem früheren
   Besuch noch gilt, dann die Orte laden. Supabase merkt sich die Anmeldung
   selbst, deshalb muss man sich nicht bei jedem Neuladen neu anmelden. */
sheet.start();
karte.on("dragstart", () => sheet.klein());
adminAdresseOeffnen();

(async function start(){
  await adminPruefen();
  await datenLaden();
  platzAusAdresse();
  await Promise.all([meldungenLaden(), bestaetigungenLaden()]);
  zeichne();
  wetterLaden();          // läuft nebenher, blockiert den Start nicht
})();

/* Service Worker: sorgt dafür, dass die App nach dem ersten Besuch auch mit
   schlechtem oder ohne Netz aufgeht. Funktioniert nur unter https – lokal
   aus der Datei geöffnet passiert hier einfach nichts. */
if ("serviceWorker" in navigator && location.protocol === "https:")
  navigator.serviceWorker.register("sw.js").catch(()=>{});
