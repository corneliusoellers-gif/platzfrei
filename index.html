    /* Gehört der Punkt zu einem schon gesammelten neuen Ort (Gerät derselben
       Anlage, zweites Feld desselben Geländes)? Dann verschmelzen statt anhängen. */
    if (mitNeuenMischen(rasterNah(neuRaster, p.lat, p.lon), neuerEintrag)) { continue; }

    const schluessel = ortSchluessel(name, p.lat, p.lon);
    if (vorhanden.has(schluessel)) { schonDa++; continue; }
    vorhanden.add(schluessel);

    zeilen.push(neuerEintrag);
    rasterRein(neuRaster, neuerEintrag);
  }

  /* Notizen erst jetzt schreiben – nach dem Verschmelzen wissen wir,
     aus wie vielen OSM-Punkten ein Ort besteht. */
  for (const z of zeilen) {
    const basis = z._verdacht
      ? "Aus OpenStreetMap. Steht in keiner amtlichen Liste öffentlicher Flächen und trägt Hinweise auf eine Vereins- oder Schulanlage – Zugang beim Betreiber klären."
      : "Aus OpenStreetMap. Steht in keiner amtlichen Liste öffentlicher Flächen. Zugang ungeklärt, vor Ort oder bei der Gemeinde prüfen.";
    z.notizen = (z._lage ? `Aus OpenStreetMap. ${z._lage}` : basis)
      + (z._teile > 1 ? ` ${z._teile} OSM-Einträge zu einer Anlage zusammengefasst.` : "");
    delete z._teile; delete z._lage;
    delete z._verdacht;
  }

  const eingestuft = await vorhandeneEinstufen(umgebung, nachMerkmal);
  await stapelEinfuegen(zeilen, { schonDa, ohneSportart, alsOeffentlichErkannt, eingestuft });
}

/* --------------------------------------------------------------------------
   Lage-Auswertung
   --------------------------------------------------------------------------
   OSM sagt nicht, ob man spielen darf, aber es sagt, WO der Platz liegt.
   Im Park oder auf dem Spielplatz gehört er fast immer der Gemeinde und ist
   frei nutzbar. Auf dem Schulgelände ist er ein Schulhof. Das ergibt eine
   eigene Stufe ("vermutlich …", Beleg "Lage (OSM)"), nie "öffentlich".
   Geprüft wird über das umschließende Rechteck der Fläche – bei krummen
   Parks ist das etwas großzügig, deshalb nur Flächen bis etwa 5 km.
   -------------------------------------------------------------------------- */
const UMGEBUNG_ZELLE = 0.01;
function umgebungAufbauen(features){
  const raster = new Map();
  let anzahl = 0;
  for (const f of features) {
    const b = f.bounds, t = f.properties || {};
    if (!b) continue;
    const art = t.amenity === "school" ? "schule"
      : /^(park|playground|recreation_ground)$/.test(t.leisure || "") || t.landuse === "recreation_ground" ? "park" : null;
    if (!art) continue;
    if (b.maxlat - b.minlat > 0.05 || b.maxlon - b.minlon > 0.07) continue;
    const eintrag = { art, b, name:(t.name || "").trim(), spielplatz:t.leisure === "playground" };
    anzahl++;
    for (let a = Math.floor(b.minlat / UMGEBUNG_ZELLE); a <= Math.floor(b.maxlat / UMGEBUNG_ZELLE); a++)
      for (let c = Math.floor(b.minlon / UMGEBUNG_ZELLE); c <= Math.floor(b.maxlon / UMGEBUNG_ZELLE); c++) {
        const k = a + ":" + c;
        (raster.get(k) || raster.set(k, []).get(k)).push(eintrag);
      }
  }
  return anzahl ? raster : null;
}

/* Namen, die praktisch nur öffentliche Plätze tragen. "Sportplatz" gehört
   bewusst nicht dazu – das sind meist Vereinsplätze. */
const OEFFENTLICH_NAME = /bolz|streetball|basketballplatz|basketballfeld|skate|pumptrack|dirt ?park|calisthenics|street ?workout|fitness ?park|trimm|freizeit(anlage|gelände|platz|fläche)|jugendplatz|aktivpark|mehrgenerationen|spielplatz|spielwiese|bürgerpark|stadtpark/i;

function lageEinstufen(umgebung, lat, lon, t = {}){
  if (/^(private|no|customers|members)$/.test(t.access || "")) return null;
  if (t.fee === "yes" || t.indoor === "yes" || t.building) return null;
  const amt = /\b(stadt|gemeinde|markt|bezirksamt|landeshauptstadt)\b/i.test(t.operator || "");
  const offen = /^(yes|public|permissive)$/.test(t.access || "");
  const hier = umgebung
    ? (umgebung.get(Math.floor(lat / UMGEBUNG_ZELLE) + ":" + Math.floor(lon / UMGEBUNG_ZELLE)) || [])
        .filter(u => lat >= u.b.minlat && lat <= u.b.maxlat && lon >= u.b.minlon && lon <= u.b.maxlon)
    : [];
  const schule = hier.find(u => u.art === "schule");
  if (schule) return { zugang:"vermutlich Schulhof",
    grund:`Liegt auf einem Schulgelände${schule.name ? ` (${schule.name})` : ""}, vermutlich nur außerhalb der Unterrichtszeit nutzbar. Nicht amtlich bestätigt.` };
  const park = hier.find(u => u.spielplatz) || hier.find(u => u.art === "park");
  if (park || offen || amt) {
    const wo = park ? (park.spielplatz ? "auf einem Spielplatz" : "in einem Park") + (park.name ? ` (${park.name})` : "")
      : amt ? `in der Verwaltung von ${t.operator}` : "laut OSM öffentlich zugänglich";
    return { zugang:"vermutlich öffentlich",
      grund:`Liegt ${wo}. Solche Plätze sind fast immer frei nutzbar. Nicht amtlich bestätigt.` };
  }
  /* Merkmale am Platz selbst */
  const name = (t.name || "").trim();
  const sport = (t.sport || "").toLowerCase();
  let warum = null;
  if (name && OEFFENTLICH_NAME.test(name)) warum = `Heißt „${name}“`;
  else if (t.leisure === "fitness_station") warum = "Ist als Fitnessgerät im Freien eingetragen";
  else if (/skateboard|bmx/.test(sport)) warum = "Ist als Skate- oder BMX-Anlage eingetragen";
  else if (t.playground) warum = "Ist als Spielgerät auf einem Spielplatz eingetragen";
  else if (t.fee === "no") warum = "Ist in OSM als kostenlos eingetragen";
  if (warum) return { zugang:"vermutlich öffentlich",
    grund:`${warum}. Solche Plätze sind fast immer frei nutzbar. Nicht amtlich bestätigt.` };
  return null;
}

/* Schon vorhandene, ungeklärte Plätze im geladenen Gebiet einstufen. */
async function vorhandeneEinstufen(umgebung, nachMerkmal = new Map()){
  const gruppen = {};
  for (const [o, zugang] of nachMerkmal) (gruppen[zugang] ||= []).push(o);
  if (umgebung) for (const o of DATEN) {
    if (nachMerkmal.has(o)) continue;
    if (o.zugang !== "unklar" || o.bestaetigtDurch !== "nur vermutet" || vereinsMarke(o)) continue;
    const lage = lageEinstufen(umgebung, o.lat, o.lon);
    if (!lage) continue;
    (gruppen[lage.zugang] ||= []).push(o);
  }
  let n = 0;
  for (const [zugang, orte] of Object.entries(gruppen)) {
    for (let i = 0; i < orte.length; i += 200) {
      const teil = orte.slice(i, i + 200);
      if (ECHT) {
        const { error } = await db.from("orte")
          .update({ zugang, bestaetigt_durch:"Lage (OSM)" })
          .in("id", teil.map(o => o.id));
        if (error) { console.error(error); continue; }
      }
      for (const o of teil) { o.zugang = zugang; o.bestaetigtDurch = "Lage (OSM)"; }
      n += teil.length;
    }
  }
  return n;
}

/* --------------------------------------------------------------------------

   --------------------------------------------------------------------------

   Der Verlauf (orte_aenderungen) zeigt die letzten 50 Änderungen; jede kann

   -------------------------------------------------------------------------- */
const APP_FELD = Object.fromEntries(Object.entries(DB_SPALTE).map(([a, d]) => [d, a]));
let AENDERUNGEN = null;            // null = noch nicht geladen

async function aenderungenLaden(){
  if (!ECHT) { AENDERUNGEN = []; return; }
  const { data, error } = await db.from("orte_aenderungen")
    .select("id,ort_id,zeit,wer,quelle,alt,neu")

  AENDERUNGEN = data || [];

  return new Date(t).toLocaleString("de-DE",

function platzLink(id){
  const o = ort(String(id));

           : `Platz ${esc(String(id).slice(0, 8))}`;
}

/* Nur die Felder, die sich wirklich geändert haben. */
function unterschiede(alt, neu){
  if (!alt) return `<p>neu angelegt</p>`;
  if (!neu) return `<p>gelöscht</p>`;
  const zeilen = [];
  for (const k of Object.keys(neu)) {
    if (JSON.stringify(alt[k]) === JSON.stringify(neu[k])) continue;
    const kurz = v => v == null || v === "" ? "–" : String(v).length > 80 ? String(v).slice(0, 80) + " …" : String(v);
    zeilen.push(`<li><b>${esc(k)}</b>: ${esc(kurz(alt[k]))} → ${esc(kurz(neu[k]))}</li>`);
  }
  return zeilen.length ? `<ul style="margin:4px 0 0 18px;padding:0">${zeilen.join("")}</ul>` : `<p>keine sichtbare Änderung</p>`;
}

async function vorschlagEntscheiden(id, annehmen){
  const v = VORSCHLAEGE.find(x => String(x.id) === String(id));
  if (!v) return;
  if (annehmen) {
    const o = ort(String(v.ort_id));
    if (!o) return melde("Der Platz ist gerade nicht geladen.");
    const feld = APP_FELD[v.feld] || v.feld;
    if (NUR_ADMIN.includes(feld)) {
      const neu = { zugang:o.zugang, zeiten:o.zeiten, bestaetigtDurch:o.bestaetigtDurch, [feld]:v.neuer_wert };
      if (!await zugangSetzen(o.id, neu.zugang, neu.zeiten, neu.bestaetigtDurch)) return;
    } else if (ECHT) {
      const { error } = await db.from("orte").update({ [v.feld]:v.neuer_wert, geprueft_am:heute() }).eq("id", o.id);
      if (error) { console.error(error); return melde("Abgelehnt: " + error.message); }
    }
    o[feld] = feld === "zustand" ? +v.neuer_wert : v.neuer_wert;
    o.geprueft = heute();
    speicherVeraltet();
  }
  if (ECHT) {
    const { error } = await db.from("vorschlaege").update({ erledigt:true }).eq("id", v.id);
    if (error) { console.error(error); return melde("Abgelehnt: " + error.message); }
  }
  VORSCHLAEGE = VORSCHLAEGE.filter(x => x !== v);
  AENDERUNGEN = null;
  zeichne();
  melde(annehmen ? "Übernommen." : "Abgelehnt.");
}

async function aenderungZurueckdrehen(id){
  const a = (AENDERUNGEN || []).find(x => String(x.id) === String(id));
  if (!confirm("Diese Änderung zurückdrehen? Der Platz bekommt wieder die alten Werte.")) return;
  if (ECHT) {
    const { data, error } = await db.rpc("aenderung_zurueck", { p_id:+id });
    if (error) { console.error(error); return melde("Abgelehnt: " + error.message); }
    melde(data ? String(data) : "Zurückgedreht.");
  }
  const o = a && ort(String(a.ort_id));
  if (o && a.alt) {
    for (const [k, w] of Object.entries(a.alt))
      if (JSON.stringify(w) !== JSON.stringify(a.neu?.[k])) o[APP_FELD[k] || k] = w;
    speicherVeraltet();
  }
  AENDERUNGEN = null;
  zeichne();
}

   --------------------------------------------------------------------------
   Am Laptop ganze Seiten ohne Karte, am Handy normale Ansichten im Blatt.
   Alle Zahlen kommen live aus den geladenen Plätzen – nichts ist geschätzt.
   -------------------------------------------------------------------------- */
function kennzahlen(){
  if (KENNZAHLEN) return { ...KENNZAHLEN };   // aus der Datenbank (ganz Deutschland)
  const z = { plaetze:DATEN.length, frei:0, verein:0, vereinZeiten:0, belegt:0, sportarten:new Set() };
  const gemeinden = new Set(), orte = new Set();
  for (const o of DATEN) {
    if (frei(o)) z.frei++;
    const v = vereinsMarke(o);
    if (v && !v[1]) z.verein++;
    if (o.bestaetigtDurch === "Auskunft Verein") z.vereinZeiten++;
    if (belegt(o)) z.belegt++;
    /* Nur der Ort, ohne angehängte Straße ("München, Candidstraße"). */
    const ortsname = o.ort && o.ort !== "—" ? o.ort.split(",")[0].trim() : "";
    if (o.bestaetigtDurch === "Auskunft Gemeinde" && ortsname) gemeinden.add(ortsname);
    if (ortsname) orte.add(ortsname);
    (o.sportarten || []).forEach(s => z.sportarten.add(s));
  }
  z.gemeinden = gemeinden.size; z.orte = orte.size; z.sportarten = z.sportarten.size;
  return z;
}
const zahlText = n => n.toLocaleString("de-DE");
/* Kleine Zahlen wirken leer statt einladend: erst ab einer Mindestgröße zeigen. */
const ZAHL_AB = { verein:300, vereinZeiten:30, gemeinden:20 };
function kachel(n, text, klasse = "", ab = 0){
  return n >= ab ? `<div class="zahl${klasse ? " " + klasse : ""}"><b>${zahlText(n)}</b><small>${text}</small></div>` : ``;
}

function ueberFuss(){
  return `<div class="ueber-fuss">Platzfrei · ${esc(RECHT.email)} ·
    <button data-gehe="rechtliches">Impressum &amp; Datenschutz</button></div>`;
}

function ansichtUeber(){
  const z = kennzahlen();
  seite.innerHTML = `
    <div class="rolle">
      <div class="held">
        <div class="ueber-marke">Über Platzfrei</div>
        <h2>Wo darf ich <em>spielen?</em></h2>
        <p>Platzfrei zeigt Kindern und Jugendlichen, auf welchen Bolz-, Basketball- und
        Sportplätzen sie frei spielen dürfen – und wann. Ohne Ärger mit dem Platzwart,
        ohne Rätselraten am Zaun.</p>
        <div class="reihe">
          <button class="knopf" data-gehe="liste">Plätze in deiner Nähe</button>
          <button class="knopf zweit" data-gehe="vereine">Für Vereine</button>
          <button class="knopf zweit" data-einfuehrung="1">Einführung ansehen</button>
        </div>
      </div>
      <div class="ueber-teil">
        <div class="zahlen">
          <div class="zahl"><b>${zahlText(z.plaetze)}</b><small>Plätze in ganz Deutschland</small></div>
          <div class="zahl gruen"><b>${zahlText(z.frei)}</b><small>davon frei zugänglich</small></div>
          ${kachel(z.verein, "Vereinsanlagen", "lila", ZAHL_AB.verein)}
          ${kachel(z.gemeinden, "Gemeinden mit amtlichen Angaben", "", ZAHL_AB.gemeinden)}
        </div>
      </div>
      <div class="ueber-teil">
        <h3>Warum es Platzfrei gibt</h3>
        <p>Fast jedes Kind kennt das: Man kommt mit dem Ball zum Platz, und keiner weiß,
        ob man drauf darf. Schilder fehlen oder widersprechen sich, der Platzwart schickt
        einen weg, und im Netz steht nirgends, welcher Platz wann offen ist. Dabei gibt es
        in Deutschland zehntausende Plätze, die frei genutzt werden dürfen. Platzfrei macht
        sie sichtbar, damit mehr gespielt und weniger gestritten wird.</p>
      </div>
      <div class="ueber-teil">
        <h3>So funktioniert es</h3>
        <div class="schritte">
          <div class="schritt"><span class="nr">1</span><b>Platz finden</b>
            <p>Karte öffnen, Sportart wählen. Die App zeigt die nächsten Plätze mit Untergrund, Flutlicht und Wetter.</p></div>
          <div class="schritt"><span class="nr">2</span><b>Regeln sehen</b>
            <p>Grün heißt: darfst du. Orange: vorher fragen. Grau: wissen wir noch nicht. Belegt durch Gemeinden, Vereine oder ein Foto vom Schild.</p></div>
          <div class="schritt"><span class="nr">3</span><b>Zusammen spielen</b>
            <p>Einchecken, wenn man da ist, oder ein Spiel ansetzen. Andere sehen, wo gerade etwas los ist.</p></div>
        </div>
      </div>
      <div class="ueber-teil">
        <h3>Woher die Daten kommen</h3>
        <p>Platzfrei fragt Gemeinden direkt an und übernimmt ihre Antworten, nutzt offene
        Daten der Städte und OpenStreetMap. Nutzer bestätigen vor Ort und fotografieren
        die Schilder. Was nicht belegt ist, steht ehrlich als „vermutet“ in der App.</p>
        <div class="zahlen">
          <div class="zahl"><b>${zahlText(z.belegt)}</b><small>Plätze mit belegtem Zugang</small></div>
          <div class="zahl"><b>${zahlText(z.orte)}</b><small>Orte mit Plätzen</small></div>
          <div class="zahl"><b>${zahlText(z.sportarten)}</b><small>Sportarten</small></div>
        </div>
      </div>
      <div class="ueber-teil">
        <h3>Sicher für Kinder</h3>
        <p>Kein Chat, keine Profile, keine Direktnachrichten. Wer gerade spielt, sieht
        man nur als Anzahl, und erst ab zwei Personen. Keine Werbung und keine Werbe-Cookies.</p>
      </div>
      <div class="ueber-teil">
        <h3>Hinter Platzfrei</h3>
        <div class="team">
          <img class="team-foto" src="${FOTO_CORNELIUS}" alt="Cornelius Oellers" width="220" height="220">
          <div class="team-text">
            <b class="team-name">Cornelius Oellers</b>
            <span class="team-rolle">Gründer von Platzfrei</span>
            <p>Als Jugendlicher wurde Cornelius selbst oft von Plätzen geschickt, obwohl
            dort gerade niemand trainierte. Später stand er auf der anderen Seite: als
            Jugendtrainer und als Trainer in Fußballcamps. Platzfrei hat er neben Abitur,
            eigenem Training und Trainerjob gebaut, heute mit über 95.000 Plätzen in ganz
            Deutschland. Inzwischen studiert er Sportökonomie.</p>
            <blockquote>„Kein Kind soll am Zaun stehen und nicht wissen, ob es reindarf.“</blockquote>
            <a class="team-mail" href="mailto:${esc(RECHT.email)}">${esc(RECHT.email)}</a>
          </div>
        </div>
      </div>
      ${ueberFuss()}
    </div>`;
}

function ansichtVereine(){
  const z = kennzahlen();
  seite.innerHTML = `
    <div class="rolle">
      <div class="held">
        <div class="ueber-marke">Für Vereine</div>
        <h2>Euer Platz. <em>Eure Zeiten.</em></h2>
        <p>Kinder wollen kicken – oft genau auf eurem Platz. Mit Platzfrei seht ihr,
        dass klar ist, wann trainiert wird und wann der Platz frei ist. Das spart Ärger
        und bringt euch den Nachwuchs von nebenan.</p>
        <div class="reihe">
          <button class="knopf" data-gehe="liste" data-vereinsuche="1">Euren Platz finden</button>
          <a class="knopf zweit" href="mailto:${esc(RECHT.email)}?subject=Platzfrei%20f%C3%BCr%20Vereine">Kontakt aufnehmen</a>
        </div>
      </div>
      ${z.verein >= ZAHL_AB.verein ? `<div class="ueber-teil">
        <div class="zahlen">
          ${kachel(z.verein, "Vereinsanlagen auf der Karte", "lila")}
          ${kachel(z.vereinZeiten, "Plätze mit Angaben direkt vom Verein", "gruen", ZAHL_AB.vereinZeiten)}
        </div>
      </div>` : ``}
      <div class="ueber-teil">
        <h3>Was ihr davon habt</h3>
        <div class="schritte">
          <div class="schritt"><span class="nr">1</span><b>Klare Zeiten</b>
            <p>Tragt ein, wann Training ist. Die App zeigt dann genau, wann der Platz für alle offen ist und wann nicht.</p></div>
          <div class="schritt"><span class="nr">2</span><b>Weniger Ärger</b>
            <p>Wer nachschaut, weiß Bescheid. Platzwart und Trainer müssen niemanden mehr wegschicken.</p></div>
          <div class="schritt"><span class="nr">3</span><b>Nachwuchs gewinnen</b>
            <p>Die Kinder, die auf eurem Platz bolzen, sind eure Spieler von morgen. Platzfrei zeigt ihnen, wer der Verein ist.</p></div>
        </div>
      </div>
      <div class="ueber-teil">
        <h3>So tragt ihr eure Zeiten ein</h3>
        <div class="abschnitt"><p>1. Euren Platz suchen und öffnen.<br>
          2. „Bist du vom Verein? Platzzeiten eintragen“ antippen.<br>
          3. Trainingszeiten im Wochenraster markieren und absenden.</p>
          <p>Wir prüfen jede Angabe, bevor sie erscheint. Kostenlos, ohne Konto.</p></div>
      </div>
      <div class="ueber-teil">
        <h3>Für Verbände und Gemeinden</h3>
        <p>Wir arbeiten gern mit Verbänden und Gemeinden zusammen, um Plätze und Zeiten

/* --------------------------------------------------------------------------
   Ganz Deutschland aus OpenStreetMap, Kachel für Kachel
   --------------------------------------------------------------------------
   Große Gebiete auf einmal lehnen die Overpass-Server ab. Deshalb wird
   Deutschland in Kacheln von 0,5° × 0,5° (etwa 55 × 35 km) zerlegt und
   nacheinander geladen, die nächsten zuerst. Fertige Kacheln merkt sich
   das Gerät, man kann also jederzeit anhalten und später weitermachen.
   -------------------------------------------------------------------------- */
const KACHEL = 0.5;
const DE_KACHELN = [];
for (let lat = 47.0; lat < 55.0; lat += KACHEL)
  for (let lon = 5.5; lon < 15.0; lon += KACHEL) {
    /* Nur Kacheln, die Deutschland berühren (Raster aus 6×6 Prüfpunkten). */
    let drin = false;
    for (let a = 0; a <= 5 && !drin; a++)
      for (let b = 0; b <= 5 && !drin; b++)
        drin = grobInDeutschland(lat + KACHEL * a / 5, lon + KACHEL * b / 5);
    if (drin) DE_KACHELN.push(lat.toFixed(1) + "," + lon.toFixed(1));
  }
const OSM_KACHEL_SCHLUESSEL = "platzfrei.osmkacheln3";   // 3: mit Lage und OSM-Merkmalen
function osmKachelnFertig(){ return mengeLaden(OSM_KACHEL_SCHLUESSEL); }

function osmKachelAbfrage(kachel){
  const [s, w] = kachel.split(",").map(Number);
  const box = `${s},${w},${(s + KACHEL).toFixed(1)},${(w + KACHEL).toFixed(1)}`;
  return `[out:json][timeout:120][bbox:${box}];
(
  nwr["leisure"="pitch"]["sport"~"soccer|football|basketball|streetball|table_tennis|beachvolleyball|volleyball|multi|skateboard"];
  nwr["leisure"="track"]["sport"~"running|athletics"];
  nwr["leisure"="fitness_station"];
  nwr["leisure"="playground"]["sport"];
  nwr["playground"~"basketball|football|table_tennis|soccer"];
  nwr["leisure"="sports_centre"];
  nwr["club"="sport"];
)->.p;
.p out center tags;
/* Umgebung für die Lage-Auswertung: Parks, Spielplätze, Schulen */
(
  way["leisure"~"^(park|playground|recreation_ground)$"];
  relation["leisure"~"^(park|recreation_ground)$"];
  way["landuse"="recreation_ground"];
  way["amenity"="school"];
  relation["amenity"="school"];
)->.k;
.k out bb tags;`;
}

/* Mehrere öffentliche Overpass-Server: ist einer überlastet, nimmt die App
   den nächsten. Gibt den Antworttext zurück oder null. */
const OSM_SERVER = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];
async function overpassHolen(abfrage){
  for (const url of OSM_SERVER) {
    try {
      const antwort = await fetch(url, {
        method:"POST",
        headers:{ "Content-Type":"application/x-www-form-urlencoded" },
        body:"data=" + encodeURIComponent(abfrage)
      });
      const inhalt = await antwort.text();
      /* Zeitüberschreitung kommt manchmal mit Status 200 und einer "remark". */
      if (antwort.ok && inhalt.trimStart().startsWith("{") && !/"remark":\s*"runtime error/.test(inhalt))
        return inhalt;
      Z.osmFehler = url.split("/")[2] + ": Fehler " + antwort.status;
    } catch (e) {
      console.warn(url, e);
      Z.osmFehler = url.split("/")[2] + ": nicht erreichbar";
    }
  }
  return null;
}

const warte = ms => new Promise(r => setTimeout(r, ms));

async function osmDeutschlandLaden(){
  if (!Z.admin || Z.osmLaeuft) return;
  Z.osmLaeuft = true; Z.osmStop = false; Z.osmFehler = "";
  const fertig = osmKachelnFertig();
  const m = karte.getCenter();
  const offen = DE_KACHELN.filter(k => !fertig.has(k)).sort((a, b) => {
    const d = k => { const [s, w] = k.split(",").map(Number);
      return (s + KACHEL / 2 - m.lat) ** 2 + ((w + KACHEL / 2 - m.lng) * 0.65) ** 2; };
    return d(a) - d(b);
  });
  let neu = 0, fehlversuche = 0;
  zeichne();
  for (let i = 0; i < offen.length && !Z.osmStop; i++) {
    const k = offen[i];
    Z.osmStand = `Kachel ${fertig.size + 1} von ${DE_KACHELN.length} · bisher ${neu} neue Plätze`;
    melde(Z.osmStand);
    const ansichtText = document.getElementById("osm-stand");
    if (ansichtText) ansichtText.textContent = Z.osmStand;

    const text = await overpassHolen(osmKachelAbfrage(k));
    if (!text) {
      /* Alle Server voll: kurz warten und dieselbe Kachel nochmal. */
      if (++fehlversuche > 3) {
        melde("Server bleiben ausgelastet. Später auf „Weiter laden“ drücken.");
        break;
      }
      melde(`Server ausgelastet (${Z.osmFehler}). Neuer Versuch in 30 Sekunden …`);
      await warte(30000); i--; continue;
    }
    fehlversuche = 0;
    let anzahl = 0;
    try { anzahl = (JSON.parse(text).elements || []).length; } catch {}
    if (anzahl) {
      const vorher = DATEN.length;
      await importGeoJson(text);
      neu += DATEN.length - vorher;
    }
    fertig.add(k); mengeSpeichern(OSM_KACHEL_SCHLUESSEL, fertig);
    await warte(1000);   // die Server nicht überrennen
  }
  Z.osmLaeuft = false;
  Z.osmStand = fertig.size >= DE_KACHELN.length
    ? `Fertig: alle ${DE_KACHELN.length} Kacheln geladen, ${neu} neue Plätze in diesem Durchgang.`
    : `${fertig.size} von ${DE_KACHELN.length} Kacheln geladen, ${neu} neue Plätze in diesem Durchgang.`;
  melde(Z.osmStand);
  if (Z.ansicht === "importieren") zeichne();
}

/* Raster für die Umkreissuche beim Import: statt jeden Ort mit jedem zu
   vergleichen, nur die Nachbarzellen ansehen. 0,003° ≈ 200–330 m. */
const RASTER = 0.003;
function rasterSchluessel(lat, lon){ return Math.floor(lat / RASTER) + ":" + Math.floor(lon / RASTER); }
function rasterRein(raster, o){
  const k = rasterSchluessel(o.lat, o.lon);
  (raster.get(k) || raster.set(k, []).get(k)).push(o);
}
function rasterNah(raster, lat, lon){
  const a = Math.floor(lat / RASTER), b = Math.floor(lon / RASTER), aus = [];
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const z = raster.get((a + i) + ":" + (b + j));
    if (z) aus.push(...z);
  }
  return aus;
}

/* ==========================================================================
   9. BOTTOM-SHEET (nur mobil)
   --------------------------------------------------------------------------
   Hier stecken die Prinzipien aus Apples "Designing Fluid Interfaces":
     §2  Der Inhalt klebt 1:1 am Finger, mit Rücksicht auf den Greifpunkt.
     §3  Jede Bewegung ist unterbrechbar – Anfassen stoppt die Feder sofort.
     §5  Beim Loslassen übernimmt die Feder die Geschwindigkeit des Fingers.
     §6  Das Ziel wird aus dem Schwung projiziert, nicht aus der Endposition.
     §9  An den Rändern wird gummiartig gebremst statt hart gestoppt.
   ========================================================================== */

const sheet = (function(){
  const aside  = document.querySelector("aside");
  const griff  = document.getElementById("griff");
  const mobil  = window.matchMedia("(max-width: 880px)");
  const sanft  = window.matchMedia("(prefers-reduced-motion: reduce)");

  /* Rastpunkte als Anteil der Bildschirmhöhe, den das Sheet einnimmt. */
  /* Unterste Stufe: nur Griff und Suchfeld schauen heraus, die Karte hat
     fast den ganzen Bildschirm. Ihr Anteil hängt von der Bildschirmhöhe ab. */
  const RASTEN = [0.14, 0.42, 0.6, 0.94];
  const sicherUnten = (() => {        // Höhe des Home-Balkens beim iPhone
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden";
    document.body.appendChild(d);
    const h = parseFloat(getComputedStyle(d).paddingBottom) || 0;
    d.remove();
    return h;
  })();
  const sicherOben = (() => {         // Notch / Statusleiste in der App
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;top:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden";
    document.body.appendChild(d);
    const h = parseFloat(getComputedStyle(d).paddingTop) || 0;
    d.remove();
    return h;
  })();
  const untersteRaste = () => {
    RASTEN[0] = Math.min(0.2, (92 + sicherUnten) / window.innerHeight);
  };
  untersteRaste();
  const HOEHE  = 0.94;              // muss zur CSS-Höhe passen

  let y = 0;                        // aktuelle Verschiebung in Pixeln
  let ziel = 0;
  let v = 0;                        // Geschwindigkeit in px/s
  let laeuft = false;
  let zieht = false;
  let griffOffset = 0;
  let verlauf = [];                 // die letzten Punkte für die Geschwindigkeit

  const vh = () => window.innerHeight;
  const yFuer = anteil => (HOEHE - anteil) * vh();
  const minY = () => yFuer(RASTEN[RASTEN.length - 1]);   // ganz offen
  const maxY = () => yFuer(RASTEN[0]);                   // ganz zu

  function setzen(neu){
    y = neu;
    aside.style.transform = `translateY(${y}px)`;
    /* Die Innenhöhe folgt dem sichtbaren Teil – sonst rutscht die
       Fußleiste unter den Bildschirmrand, sobald das Sheet halb zu ist. */
    /* Das Sheet ist HOEHE hoch und um y nach unten geschoben –
       sichtbar bleibt also HOEHE minus y, nicht Fensterhöhe minus y. */
    aside.style.setProperty("--sichtbar", Math.max(0, HOEHE * vh() - y) + "px");
    /* Für den Standort-Knopf, der auf dem Handy über dem Blatt schwebt. */
    document.documentElement.style.setProperty("--blatt-sichtbar", Math.max(0, HOEHE * vh() - y) + "px");
    /* Blatt fast ganz offen: Umschalter Karte/Liste wäre verdeckt. */
    /* Reicht das Blatt an die Knöpfe oben auf der Karte heran, werden sie
       ausgeblendet und "Karte" sitzt in der Kopfzeile des Blatts. Schon
       etwas früher fallen Standort/Plus weg, weil sie über dem Blatt
       schweben und sonst nach oben über die anderen Knöpfe rutschen. */
    const blattOben = vh() - (HOEHE * vh() - y);
    document.documentElement.classList.toggle("blatt-hoch", blattOben < 165 + sicherOben);
    document.documentElement.classList.toggle("blatt-mittel", blattOben < 225 + sicherOben);
  }

  /* §9 Je weiter über den Rand, desto weniger folgt das Sheet. */
  function gummi(ueber, groesse, k = 0.55){
    return (ueber * groesse * k) / (groesse + k * Math.abs(ueber));
  }

  function begrenzen(roh){
    if (roh < minY()) return minY() - gummi(minY() - roh, vh());
    if (roh > maxY()) return maxY() + gummi(roh - maxY(), vh());
    return roh;
  }

  /* §6 Wohin würde der Schwung das Sheet tragen? Exponentieller Auslauf,
     dieselbe Formel wie beim Scrollen. */
  function projektion(geschwindigkeit, bremse = 0.998){
    return (geschwindigkeit / 1000) * bremse / (1 - bremse);
  }

  function naechsteRaste(punkt){
    let beste = yFuer(RASTEN[0]), abstand = Infinity;
    for (const r of RASTEN) {
      const py = yFuer(r);
      if (Math.abs(py - punkt) < abstand) { abstand = Math.abs(py - punkt); beste = py; }
    }
    return beste;
  }

  /* §4 Kritisch gedämpfte Feder – kein Überschwingen. Sie startet immer
     beim aktuellen Bildschirmwert und mit der übergebenen Geschwindigkeit,
     damit zwischen Ziehen und Animieren keine Naht entsteht (§5). */
  function federZu(neuesZiel, startGeschwindigkeit = 0){
    ziel = neuesZiel;
    v = startGeschwindigkeit;

    if (sanft.matches) { setzen(ziel); laeuft = false; return; }
    if (laeuft) return;                 // läuft schon, neues Ziel reicht
    laeuft = true;

    const steifheit = 170, daempfung = 26;   // daempfung ≈ 2·√steifheit
    let zuletzt = performance.now();

    (function schritt(jetzt){
      if (!laeuft) return;
      const dt = Math.min((jetzt - zuletzt) / 1000, 1 / 30);
      zuletzt = jetzt;

      const kraft = -steifheit * (y - ziel) - daempfung * v;
      v += kraft * dt;
      setzen(y + v * dt);

      if (Math.abs(y - ziel) < 0.4 && Math.abs(v) < 12) {
        setzen(ziel); v = 0; laeuft = false; return;
      }
      requestAnimationFrame(schritt);
    })(zuletzt);
  }

  // ----- Gesten -----

  griff.addEventListener("pointerdown", e => {
    if (!mobil.matches) return;
    griff.setPointerCapture(e.pointerId);
    laeuft = false;                    // §3 Anfassen unterbricht sofort
    zieht = true;
    griffOffset = e.clientY - y;       // §2 Greifpunkt respektieren
    verlauf = [{ y: e.clientY, t: performance.now() }];
    e.preventDefault();
  });

  griff.addEventListener("pointermove", e => {
    if (!zieht) return;
    setzen(begrenzen(e.clientY - griffOffset));
    verlauf.push({ y: e.clientY, t: performance.now() });
    if (verlauf.length > 6) verlauf.shift();
  });

  function loslassen(e){
    if (!zieht) return;
    try { griff.releasePointerCapture(e.pointerId); } catch {}
    abschliessen();
  }

  let letzteRaste = null;
  function abschliessen(){
    zieht = false;
    /* Geschwindigkeit aus den letzten Punkten, nicht nur dem letzten. */
    const a = verlauf[0], b = verlauf[verlauf.length - 1];
    const dt = b && a ? (b.t - a.t) / 1000 : 0;
    const geschwindigkeit = dt > 0.008 ? (b.y - a.y) / dt : 0;

    const projiziert = y + projektion(geschwindigkeit);
    const raste = naechsteRaste(projiziert);
    /* Kurzes Ticken beim Einrasten auf einer neuen Stufe (nur Android). */
    if (letzteRaste !== null && Math.abs(raste - letzteRaste) > 1) {
      try { navigator.vibrate?.(8); } catch {}
    }
    letzteRaste = raste;
    federZu(raste, geschwindigkeit);
  }

  /* Größere Anfassfläche: Nicht nur der Griff, auch Kopfbereich,
     Filterleiste und Fußleiste ziehen das Blatt. In der Liste gilt wie in
     Apple Karten: Ist das Blatt noch nicht ganz offen, zieht ein Wisch nach
     oben zuerst das Blatt auf; steht die Liste ganz oben, zieht ein Wisch
     nach unten das Blatt wieder zu. */
  let beruehrung = null;
  let gezogenBis = 0;

  aside.addEventListener("touchstart", e => {
    beruehrung = null;
    if (!mobil.matches || e.touches.length !== 1) return;
    if (e.target.closest("#griff, input, textarea, select")) return;
    const t = e.touches[0];
    beruehrung = { x:t.clientX, y:t.clientY, modus:"?",
                   liste:e.target.closest(".rolle") };
  }, { passive:true });

  aside.addEventListener("touchmove", e => {
    const b = beruehrung;
    if (!b || e.touches.length !== 1) return;
    const t = e.touches[0];
    if (b.modus === "?") {
      const dx = t.clientX - b.x, dy = t.clientY - b.y;
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      if (Math.abs(dx) > Math.abs(dy)) { b.modus = "lassen"; return; }
      let ziehen = true;
      if (b.liste) {
        const ganzOffen = y <= minY() + 2;
        ziehen = (dy < 0 && !ganzOffen) || (dy > 0 && b.liste.scrollTop <= 0);
      }
      if (!ziehen) { b.modus = "lassen"; return; }
      b.modus = "ziehen";
      laeuft = false;                  // §3 Anfassen unterbricht sofort
      zieht = true;
      griffOffset = t.clientY - y;
      verlauf = [{ y:t.clientY, t:performance.now() }];
    }
    if (b.modus !== "ziehen") return;
    if (e.cancelable) e.preventDefault();
    setzen(begrenzen(t.clientY - griffOffset));
    verlauf.push({ y:t.clientY, t:performance.now() });
    if (verlauf.length > 6) verlauf.shift();
  }, { passive:false });

  function beruehrungEnde(){
    if (beruehrung?.modus === "ziehen") { gezogenBis = Date.now() + 350; abschliessen(); }
    beruehrung = null;
  }
  aside.addEventListener("touchend", beruehrungEnde);
  aside.addEventListener("touchcancel", beruehrungEnde);

  /* Nach dem Ziehen soll kein Platz aus Versehen aufgehen. */
  aside.addEventListener("click", e => {
    if (Date.now() < gezogenBis) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  griff.addEventListener("pointerup", loslassen);
  griff.addEventListener("pointercancel", loslassen);

  /* Tippen auf den Griff schaltet zwischen klein und groß um –
     §2 Agency: es gibt immer auch einen Weg ohne Geste. */
  griff.addEventListener("click", () => {
    if (!mobil.matches || verlauf.length > 3) return;
    const offen = y < (yFuer(RASTEN[1]) + yFuer(RASTEN[3])) / 2;
    federZu(yFuer(offen ? RASTEN[1] : RASTEN[3]));
  });
  griff.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    griff.click();
  });

  function ausrichten(){
    if (!mobil.matches) { aside.style.transform = ""; return; }
    untersteRaste();
    setzen(naechsteRaste(y || yFuer(RASTEN[2])));
  }

  window.addEventListener("resize", ausrichten);
  mobil.addEventListener("change", ausrichten);

  return {
    start(){ if (mobil.matches) setzen(yFuer(RASTEN[2])); },
    /* Beim Öffnen eines Platzes soll die Liste Platz machen. */
    aufmachen(){ if (mobil.matches) federZu(yFuer(RASTEN[3])); },
    /* Mindestens halb offen, damit man die Angaben eines Platzes sieht. */
    mitte(){ if (mobil.matches && y > yFuer(RASTEN[2]) + 1) federZu(yFuer(RASTEN[2])); },
    /* Wer die Karte verschiebt, will die Karte sehen. */
    klein(){ if (mobil.matches && !zieht && y < yFuer(RASTEN[1]) - 1) federZu(yFuer(RASTEN[1])); },
    /* Knopf "Karte": Karte fast bildschirmfüllend, Liste nur als Griff. */
    karteGross(){ if (mobil.matches) federZu(yFuer(RASTEN[0])); }
  };
})();

/* Mausrad über der Filterzeile schiebt sie seitlich (Laptop ohne Trackpad). */

  if (t.dataset.filterweg)  {
    Object.assign(Z, { sportart:"alle", nurFrei:false, nurBelegt:false, maxKm:null, nurGemerkt:false,
                       nurLos:false, nurLicht:false, bereich:null, suche:"" });
    return zeichne();
  }
  if (t.dataset.korrektur)  { return korrekturSenden(t.dataset.korrektur); }
  if (t.dataset.waechstweg) {
    try { localStorage.setItem("platzfrei.waechst.weg", "1"); } catch {}
    t.closest(".waechst")?.remove(); return;
  }

  if (t.dataset.thema)      { return themaUmschalten(); }
  if (t.dataset.jetzt)      { return jetztSpielen(); }
  if (t.dataset.einfuehrung){ return einfuehrungZeigen(true); }
  if (t.dataset.ausltag)    { Z.auslastungTag = +t.dataset.ausltag;
    const k = document.getElementById("auslastung"); if (k) k.outerHTML = auslastungBlock(ort(Z.auswahlId));
    return; }
  if (t.dataset.hierpunkt)  { return hierPunktSetzen(); }
  if (t.dataset.hier)       { return hierEinchecken(t.dataset.hier); }
  if (t.dataset.frage)      { return zugangFragen(t.dataset.frage, true); }
  if (t.dataset.hierweg)    { return hierAuschecken(); }
  if (t.dataset.zusage)     { return spielZusagen(t.dataset.zusage); }
  if (t.dataset.spielweg)   { return spielLoeschen(t.dataset.spielweg); }
  if (t.dataset.spielform)  { Z.spielFormOffen = t.dataset.spielform === "1"; return zeichne(); }
  if (t.dataset.spielansetzen) { return spielAnsetzen(); }
  if (t.dataset.tipp)       { return tippUmschalten(t.dataset.tipp); }
  if (t.dataset.osmladen)   { return osmDeutschlandLaden(); }
  if (t.dataset.osmstop)    { Z.osmStop = true; return melde("Wird nach dieser Kachel angehalten …"); }
  if (t.dataset.tippsoffen) { Z.tippsOffen = t.dataset.tippsoffen === "1"; return zeichne(); }
  if (t.dataset.vereinszeitensenden) { return vereinszeitenSenden(); }
  if (t.dataset.neuok)      { return neuenOrtPruefen(t.dataset.neuok, true); }
  if (t.dataset.neuweg)     { return neuenOrtPruefen(t.dataset.neuweg, false); }
  if (t.dataset.vzok)       { return vereinszeitenPruefen(t.dataset.vzok, true); }
  if (t.dataset.vzweg)      { return vereinszeitenPruefen(t.dataset.vzweg, false); }
  if (t.dataset.belegt)     { Z.nurBelegt = !Z.nurBelegt; return zeichne(); }
  if (t.dataset.suchweg)    { Z.suche = ""; zeichne(); return; }
  if (t.dataset.teilen)     { return teilen(t.dataset.teilen); }
  if (t.dataset.abmelden)   { return abmelden(); }
  if (t.dataset.schildok)   { return schildPruefen(t.dataset.schildok, true); }
  if (t.dataset.schildweg)  { return schildPruefen(t.dataset.schildweg, false); }
  if (t.dataset.loeschen)   { return ortLoeschen(t.dataset.loeschen); }
  if (t.dataset.fehlersenden) { return fehlerSenden(); }
  if (t.dataset.fehlererledigt) { return fehlerErledigt(t.dataset.fehlererledigt); }
  if (t.dataset.vorschlag)  { return vorschlagEntscheiden(t.dataset.vorschlag, t.dataset.annehmen === "1"); }
  if (t.dataset.zurueckdrehen) { return aenderungZurueckdrehen(t.dataset.zurueckdrehen); }
  if (t.dataset.mehr)       { Z.filterOffen = t.dataset.mehr === "1"; return zeichne(); }
  if (t.dataset.sortierung) { Z.sortierung = t.dataset.sortierung; return zeichne(); }
  if (t.dataset.bereich)    { Z.bereich = null; mitteBeimZeichnen = karte.getCenter();
                              return zeichne(); }

  /* Stern zuerst prüfen: er sitzt innerhalb der Zeile und darf nicht
     gleichzeitig den Platz öffnen. */
  if (t.dataset.merken)     { e.stopPropagation(); return merkenUmschalten(t.dataset.merken); }
  if (t.dataset.gemerkt)    { Z.nurGemerkt = t.dataset.gemerkt === "1"; return zeichne(); }
  if (t.dataset.melden)     { return meldungAbgeben(t.dataset.melden); }
  if (t.dataset.route)      { return routeOeffnen(t.dataset.route); }
  if (t.dataset.nurlicht)   { Z.nurLicht = t.dataset.nurlicht === "1"; return zeichne(); }
  if (t.dataset.km !== undefined) { Z.maxKm = +t.dataset.km || null; return zeichne(); }
  if (t.dataset.anmelden)   { return anmelden(); }

  if (t.dataset.sport)      { Z.sportart = t.dataset.sport; return zeichne(); }
  if (t.dataset.hauptsport !== undefined) {
    HAUPTSPORT = t.dataset.hauptsport;
    try { localStorage.setItem(HAUPTSPORT_SCHLUESSEL, HAUPTSPORT); } catch {}
    Z.sportart = HAUPTSPORT || "alle";
    melde(HAUPTSPORT ? `Hauptsportart: ${HAUPTSPORT}` : "Alle Sportarten");
    return zeichne();
  }
  if (t.dataset.themawahl)  {
    THEMA = t.dataset.themawahl;
    try { localStorage.setItem(THEMA_SCHLUESSEL, THEMA); } catch {}
    themaAnwenden(); karteThemaNeu();
    return zeichne();
  }
  if (t.dataset.nurfrei)    { Z.nurFrei = t.dataset.nurfrei==="1"; return zeichne(); }
  if (t.dataset.nurlos)     { Z.nurLos = t.dataset.nurlos==="1"; return zeichne(); }
  if (t.dataset.ort) {
    Z.auswahlId = t.dataset.ort; Z.ansicht = "detail"; zeichne();
    if (t.dataset.spielauf) { Z.spielFormOffen = true; zeichne(); }
    const o = ort(t.dataset.ort);
    if (o) karte.flyTo([o.lat, o.lon], Math.max(karte.getZoom(), 16), { duration:.6 });
    sheet.aufmachen();
    return;
  }
  if (t.dataset.gehe)       {
    Z.ansicht=t.dataset.gehe; zeichne();
    if (t.dataset.vereinsuche) document.getElementById("suchfeld")?.focus();
    if (t.dataset.fokus) {
      const feld = seite.querySelector(`[name="${t.dataset.fokus}"]`);
      if (feld) { feld.scrollIntoView({ block:"center" }); feld.focus(); }
      sheet.aufmachen();
    }
    if (VOLLSEITEN.includes(Z.ansicht)) {
      seite.querySelector(".rolle")?.scrollTo(0, 0);
      sheet.aufmachen();
    }
    return;
  }
  if (t.dataset.speichern)  { return speichern(); }
  if (t.dataset.neuspeichern){ return neuSpeichern(); }
  if (t.dataset.export)     { return exportieren(); }
  if (t.dataset.doppelte)   { return doppelteZusammenfuehren(t); }
  if (t.dataset.geprueft)   { return alsGepruefT(t.dataset.geprueft); }
});

/* "Ich stehe gerade dort": Standort holen und als Position des neuen
   Ortes nehmen. */
function hierPunktSetzen(){
  if (!navigator.geolocation) return melde("Dein Gerät gibt keinen Standort heraus.");
  Z.neuEntwurf = neuFormularWerte();
  melde("Standort wird gesucht …");
  navigator.geolocation.getCurrentPosition(
    p => {
      Z.position = { lat:p.coords.latitude, lon:p.coords.longitude };
      Z.positionEcht = true;
      Z.neuerPunkt = { lat:+p.coords.latitude.toFixed(6), lon:+p.coords.longitude.toFixed(6) };
      karte.setView([Z.neuerPunkt.lat, Z.neuerPunkt.lon], Math.max(karte.getZoom(), 17));
      zeichne();
      melde("Position gesetzt.");
    },
    () => melde("Standort nicht freigegeben. Tippe stattdessen auf die Karte."),
    { enableHighAccuracy:true, timeout:45000 });
}

/* Standort einmal holen – robust. getCurrentPosition gibt nach seiner
   Frist auf, und in der iPhone-App läuft diese Frist schon, während der
   iOS-Dialog "Standort erlauben" noch offen ist. Wer dann erlaubt, bekam
   nie einen Standort, und die App rechnete weiter ab München-Mitte.
   watchPosition wartet dagegen, bis der Standort wirklich da ist. */
function standortEinmal(ok, fehler, frist = 60000){
  if (!navigator.geolocation) return fehler && fehler({ code:2 });
  let fertig = false, id = null;
  const ende = () => { fertig = true; clearTimeout(uhr);
    if (id !== null) try { navigator.geolocation.clearWatch(id); } catch {} };
  const uhr = setTimeout(() => { if (!fertig) { ende(); fehler && fehler({ code:3 }); } }, frist);
  id = navigator.geolocation.watchPosition(
    p => { if (fertig) return; ende(); ok(p); },
    e => { if (fertig || e.code !== 1) return; ende(); fehler && fehler(e); },   // nur "verweigert" ist endgültig
    { enableHighAccuracy:false, maximumAge:300000 });
}

/* Echter Standort ist da: Bezugspunkt, Punkt auf der Karte, Liste. */
function standortUebernehmen(p){
  try { localStorage.removeItem("platzfrei.ohnestandort"); } catch {}
  Z.position = { lat:p.coords.latitude, lon:p.coords.longitude };
  Z.positionEcht = true;
  if (Z.startpunkt) {
    Z.startpunkt = null;
    try { localStorage.removeItem(STARTPUNKT_SCHLUESSEL); } catch {}
  }
  Z.startpunktOffen = false;
  Z.bereich = null;
  if (ichMarker) karte.removeLayer(ichMarker);
  ichMarker = L.circleMarker([Z.position.lat, Z.position.lon], {
    radius:7, color:"#fff", weight:2.5, fillColor:"#2E6BE0", fillOpacity:1
  }).addTo(karte);
  if (AUSSCHNITT) umgebungKacheln(Z.position);
  else if (Z.laedtNoch) umgebungLaden(Z.position);
  zeichne();
  wetterLaden();
}

/* Gibt jemand den Standort frei – egal über welchen Dialog –, übernehmen
   wir ihn sofort. */
navigator.permissions?.query({ name:"geolocation" }).then(r => {
  r.onchange = () => { if (r.state === "granted" && !Z.positionEcht) standortHolen(true); };
}).catch(() => {});

function standortHolen(erzwingen){
  if (!navigator.geolocation) return;
  standortEinmal(
    p => {
      if (Z.startpunkt && !erzwingen) return;   // selbst gewählter Startpunkt hat Vorrang
      standortUebernehmen(p);
      /* Karte beim Start direkt am eigenen Standort öffnen – außer man hat
         sie inzwischen selbst bewegt oder ein geteilter Platz ist offen. */
      if (karteUnberuehrt && !Z.auswahlId) {
        mitteBeimZeichnen = L.latLng(Z.position.lat, Z.position.lon);   // kein "In diesem Bereich suchen"
        karte.setView(mitteBeimZeichnen, 15);
      }
    },
    () => {}    // kein Standort: München-Mitte bleibt der Bezugspunkt
  );
}

/* Knopf unten links: springt zum eigenen Standort. Fragt beim ersten Mal
   nach der Freigabe, falls das beim Start noch nicht passiert ist. */
function zuMeinemStandort(){
  if (!navigator.geolocation) return melde("Dein Browser kann keinen Standort bestimmen.");
  if (!Z.positionEcht) melde("Standort wird gesucht …");
  standortEinmal(
    p => {
      const neu = !Z.positionEcht;
      standortUebernehmen(p);
      karte.flyTo([Z.position.lat, Z.position.lon], Math.max(karte.getZoom(), 15), { duration:.6 });
      if (neu) melde("Entfernungen jetzt ab deinem Standort.");
    },
    e => melde(e.code === 1
      ? "Standort nicht freigegeben. Erlaube ihn in den Einstellungen deines Browsers oder Handys."
      : "Standort gerade nicht gefunden. Versuch es gleich noch einmal.")
  );
}

if (window.matchMedia("(hover:hover)").matches) {
  let geplant = false, maus = null;
  document.addEventListener("mousemove", e => {
    maus = e;
    if (geplant) return;
    geplant = true;
    requestAnimationFrame(() => {
      geplant = false;
      const k = document.querySelector(".standort-knopf .neu-knopf");
      if (!k) return;
      const r = k.getBoundingClientRect();
      const abstand = Math.hypot(maus.clientX - (r.left + r.width / 2), maus.clientY - (r.top + r.height / 2));
      k.classList.toggle("nah", abstand < 110);
    });
  }, { passive:true });
}

/* Beim Start nur dann gleich den Standort holen, wenn er schon freigegeben
   ist (Browser) oder die Einführung erklärt hat, wofür (App). Sonst fragt
   erst die Einführung oder der Knopf "Meinen Standort nutzen". */
function standortStart(){
  if (Z.startpunkt) return;
  let einfGesehen = false;
  try { einfGesehen = !!localStorage.getItem(EINF_SCHLUESSEL); } catch {}
  let nein = false;
  try { nein = !!localStorage.getItem("platzfrei.ohnestandort"); } catch {}
  /* Wer die Einführung kennt und nicht "Ohne Standort" gewählt hat, bekommt
     beim Start sofort seinen Standort (Safari fragt dabei je nach
     Einstellung noch einmal nach). */
  if (einfGesehen && !nein) return standortHolen();
  navigator.permissions?.query({ name:"geolocation" })
    .then(r => { if (r.state === "granted") standortHolen(); }).catch(() => {});
}

/* Reihenfolge beim Start: erst schauen, ob eine Sitzung aus einem früheren
   Besuch noch gilt, dann die Orte laden. Supabase merkt sich die Anmeldung
   selbst, deshalb muss man sich nicht bei jedem Neuladen neu anmelden. */
sheet.start();
karte.on("dragstart", () => sheet.klein());
adminAdresseOeffnen();

(async function start(){
  /* Wer über einen Link direkt auf eine Unterseite kommt, bekommt die
     Einführung nicht darübergelegt. */
  if (!/^#(partner|platz=|impressum|datenschutz|admin)/.test(location.hash)) einfuehrungZeigen();
  await adminPruefen();
  await datenLaden();
  await platzAusAdresse();
  await Promise.all([meldungenLaden(), bestaetigungenLaden(), aktivLaden(), spieleLaden()]);
  zeichne();
  wetterLaden();          // läuft nebenher, blockiert den Start nicht
})();

/* Service Worker: sorgt dafür, dass die App nach dem ersten Besuch auch mit
   schlechtem oder ohne Netz aufgeht. Funktioniert nur unter https – lokal
   aus der Datei geöffnet passiert hier einfach nichts. */
if ("serviceWorker" in navigator && location.protocol === "https:")
  navigator.serviceWorker.register("sw.js").catch(()=>{});
