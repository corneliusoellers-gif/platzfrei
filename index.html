/* Reihenfolge der Ansichten – daraus leitet sich ab, ob ein Wechsel
   "vorwärts" (von rechts herein) oder "zurück" (von links herein) ist.
   §7 Räumliche Konsistenz: Was nach rechts hinausging, kommt von rechts zurück. */
const ANSICHTS_TIEFE = {
  liste:0, importieren:1, anmelden:1, neu:1,
  detail:1, bearbeiten:2, melden:2, rechtliches:1, fehler:1, fehlerliste:1, verlauf:1,
  vereinszeiten:2, pruefen:1, abzeichen:1, einstellungen:1, ueber:1, vereine:1, partner:1
};
let letzteTiefe = 0;
let letzterSchluessel = "liste";
const SCROLL = {};                 // Scrollposition je Ansicht

function zeichne(){
  if (Z.ansicht !== "bearbeiten") Z.vorgabeBeleg = null;
  // Neu zeichnen (z. B. wenn im Hintergrund Plätze nachladen) darf das halb
  // ausgefüllte Formular "Ort hinzufügen" nicht leeren.
  if (Z.ansicht === "neu" && String(letzterSchluessel).startsWith("neu:")) Z.neuEntwurf = neuFormularWerte();
  if (Z.ansicht !== "detail" || String(Z.auswahlId) !== String(zeichne.letzterOrt)) {
    Z.spielFormOffen = false; Z.tippsOffen = false;
  }
  zeichne.letzterOrt = Z.ansicht === "detail" ? Z.auswahlId : null;
  const tiefe = ANSICHTS_TIEFE[Z.ansicht] ?? 0;
  const richtung = tiefe >= letzteTiefe ? "wechsel-vor" : "wechsel-zurueck";
  letzteTiefe = tiefe;

  /* Beim Antippen eines Filters wird die Liste neu gebaut. Damit die
     Filterleiste nicht jedes Mal an den Anfang springt, merken wir uns
     vorher, wie weit sie und die Liste gescrollt waren. */
  const schluessel = Z.ansicht === "liste" ? "liste" : Z.ansicht + ":" + (Z.auswahlId || "");
  const gleich = schluessel === letzterSchluessel;
  const vorher = { filter: document.querySelector(".filter")?.scrollLeft || 0,
                   rolle:  seite.querySelector(".rolle")?.scrollTop || 0 };
  SCROLL[letzterSchluessel] = vorher;
  letzterSchluessel = schluessel;

  /* Laptop: Suche und Filter wandern in die Leiste oben (siehe ansichtListe). */
  leiste.replaceChildren();
  const klasseVorher = document.body.className;
  document.body.classList.toggle("mit-leiste", Z.ansicht === "liste");
  document.body.classList.toggle("vollseite", VOLLSEITEN.includes(Z.ansicht)
    || (Z.nurListe && breit.matches));
  document.body.classList.toggle("nurliste", !!Z.nurListe && breit.matches);
  document.querySelectorAll("[data-modus]").forEach(b =>
    b.setAttribute("aria-pressed", String((b.dataset.modus === "liste") === !!Z.nurListe)));
  document.querySelectorAll("[data-nav]").forEach(b =>
    b.toggleAttribute("aria-current", b.dataset.nav === (VOLLSEITEN.includes(Z.ansicht) ? Z.ansicht : "liste")));
  if (document.body.className !== klasseVorher) setTimeout(() => karte.invalidateSize(), 0);
  abzeichenNav();

  ({ liste:ansichtListe, detail:ansichtDetail, bearbeiten:ansichtBearbeiten,
     neu:ansichtNeu, anmelden:ansichtAnmelden, importieren:ansichtImportieren,
     melden:ansichtMelden, rechtliches:ansichtRechtliches, vereinszeiten:ansichtVereinszeiten, pruefen:ansichtPruefen, fehler:ansichtFehler, fehlerliste:ansichtFehlerliste, verlauf:ansichtVerlauf, abzeichen:ansichtAbzeichen, einstellungen:ansichtEinstellungen,
     ueber:ansichtUeber, vereine:ansichtVereine, partner:ansichtPartner })[Z.ansicht]();

  /* §11 Nur transform und opacity bewegen – beides läuft im Compositor,
     ohne dass der Browser das Layout neu rechnen muss. */
  const merk = gleich ? vorher : (schluessel === "liste" ? SCROLL.liste : null);
  if (merk) {
    const f = document.querySelector(".filter"), r = seite.querySelector(".rolle");
    if (f) f.scrollLeft = merk.filter;
    if (r) r.scrollTop = merk.rolle;
  }

  /* Nur beim Wechsel der Ansicht animieren, nicht bei jedem Filter. */
  if (!gleich) {
    seite.classList.remove("wechsel-vor", "wechsel-zurueck");
    void seite.offsetWidth;                // Animation neu starten erzwingen
    seite.classList.add(richtung);
  }
  markerZeichnen();

  /* Zurück-Taste am Handy: Solange ein Platz oder ein Formular offen ist,
     liegt ein Eintrag im Verlauf. "Zurück" führt dann zur Liste, statt
     die App zu verlassen. */
  if (tiefe > 0 && !history.state?.platzfrei) history.pushState({ platzfrei:1 }, "");
  if (tiefe === 0 && history.state?.platzfrei) history.back();

  const k = document.getElementById("adminknopf");
  /* Der Knopf erscheint nur, wenn man als Admin angemeldet ist.
     Zur Anmeldung führt platzfrei.app/#admin oder fünfmal aufs Logo tippen. */
  k.hidden = !Z.admin;
  k.textContent = Z.admin ? "Abmelden" : "";
  k.title = Z.admin ? "Angemeldet als " + (Z.email || "Test") : "";
  k.classList.toggle("an", Z.admin);

  const w = VORSCHLAEGE.length;
  document.getElementById("kopfnotiz").textContent =
    (Z.laedtNoch ? "lädt Plätze …" : (KENNZAHLEN && AUSSCHNITT ? KENNZAHLEN.plaetze : DATEN.length - DOPPELT).toLocaleString("de-DE") + " Plätze")
    + (Z.admin && w ? ` · ${w} ${w === 1 ? "Änderungsvorschlag" : "Änderungsvorschläge"} offen` : "")
    + (ECHT ? "" : " · keine Verbindung");
}

/* ==========================================================================
   6. AKTIONEN
   --------------------------------------------------------------------------
   Alles hier schreibt in die Datenbank, wenn eine eingerichtet ist, und
   sonst nur in den Arbeitsspeicher. Deshalb steht überall dasselbe Muster:
   erst prüfen, ob ECHT gilt, dann schreiben.
   ========================================================================== */

/* Namen der Spalten in der Datenbank weichen an drei Stellen von den
   Namen in der App ab (Postgres mag keine Großbuchstaben). */
const DB_SPALTE = { bestaetigtDurch:"bestaetigt_durch", geprueft:"geprueft_am" };
const OFFENE_FELDER = ["untergrund","groesse","ausstattung","umzaeunt",
                       "beleuchtung","zustand","drumherum"];

/* Plätze ohne Namen heißen in der Datenbank "Tischtennis-Fläche" o. ä.
   Angezeigt wird ein lesbarer Name, mit Ort, wenn wir ihn kennen
   (gleiche Wörter wie orte-namen-mit-ort.sql). */
const PLATZHALTER_NAME = { "Fußball":"Fußballplatz", "Basketball":"Basketballplatz",
  "Calisthenics":"Calisthenics-Park", "Beachvolleyball":"Beachvolleyballfeld",
  "Laufen":"Laufbahn", "Tischtennis":"Tischtennisplatte", "Skaten":"Skatepark" };
function lesbarerName(name, ort){
  const m = /^(.+)-Fläche$/.exec(name || "");
  if (!m) return name;
  const basis = PLATZHALTER_NAME[m[1]] || m[1] + "-Platz";
  return ort && ort !== "—" ? basis + " " + ort : basis;
}

/* --------------------------------------------------------------------------
   Doppelte ausblenden
   --------------------------------------------------------------------------
   Viele Plätze stehen aus mehreren Quellen doppelt da (OSM, Gemeinde,
   rojball), oft einmal mit echtem Namen und einmal als „Fußballplatz
   München“. Liegen zwei höchstens 40 m auseinander, teilen eine Sportart und
   heißen gleich – oder einer hat nur einen Platzhalter-Namen –, zeigen wir
   nur den besseren (mit Beleg, mit echtem Namen). Die Daten bleiben
   unverändert; endgültig zusammenführen: supabase-duplikate-finden.sql.
   -------------------------------------------------------------------------- */
const GENERISCH = /^(fußballplatz|bolzplatz|basketballplatz|tischtennisplatte|beachvolleyballfeld|skatepark|calisthenics-park|laufbahn|sportplatz)( [^,]*)?(,.*)?$/i;
let DOPPELT = 0;
function doppelteMarkieren(){
  for (const o of DATEN) {
    o._gen = o.platzhalter || GENERISCH.test(o.name);
    o._rang = (belegt(o) ? 1000 : 0) + (o._gen ? 0 : 100);
    o._klein = o.name.toLowerCase();
  }
  const generisch = o => o._gen, rang = o => o._rang;
  const Z_LAT = 0.0004, Z_LON = 0.0006;      // Rasterzelle ≈ 45 m
  const zellen = new Map();
  for (const o of DATEN) {
    o._doppelt = false;
    const k = Math.floor(o.lat / Z_LAT) * 1e6 + Math.floor(o.lon / Z_LON);
    (zellen.get(k) || zellen.set(k, []).get(k)).push(o);
  }
  DOPPELT = 0;
  for (const a of DATEN) {
    const ka = Math.floor(a.lat / Z_LAT), kb = Math.floor(a.lon / Z_LON);
    const ra = rang(a);
    let bester = null;
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
      const zelle = zellen.get((ka + i) * 1e6 + kb + j);
      if (zelle) for (const b of zelle) {
        if (b === a) continue;
        const rb = rang(b);
        if (!(rb > ra || (rb === ra && String(b.id) < String(a.id)))) continue;
        if (!a.sportarten.some(sp => b.sportarten.includes(sp))) continue;
        if (a._klein !== b._klein && !generisch(a) && !generisch(b)) continue;
        if (entfernungKm(a, b) > 0.04) continue;
        if (!bester || rb > rang(bester)) bester = b;
      }
    }
    if (bester) {
      a._doppelt = true; DOPPELT++;
      for (const sp of a.sportarten) if (!bester.sportarten.includes(sp)) bester.sportarten = [...bester.sportarten, sp];
    }
  }
}

/* Eine Zeile aus der Datenbank in die Form bringen, die die App benutzt. */
function ausDb(r){
  return {
    id:r.id, name:lesbarerName(r.name, r.ort), ort:r.ort || "—",
    platzhalter:/-Fläche$/.test(r.name || ""),
    lat:r.lat, lon:r.lon,
    sportarten:r.sportarten || [],
    zugang:r.zugang, zeiten:r.zeiten, bestaetigtDurch:r.bestaetigt_durch,
    untergrund:r.untergrund || "—", groesse:r.groesse || "—",
    ausstattung:r.ausstattung || "—", umzaeunt:r.umzaeunt || "nein",
    beleuchtung:r.beleuchtung || "nein", zustand:r.zustand || 3,
    drumherum:r.drumherum || "—", notizen:r.notizen || "",
    verein:r.verein || null,
    geprueft:r.geprueft_am, freigegeben:r.freigegeben,
    _voll: r.notizen !== undefined     // false = nur Listenfelder geladen
  };
}

/* --------------------------------------------------------------------------
   Schnell laden
   --------------------------------------------------------------------------
   1. Für Karte und Liste holen wir nur die Felder, die dort gebraucht
      werden. Notizen, Größe, Ausstattung usw. kommen erst, wenn man einen
      Platz öffnet (ortVollLaden).
   2. Die Plätze werden auf dem Gerät gespeichert (IndexedDB). Beim nächsten
      Start ist die Karte sofort da; frisch geladen wird im Hintergrund, wenn
      der Speicher älter als 15 Minuten ist (für den Admin immer).
   3. Beim ersten Laden zeigen wir die Plätze schon, sobald die ersten
      Seiten da sind, statt auf alle zu warten.
   -------------------------------------------------------------------------- */
const LISTE_SPALTEN = "id,name,ort,lat,lon,sportarten,zugang,zeiten,bestaetigt_durch,"
                    + "untergrund,beleuchtung,zustand,verein,geprueft_am,freigegeben";
const SPEICHER_ALTER_MIN = 24 * 60;   // ganz Deutschland sind gut 30 MB – höchstens einmal am Tag neu

function speicherOeffnen(){
  return new Promise((ja, nein) => {
    try {
      const anfrage = indexedDB.open("platzfrei", 1);
      anfrage.onupgradeneeded = () => anfrage.result.createObjectStore("daten");
      anfrage.onsuccess = () => ja(anfrage.result);
      anfrage.onerror = () => nein(anfrage.error);
    } catch (e) { nein(e); }
  });
}
async function speicherLesen(){
  try {
    const d = await speicherOeffnen();
    return await new Promise(ja => {
      const a = d.transaction("daten").objectStore("daten").get("orte");
      a.onsuccess = () => ja(a.result || null);
      a.onerror = () => ja(null);
    });
  } catch { return null; }
}
/* Nach eigenen Änderungen: beim nächsten Start frisch laden. */
async function speicherVeraltet(){
  try {
    const d = await speicherOeffnen();
    const tx = d.transaction("daten", "readwrite").objectStore("daten");
    const a = tx.get("orte");
    a.onsuccess = () => { if (a.result) tx.put({ ...a.result, zeit: 0 }, "orte"); };
  } catch {}
}
async function speicherSchreiben(zeilen){
  try {
    const d = await speicherOeffnen();
    d.transaction("daten", "readwrite").objectStore("daten")
      .put({ zeit: Date.now(), zeilen }, "orte");
  } catch {}
}

/* Volle Angaben eines Platzes nachladen (für Detail und Bearbeiten). */
async function ortVollLaden(o){
  if (!ECHT || !o || o._voll || o._laedt) return;
  o._laedt = true;
  const { data, error } = await db.from("orte").select("*").eq("id", o.id).maybeSingle();
  o._laedt = false;
  if (error || !data) return;
  Object.assign(o, ausDb(data));
  if (String(Z.auswahlId) === String(o.id) && (Z.ansicht === "detail" || Z.ansicht === "bearbeiten")) zeichne();
}

/* Zusammengeführte Doppelte (Spalte doppelt_von, siehe
   wochen-import/supabase-wochen-import.sql) bleiben in der Datenbank, werden
   aber nie geladen. Fehlt die Spalte noch, laden wir wie bisher alles. */
let DOPPELT_PRUEFUNG = null, DOPPELT_FILTER = false;
function doppeltSpaltePruefen(){
  if (!DOPPELT_PRUEFUNG) DOPPELT_PRUEFUNG = db.from("orte").select("doppelt_von").limit(1)
    .then(({ error }) => { DOPPELT_FILTER = !error || error.code !== "42703"; });   // 42703 = Spalte fehlt
  return DOPPELT_PRUEFUNG;
}
/* Vorher einmal await doppeltSpaltePruefen(). */
function orteAbfrage(spalten, optionen){
  const q = db.from("orte").select(spalten, optionen);
  return DOPPELT_FILTER ? q.is("doppelt_von", null) : q;
}

/* Orte aus der Datenbank holen. Besucher bekommen nur den Kartenausschnitt
   (datenLadenAusschnitt), der Admin wie bisher ganz Deutschland – das
   brauchen Import, Doppelte und Export. */
async function datenLaden(){
  if (!ECHT) return;
  if (!Z.admin) return datenLadenAusschnitt();
  return datenLadenAlles();
}
async function datenLadenAlles(){
  AUSSCHNITT = false;

  const fehler = error => {
    melde("Datenbank nicht erreichbar. Schon das SQL-Skript ausgeführt?");
    console.error("Fehler beim Laden:", error);
  };
  /* geprueft = schon sortiert und nur Deutschland (so liegt es im Speicher) –
     die Grenzprüfung kostet bei 100.000 Plätzen rund eine Sekunde. */
  const uebernehmen = (zeilen, geprueft) => {
    if (!geprueft) {
      zeilen = zeilen.filter(z => inDeutschland(z.lat, z.lon));
      zeilen.sort((a,b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
    }
    /* Schon voll geladene Plätze (z. B. der gerade offene) behalten ihre Angaben. */
    const voll = new Map(DATEN.filter(o => o._voll).map(o => [String(o.id), o]));
    DATEN = zeilen.map(z => voll.get(String(z.id)) || ausDb(z));
    doppelteMarkieren();
    return zeilen;
  };

  /* 1. Aus dem Gerätespeicher – dann ist die Karte sofort da. */
  let gespeichert = await speicherLesen();
  if (gespeichert?.kacheln) gespeichert = null;   // nur Kartenausschnitte, nicht ganz Deutschland
  if (gespeichert?.zeilen?.length) {
    uebernehmen(gespeichert.zeilen, true);
    zeichne();
    const frisch = Date.now() - gespeichert.zeit < SPEICHER_ALTER_MIN * 60000;
    if (frisch && !Z.admin) return neueSeitSpeicher(gespeichert.zeit);
  }

  /* 2. Erstbesuch: zuerst nur die Umgebung (ein paar tausend Plätze, in
     ein bis zwei Sekunden da), danach ganz Deutschland im Hintergrund.
     Früher kamen zuerst 6.000 zufällige Plätze aus ganz Deutschland – in
     der eigenen Gegend war dann oft lange gar nichts zu sehen. */
  if (!gespeichert) {
    Z.laedtNoch = true;
    const ok = await umgebungLaden(Z.position);
    if (!ok) { Z.laedtNoch = false; fehler("Umgebung"); return; }
  }
  vollLaden(uebernehmen, !!gespeichert, fehler);   // läuft weiter, ohne den Start aufzuhalten
}

/* Der Gerätespeicher wird nur einmal am Tag ganz erneuert. Damit neu
   angenommene oder geänderte Plätze trotzdem gleich zu sehen sind, holen wir
   beim Start alles nach, was seit dem Speichern geprüft wurde (geprueft_am). */
async function neueSeitSpeicher(zeit){
  const ab = new Date(zeit - 86400000).toISOString().slice(0,10);
  await doppeltSpaltePruefen();
  const { data, error } = await orteAbfrage(LISTE_SPALTEN)
    .gte("geprueft_am", ab).order("id").limit(2000);
  if (error) { console.error(error); return; }
  if (!data?.length) return;
  const frisch = new Map(data.filter(z => inDeutschland(z.lat, z.lon)).map(z => [String(z.id), z]));
  DATEN = DATEN.map(o => {
    const z = frisch.get(String(o.id));
    if (!z) return o;
    frisch.delete(String(o.id));
    return o._voll ? o : ausDb(z);
  });
  for (const z of frisch.values()) DATEN.push(ausDb(z));
  doppelteMarkieren();
  zeichne();
}

/* Plätze rund um einen Punkt holen (gut 20 km) und zu den gezeigten
   dazunehmen. Läuft beim Start und noch einmal, sobald der echte Standort
   da ist – solange ganz Deutschland noch lädt. */
const UMGEBUNG_LAT = 0.2, UMGEBUNG_LON = 0.3;
let UMGEBUNG_ZULETZT = null;
async function umgebungLaden(pos){
  if (!ECHT) return false;
  if (UMGEBUNG_ZULETZT && entfernungKm(UMGEBUNG_ZULETZT, pos) < 5) return true;
  UMGEBUNG_ZULETZT = { lat:pos.lat, lon:pos.lon };
  await doppeltSpaltePruefen();
  const anfrage = von => orteAbfrage(LISTE_SPALTEN)
    .gte("lat", pos.lat - UMGEBUNG_LAT).lte("lat", pos.lat + UMGEBUNG_LAT)
    .gte("lon", pos.lon - UMGEBUNG_LON).lte("lon", pos.lon + UMGEBUNG_LON)
    .order("id").range(von, von + 999);
  /* Erst drei Seiten gleichzeitig; weitere nur, wenn die letzte voll war.
     Eine leere Seite ist für die Datenbank teuer (sie sucht bis zum Ende). */
  let von = 0, runde = 3;
  while (von < 10000) {
    const antworten = await Promise.all(Array.from({ length: runde }, (_, i) => anfrage(von + i * 1000)));
    if (antworten.some(a => a.error)) { console.error(antworten.find(a => a.error).error); return von > 0; }
    dazuNehmen(antworten.flatMap(a => a.data || []));
    if ((antworten[antworten.length - 1].data || []).length < 1000) break;
    von += runde * 1000; runde = 2;
  }
  return true;
}
function dazuNehmen(zeilen){
  if (!dazuNehmen.ausDb) { DATEN = []; dazuNehmen.ausDb = true; }
  const schon = new Set(DATEN.map(o => String(o.id)));
  let neu = 0;
  for (const z of zeilen) {
    if (schon.has(String(z.id)) || !inDeutschland(z.lat, z.lon)) continue;
    DATEN.push(ausDb(z)); schon.add(String(z.id)); ZEILEN.set(String(z.id), z); neu++;
  }
  if (!neu) return;
  doppelteMarkieren();
  zeichne();
}

/* --------------------------------------------------------------------------
   Nur laden, was man sieht (seit 27.10.2026)
   --------------------------------------------------------------------------
   Deutschland ist in Kacheln von 0,2° × 0,3° geteilt (gut 20 × 22 km).
   Ab Zoomstufe AUSSCHNITT_AB holt die App die Plätze der sichtbaren Kacheln,
   jede höchstens einmal am Tag (Gerätespeicher). Weiter herausgezoomt zeigt
   die Karte nur Kreise mit Anzahlen aus orte_raster() – eine kleine
   Abfrage statt 100.000 Plätze. Suche über ganz Deutschland: orte_suchen().
   SQL dazu: supabase-kartenausschnitt.sql.
   -------------------------------------------------------------------------- */
const KACHEL_LAT = 0.2, KACHEL_LON = 0.3, AUSSCHNITT_AB = 11;
const KACHELN = new Map();      // "i:j" -> true (geladen) | "laedt"
const ZEILEN = new Map();       // id -> Zeile wie aus der Datenbank (für den Gerätespeicher)
let ORTE_RASTER = null, KENNZAHLEN = null, SPEICHER_START = Date.now();
let AUSSCHNITT = false;         // true = nur Kartenausschnitte (Besucher, oder Admin, wenn ganz Deutschland nicht klappt)

async function datenLadenAusschnitt(){
  AUSSCHNITT = true;
  await doppeltSpaltePruefen();
  rasterLaden();
  kennzahlenLaden();
  const gespeichert = await speicherLesen();
  if (gespeichert?.kacheln && Date.now() - gespeichert.zeit < SPEICHER_ALTER_MIN * 60000) {
    SPEICHER_START = gespeichert.zeit;
    gespeichert.kacheln.forEach(k => KACHELN.set(k, true));
    dazuNehmen(gespeichert.zeilen || []);
    neueSeitSpeicher(gespeichert.zeit);
  }
  Z.laedtNoch = true; zeichne();
  const okUmgebung = await umgebungKacheln(Z.position);
  const ok = await ausschnittLaden() && okUmgebung;
  Z.laedtNoch = false;
  if (!ok && !DATEN.length) melde("Datenbank gerade nicht erreichbar. Bitte später noch einmal.");
  zeichne();
  markerZeichnen();
}

function kachelSchluessel(i, j){ return i + ":" + j; }
function kachelnIn(sued, west, nord, ost){
  const liste = [];
  for (let i = Math.floor(sued / KACHEL_LAT); i <= Math.floor(nord / KACHEL_LAT); i++)
    for (let j = Math.floor(west / KACHEL_LON); j <= Math.floor(ost / KACHEL_LON); j++)
      if (!KACHELN.has(kachelSchluessel(i, j))) liste.push([i, j]);
  return liste;
}
async function kachelLaden(i, j){
  const k = kachelSchluessel(i, j);
  KACHELN.set(k, "laedt");
  const sued = +(i * KACHEL_LAT).toFixed(4), west = +(j * KACHEL_LON).toFixed(4);
  const nord = +((i + 1) * KACHEL_LAT).toFixed(4), ost = +((j + 1) * KACHEL_LON).toFixed(4);
  const zeilen = [];
  for (let von = 0; von < 20000; von += 1000) {
    const abfrage = () => orteAbfrage(LISTE_SPALTEN)
      .gte("lat", sued).lt("lat", nord).gte("lon", west).lt("lon", ost)
      .order("id").range(von, von + 999);
    let { data, error } = await abfrage();
    if (error) { await new Promise(r => setTimeout(r, 1000)); ({ data, error } = await abfrage()); }
    if (error) { KACHELN.delete(k); console.error(error); return null; }
    zeilen.push(...data);
    if (data.length < 1000) break;    // leere Folgeseiten sind teuer – nur weiter, wenn voll
  }
  KACHELN.set(k, true);
  return zeilen;
}
/* Fehlende Kacheln holen, sechs gleichzeitig, und sofort zeigen. */
async function kachelnLaden(liste){
  let ok = true;
  for (let n = 0; n < liste.length; n += 6) {
    const teile = await Promise.all(liste.slice(n, n + 6).map(([i, j]) => kachelLaden(i, j)));
    if (teile.some(t => t === null)) ok = false;
    const zeilen = teile.flatMap(t => t || []);
    if (zeilen.length) dazuNehmen(zeilen);
  }
  if (liste.length) speicherMerken();
  return ok;
}
/* Umgebung des Standorts (gut 25 km), damit "Jetzt spielen", die Liste und
   der Entfernungsfilter auch über den Kartenrand hinaus stimmen. */
function umgebungKacheln(pos){
  if (!ECHT || !pos) return Promise.resolve(true);
  return kachelnLaden(kachelnIn(pos.lat - 0.23, pos.lon - 0.35, pos.lat + 0.23, pos.lon + 0.35));
}
function ausschnittLaden(){
  if (!ECHT || karte.getZoom() < AUSSCHNITT_AB) return Promise.resolve(true);
  const b = karte.getBounds().pad(0.15);
  const liste = kachelnIn(b.getSouth(), b.getWest(), b.getNorth(), b.getEast());
  return kachelnLaden(liste.slice(0, 30));
}
let ausschnittTimer = null;
function ausschnittPlanen(){
  clearTimeout(ausschnittTimer);
  ausschnittTimer = setTimeout(ausschnittLaden, 250);
}
/* Gerätespeicher: geladene Kacheln samt Plätzen, höchstens einmal pro Sekunde schreiben. */
let speicherTimer = null;
function speicherMerken(){
  clearTimeout(speicherTimer);
  speicherTimer = setTimeout(async () => {
    try {
      const d = await speicherOeffnen();
      d.transaction("daten", "readwrite").objectStore("daten").put({
        zeit: SPEICHER_START, zeilen: [...ZEILEN.values()],
        kacheln: [...KACHELN].filter(([, v]) => v === true).map(([k]) => k)
      }, "orte");
    } catch {}
  }, 1000);
}

async function rasterLaden(versuch = 0){
  const { data, error } = await db.rpc("orte_raster");
  if (error && versuch < 2) return setTimeout(() => rasterLaden(versuch + 1), 1500 * (versuch + 1));
  if (error) { console.warn("orte_raster fehlt (supabase-kartenausschnitt.sql)", error.message); return; }
  ORTE_RASTER = data || [];
  markerZeichnen();
}
async function kennzahlenLaden(versuch = 0){
  const { data, error } = await db.rpc("kennzahlen");
  if (error && versuch < 2) return setTimeout(() => kennzahlenLaden(versuch + 1), 2000 * (versuch + 1));
  if (error || !data) return;
  KENNZAHLEN = data;
  if (["ueber", "vereine", "partner"].includes(Z.ansicht)) zeichne();
}
/* Suche über ganz Deutschland: Treffer kommen zu den geladenen Plätzen dazu. */
let suchAnfrage = 0;
async function sucheServer(text){
  if (!ECHT || !AUSSCHNITT || text.trim().length < 3) return;
  const nr = ++suchAnfrage;
  const { data, error } = await db.rpc("orte_suchen", { p_text:text.trim() }).select(LISTE_SPALTEN);
  if (error || nr !== suchAnfrage || !data?.length) return;
  dazuNehmen(data);
  if (Z.ansicht === "liste" && Z.suche.trim()) { ansichtListe(true); markerZeichnen(); }
}

/* Weit herausgezoomt: Kreise aus orte_raster(). Die Kreise kennen je
   Sportart, wie viele Plätze frei und wie viele bestätigt sind – damit
   klappen Sportart- und Zugangsfilter auch über ganz Deutschland. Gemerkt,
   Flutlicht und "hier ist was los" zählen nur die geladenen Plätze. */
function rasterNutzen(){
  if (!AUSSCHNITT || !ORTE_RASTER || karte.getZoom() >= AUSSCHNITT_AB || Z.suche.trim()) return false;
  if (Z.nurGemerkt || Z.nurLicht || Z.nurLos) return false;
  const mitFilter = Z.sportart !== "alle" || Z.nurFrei || Z.nurBelegt;
  return !mitFilter || ORTE_RASTER.some(r => r.sport);    // alte Datenbank ohne Sportarten
}
/* Anzahl und Farbe eines Kreises unter den aktuellen Filtern. */
function rasterAnzahl(r){
  let n = r.n, frei = r.frei, sicher = r.sicher, rang = r.rang;
  if (Z.sportart !== "alle") {
    const s = r.sport?.[Z.sportart];
    if (!s) return null;
    [n, frei, sicher, rang] = s;
  }
  if (Z.nurBelegt) n = sicher; else if (Z.nurFrei) n = frei;
  if (Z.nurFrei && !Z.nurBelegt) rang = Math.min(rang, 1);
  return n > 0 ? { n, rang } : null;
}
function rasterZeichnen(){
  const zoom = karte.getZoom(), rahmen = karte.getBounds().pad(0.5);
  const zellen = new Map();
  for (const r of ORTE_RASTER) {
    if (!rahmen.contains([r.lat, r.lon])) continue;
    const a = rasterAnzahl(r);
    if (!a) continue;
    const p = karte.project([r.lat, r.lon], zoom);
    const k = Math.floor(p.x / BUENDEL_ZELLE) + ":" + Math.floor(p.y / BUENDEL_ZELLE);
    const g = zellen.get(k) || { n:0, x:0, y:0, rang:BUENDEL_RANG.length - 1, teile:[] };
    g.n += a.n; g.x += p.x * a.n; g.y += p.y * a.n; g.rang = Math.min(g.rang, a.rang);
    g.teile.push({ lat:r.lat, lon:r.lon, n:a.n, p });
    zellen.set(k, g);
  }
  /* Wie bei den Bündeln: zusammenlegen, bis sich keine Kreise mehr berühren. */
  let gruppen = [...zellen.values()];
  for (let geaendert = true; geaendert; ) {
    geaendert = false;
    gruppen.sort((a, b) => b.n - a.n);
    for (let i = 0; i < gruppen.length; i++) {
      const a = gruppen[i];
      if (!a) continue;
      for (let j = i + 1; j < gruppen.length; j++) {
        const b = gruppen[j];
        if (!b) continue;
        const abstand = Math.hypot(a.x / a.n - b.x / b.n, a.y / a.n - b.y / b.n);
        if (abstand >= buendelGroesse(a.n) / 2 + buendelGroesse(b.n) / 2 + 6) continue;
        a.n += b.n; a.x += b.x; a.y += b.y; a.rang = Math.min(a.rang, b.rang); a.teile.push(...b.teile);
        gruppen[j] = null;
        geaendert = true;
      }
    }
    gruppen = gruppen.filter(Boolean);
  }
  for (const g of gruppen) {
    /* Der Kreis sitzt auf dem Teil, der dem Schwerpunkt am nächsten liegt –
       der reine Schwerpunkt rutscht an der Grenze sonst ins Ausland. */
    const sx = g.x / g.n, sy = g.y / g.n;
    let nah = g.teile[0];
    for (const t of g.teile)
      if (Math.hypot(t.p.x - sx, t.p.y - sy) < Math.hypot(nah.p.x - sx, nah.p.y - sy)) nah = t;
    const mitte = L.latLng(nah.lat, nah.lon);
    const groesse = buendelGroesse(g.n);
    const text = g.n >= 1000 ? (g.n / 1000).toFixed(g.n >= 10000 ? 0 : 1).replace(".", ",") + "k" : g.n;
    L.marker(mitte, {
      icon: L.divIcon({ className:"buendel",
        html:`<span style="--ring:${BUENDEL_RANG[g.rang] || "#8E8E93"};width:${groesse}px;height:${groesse}px">${text}</span>`,
        iconSize:[groesse, groesse] }),
      keyboard:false
    })
    .on("click", () => g.teile.length > 1
      ? karte.flyToBounds(L.latLngBounds(g.teile.map(r => [r.lat, r.lon])).pad(0.3),
          { maxZoom:AUSSCHNITT_AB + 1, duration:.6 })
      : karte.flyTo(mitte, AUSSCHNITT_AB + 1, { duration:.6 }))
    .addTo(markerEbene);
  }
}

/* Ganz Deutschland: Supabase liefert höchstens 1000 Zeilen pro Anfrage –
   also erst zählen und dann viele Seiten gleichzeitig holen. */
async function vollLaden(uebernehmen, gespeichert, fehler){
  await doppeltSpaltePruefen();
  /* Genau zählen dauert bei 100.000 Plätzen fast so lange wie die Zeitgrenze –
     notfalls reicht die Schätzung der Datenbank (wir holen eine Seite mehr). */
  let { count, error: zaehlFehler } = await orteAbfrage("id", { count:"exact", head:true });
  if (zaehlFehler) ({ count, error: zaehlFehler } = await orteAbfrage("id", { count:"estimated", head:true }));
  if (zaehlFehler) {
    console.error("Zählen:", zaehlFehler);
    Z.laedtNoch = false;
    melde("Ganz Deutschland ließ sich nicht laden – zeige Kartenausschnitte.");
    return datenLadenAusschnitt();
  }
  count = Math.round((count || 0) * 1.05);

  /* Weniger gleichzeitig und jede Seite bis zu dreimal: Die Datenbank
     bricht bei Last einzelne Abfragen ab (Zeitgrenze). Klappt es trotzdem
     nicht, arbeitet auch der Admin mit Kartenausschnitten weiter. */
  const SEITE = 1000, GLEICHZEITIG = 4;
  const seite = async von => {
    let letzte;
    for (let versuch = 0; versuch < 3; versuch++) {
      letzte = await orteAbfrage(LISTE_SPALTEN).order("id").range(von, von + SEITE - 1);
      if (!letzte.error) return letzte;
      await new Promise(r => setTimeout(r, 800 * (versuch + 1)));
    }
    return letzte;
  };
  const anfaenge = [];
  for (let von = 0; von < (count || 0) + SEITE; von += SEITE) anfaenge.push(von);
  const alle = [];
  for (let i = 0; i < anfaenge.length; i += GLEICHZEITIG) {
    const antworten = await Promise.all(anfaenge.slice(i, i + GLEICHZEITIG).map(seite));
    for (const { data, error } of antworten) {
      if (error) {
        console.error("Ganz Deutschland laden:", error);
        Z.laedtNoch = false;
        melde("Ganz Deutschland ließ sich nicht laden – zeige Kartenausschnitte.");
        return datenLadenAusschnitt();
      }
      alle.push(...data);
    }
  }

  Z.laedtNoch = false;
  if (!alle.length) {
    melde("Die Datenbank ist noch leer – Abschnitt 7 im SQL-Skript fehlt.");
    return;
  }

  speicherSchreiben(uebernehmen(alle));
  VORSCHLAEGE = [];
  if (Z.admin) await Promise.all([vorschlaegeLaden(), fehlerLaden(), pruefungLaden(), importLaufLaden()]);
  zeichne();
  markerZeichnen();
}

/* Offene Fehlermeldungen. Lesen darf die Tabelle nur der Admin (RLS);
   fehlt sie noch, bleibt die Liste einfach leer. */
async function fehlerLaden(){
  if (!ECHT) return;
  const { data } = await db.from("fehlerberichte")
                           .select("*").eq("erledigt", false)
                           .order("erstellt", { ascending:false });
  FEHLERBERICHTE = data || [];
}

async function vorschlaegeLaden(){
  if (!ECHT) return;
  const { data } = await db.from("vorschlaege")
                           .select("*").eq("erledigt", false)
                           .order("erstellt_am", { ascending:false });
  VORSCHLAEGE = data || [];
}

function formularWerte(){
  const f = document.getElementById("formular");
  const w = {};
  for (const el of f.querySelectorAll("input[name],select[name],textarea[name]"))
    w[el.name] = el.value.trim();
  return w;
}

async function speichern(){
  const o = ort(Z.auswahlId);
  const w = formularWerte();

  const offen = {};          // darf jeder ändern
  const geschuetzt = {};     // nur Admins, und nur über die Datenbankfunktion

  for (const [feld, wert] of Object.entries(w)) {
    if (wert === "") continue;
    const neu = feld === "zustand"
      ? Math.max(1, Math.min(5, +wert || o.zustand))
      : wert;
    if (String(o[feld]) === String(neu)) continue;

    if (NUR_ADMIN.includes(feld) || (NUR_VORSCHLAG.includes(feld) && !Z.admin)) geschuetzt[feld] = neu;
    else if (OFFENE_FELDER.includes(feld) || NUR_VORSCHLAG.includes(feld)) offen[feld] = neu;
  }

  let vorgeschlagen = 0, zugangVorgeschlagen = false;

  // ----- offene Felder: direkt schreiben -----
  if (Object.keys(offen).length) {
    if (ECHT) {
      const zeile = { geprueft_am: heute() };
      for (const [f, v] of Object.entries(offen)) zeile[DB_SPALTE[f] || f] = v;

      const { error } = await db.from("orte").update(zeile).eq("id", o.id);
      if (error) { console.error(error); return melde("Speichern abgelehnt: " + error.message); }
    }
    Object.assign(o, offen);
    speicherVeraltet();
    o.geprueft = heute();
  }

  // ----- geschützte Felder -----
  if (Object.keys(geschuetzt).length) {
    if (Z.admin) {
      const ok = await zugangSetzen(
        o.id,
        geschuetzt.zugang          ?? o.zugang,
        geschuetzt.zeiten          ?? o.zeiten,
        geschuetzt.bestaetigtDurch ?? o.bestaetigtDurch
      );
      if (ok) { Object.assign(o, geschuetzt); o.geprueft = heute(); }
    } else {
      for (const [feld, neu] of Object.entries(geschuetzt)) {
        if (ECHT) {
          const { error } = await db.from("vorschlaege").insert({
            ort_id: o.id,
            feld: DB_SPALTE[feld] || feld,
            alter_wert: String(o[feld]),
            neuer_wert: String(neu)
          });
          if (error) { console.error(error); continue; }
        }
        VORSCHLAEGE.push({ ort_id:o.id, feld, alter_wert:o[feld], neuer_wert:neu });
        vorgeschlagen++;
        if (feld === "zugang") zugangVorgeschlagen = true;
      }
    }
  }

  Z.ansicht = "detail";
  zeichne();
  /* Drei gleiche Vorschläge übernimmt die Datenbank nur bei vermutetem Zugang. */
  const vermutet = o.bestaetigtDurch === "nur vermutet" || o.bestaetigtDurch === "Lage (OSM)";
  melde(zugangVorgeschlagen
    ? (vermutet ? "Danke! Sobald drei Leute dasselbe melden, wird es übernommen."
                : "Danke! Dein Vorschlag wird geprüft.")
    : vorgeschlagen
    ? `Gespeichert. ${vorgeschlagen} Änderung${vorgeschlagen>1?"en":""} wartet auf Freigabe.`
    : "Gespeichert.");
}

/* Formular "Ort hinzufügen" lesen, Sportarten und Wochentage aus den Häkchen. */
function neuFormularWerte(){
  const f = document.getElementById("formular");
  if (!f || Z.ansicht !== "neu") return Z.neuEntwurf || {};
  const w = formularWerte();
  const sp = [];
  for (const el of f.querySelectorAll("input[type=checkbox][name^='sp-']")) {
    if (el.checked) sp.push(el.name.slice(3));
    delete w[el.name];
  }
  for (const el of f.querySelectorAll("input[type=checkbox][name^='tag-']")) w[el.name] = el.checked;
  w.sportarten = sp.join(", ");
  return w;
}

/* Aus Zeitart, Raster, Altersgrenze und Zusatz einen Text für orte.zeiten,
   z. B. "Mo–So 08:00–20:00 (nur bis 14 Jahre; Mittagsruhe 13–15 Uhr)".
   null = nichts bekannt. */
function neuZeitenText(w){
  const basis = w.zeitenart === "feste Uhrzeiten" ? zeitenAusRaster(w)
              : w.zeitenart === "rund um die Uhr" || w.zeitenart === "tagsüber bis Dunkelheit" ? w.zeitenart
              : "";
  const extra = [w.alter && w.alter !== "keine" ? "nur " + w.alter : "", w.zeitzusatz || ""]
                .filter(Boolean).join("; ");
  if (!basis) return extra || null;
  return extra ? `${basis} (${extra})` : basis;
}

/* Quelle des Nutzers als Beleg, falls sie einer der Belege ist. */
function neuBeleg(quelle){
  return AUSWAHL.bestaetigtDurch.includes(quelle) ? quelle : "nur vermutet";
}

async function fotoHochladen(datei){
  const blob = await bildVerkleinern(datei);
  const pfad = `neu/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await db.storage.from("schilder").upload(pfad, blob, { contentType:"image/jpeg" });
  if (error) throw error;
  return pfad;
}

/* Nutzer: Vorschlag mit Pflichtfoto in "neue_orte". Erscheint erst nach
   der Prüfung durch den Admin auf der Karte. */
async function neuVorschlagen(w){
  if (!Z.neuFoto) return melde("Bitte noch ein Foto vom Platz hinzufügen.");
  melde("Wird gesendet …");
  const p = Z.neuerPunkt;
  if (ECHT) {
    let pfad, schildPfad = null;
    try {
      pfad = await fotoHochladen(Z.neuFoto);
      if (Z.neuSchildFoto && w.quelle === "Schild vor Ort") schildPfad = await fotoHochladen(Z.neuSchildFoto);
    } catch (e) { console.error(e); return melde("Foto hochladen hat nicht geklappt."); }
    const basis = {
      name:w.name.slice(0,120), ort:w.ort || null, lat:p.lat, lon:p.lon,
      sportarten:w.sportarten.split(",").map(s=>s.trim()).filter(Boolean),
      zugang:w.zugang || null, untergrund:w.untergrund || null,
      ausstattung:w.ausstattung || null, foto:pfad,
      abstand_m: Z.positionEcht ? Math.round(entfernungKm(Z.position, p) * 1000) : null,
      geraet:geraetId() };
    const zeiten = neuZeitenText(w);
    const neu = { ...basis, hinweis:w.hinweis || null,
      zeiten: zeiten ? zeiten.slice(0,300) : null,
      quelle: w.quelle === "weiß ich nicht" ? null : w.quelle,
      quelle_detail: w.quelledetail ? w.quelledetail.slice(0,300) : null,
      schild_foto: schildPfad, groesse: w.groesse || null,
      beleuchtung: w.beleuchtung === "weiß nicht" ? null : w.beleuchtung,
      umzaeunt: w.umzaeunt === "weiß nicht" ? null : w.umzaeunt };
    let { error } = await db.from("neue_orte").insert(neu);
    // Ältere Tabelle ohne die neuen Spalten: alles in den Hinweis schreiben.
    if (error && /column|schema cache/i.test(error.message || "")) {
      const zusatz = [zeiten && "Zeiten: " + zeiten,
        neu.quelle && "Quelle: " + neu.quelle + (neu.quelle_detail ? " (" + neu.quelle_detail + ")" : ""),
        schildPfad && "Schildfoto: " + schildPfad,
        "Größe: " + w.groesse, neu.beleuchtung && "Licht: " + neu.beleuchtung,
        neu.umzaeunt && "umzäunt: " + neu.umzaeunt, w.hinweis].filter(Boolean).join(" · ");
      ({ error } = await db.from("neue_orte").insert({ ...basis, hinweis:zusatz.slice(0,1000) || null }));
    }
    if (error) { console.error(error); return melde("Senden hat nicht geklappt: " + error.message); }
  }
  Z.neuerPunkt = null; Z.neuFoto = null; Z.neuSchildFoto = null; Z.neuEntwurf = null;
  Z.ansicht = "liste";
  zeichne();
  melde("Danke! Wir prüfen den Platz und schalten ihn dann frei.");
  zaehle("neueOrte");
}

async function neuSpeichern(){
  if (!Z.neuerPunkt) return melde("Bitte zuerst auf die Karte tippen.");
  const w = neuFormularWerte();
  if (!w.name) return melde("Ein Name fehlt noch.");
  if (!w.sportarten) return melde("Bitte mindestens eine Sportart wählen.");
  if (w.zeitenart === "feste Uhrzeiten" && !zeitenAusRaster(w))
    return melde("Bitte mindestens einen Tag anhaken.");
  if (!Z.admin) return neuVorschlagen(w);

  const notizen = [w.quelledetail && "Quelle: " + w.quelle + " (" + w.quelledetail + ")", w.hinweis]
                  .filter(Boolean).join(". ");
  const zeile = {
    name: w.name,
    ort: w.ort || null,
    lat: Z.neuerPunkt.lat,
    lon: Z.neuerPunkt.lon,
    sportarten: (w.sportarten || "Fußball").split(",").map(s=>s.trim()).filter(Boolean),
    zugang: w.zugang,
    zeiten: neuZeitenText(w) || "unbekannt",
    bestaetigt_durch: neuBeleg(w.quelle),
    untergrund: w.untergrund,
    groesse: w.groesse || "Kleinfeld",
    ausstattung: w.ausstattung || null,
    umzaeunt: w.umzaeunt === "ja" ? "ja" : "nein",
    beleuchtung: w.beleuchtung === "ja" ? "ja" : "nein",
    zustand: 3,
    notizen,
    geprueft_am: heute(),
    freigegeben: true           // hier kommt nur der Admin an – er ist selbst die Prüfung
  };

  if (ECHT) {
    const { data, error } = await db.from("orte").insert(zeile).select().single();
    if (error) {
      console.error(error);
      if ((error.message || "").includes("duplicate key"))
        return melde("Diesen Ort gibt es schon – ergänze lieber den bestehenden Eintrag.");
      return melde("Anlegen abgelehnt: " + error.message);
    }
    DATEN.push(ausDb(data));
    speicherVeraltet();
  } else {
    DATEN.push(ausDb({ ...zeile, id:"O"+String(DATEN.length+1).padStart(2,"0") }));
  }

  Z.neuerPunkt = null; Z.neuSchildFoto = null; Z.neuEntwurf = null;
  Z.ansicht = "liste";
  zeichne();
  melde("Gespeichert – der Platz ist jetzt für alle auf der Karte.");
}

/* "Ich bin gerade hier": Standort holen, die Datenbank prüft den Abstand. */
function hierEinchecken(id){
  if (!ECHT) return melde("Geht nur in der echten App.");
  if (!navigator.geolocation) return melde("Dein Gerät gibt keinen Standort heraus.");
  melde("Standort wird geprüft …");
  navigator.geolocation.getCurrentPosition(async p => {
    Z.position = { lat:p.coords.latitude, lon:p.coords.longitude };
    Z.positionEcht = true;
    const { data, error } = await db.rpc("bin_hier", {
      p_ort:String(id), p_geraet:geraetId(),
      p_lat:p.coords.latitude, p_lon:p.coords.longitude });
    if (error) {
      const weit = /zu weit weg: (\d+)/.exec(error.message || "");
      console.warn("Einchecken:", error.message);
      return melde(weit
        ? `Du bist ${weit[1]} m entfernt. Einchecken geht nur direkt am Platz.`
        : "Konnte nicht einchecken.");
    }
    try { localStorage.setItem(HIER_SCHLUESSEL, JSON.stringify({ ort:String(id), bis:data })); } catch {}
    await aktivLaden();
    zeichne();
    melde("Eingecheckt für 2 Stunden. Viel Spaß!");
    zaehle("checkins", id);
    zugangFragen(id);
  },
  () => melde("Ohne Standort geht Einchecken nicht. Erlaube ihn in den Einstellungen."),
  { enableHighAccuracy:true, timeout:45000, maximumAge:30000 });
}

async function hierAuschecken(){
  try { localStorage.removeItem(HIER_SCHLUESSEL); } catch {}
  if (ECHT) {
    const { error } = await db.rpc("bin_weg", { p_geraet:geraetId() });
    if (error) console.warn("Auschecken:", error.message);
    await aktivLaden();
  }
  zeichne();
  melde("Ausgecheckt.");
}

/* Wer ist gerade wo? Nur Anzahlen, die Datenbank liefert erst ab 2. */
async function aktivLaden(){
  if (!ECHT) return false;
  const { data, error } = await db.rpc("gerade_aktiv");
  if (error) { console.warn("Gerade aktiv:", error.message); return false; }
  const neu = {};
  for (const z of data || []) neu[z.ort_id] = z.anzahl;
  const geaendert = JSON.stringify(neu) !== JSON.stringify(Z.aktiv);
  Z.aktiv = neu;
  return geaendert;
}

/* Jede Minute nachsehen, solange die App offen und sichtbar ist. Nur die

/* "Hier gespielt": der billigste und deshalb häufigste Pflegevorgang.
   Zählt als Bestätigung (einmal pro Gerät) und setzt das Prüfdatum hoch. */
async function alsGepruefT(id){
  const neu = !BESTAETIGT.has(id);
  if (ECHT && neu) {
    const { error } = await db.from("bestaetigungen")
                             .insert({ ort_id:id, art:"gespielt", geraet:geraetId() });
    /* 23505 = dieses Gerät hat schon bestätigt (z. B. Speicher gelöscht). */
    if (error && error.code !== "23505") {
      console.error(error);
      return melde(bremseText(error) || "Konnte nicht gespeichert werden.");
    }
  }
  if (ECHT) {
    const { error } = await db.from("orte")
                             .update({ geprueft_am: heute() }).eq("id", id);
    if (error) console.error(error);
  }
  if (neu) {
    Z.bestaetigungen[id] = (Z.bestaetigungen[id] || 0) + 1;
    BESTAETIGT.add(id);
    try { localStorage.setItem(BESTAETIGT_SCHLUESSEL, JSON.stringify([...BESTAETIGT])); } catch {}
  }
  ort(id).geprueft = heute();
  zeichne();
  melde(neu ? "Danke – deine Bestätigung zählt." : "Danke – als heute geprüft vermerkt.");
  if (neu) zaehle(null);   // Platzprüfer zählt BESTAETIGT direkt
}

/* Nach dem Check-in kurz fragen: Darf man hier spielen? Wer gerade am
   Platz steht (der Server hat die 300 m geprüft), weiß es am besten.
   "Ja" zählt wie "Hier gespielt", "Nein" wird zur Meldung oder zum
   Schildfoto, "Weiß nicht" schließt nur. Pro Platz und Gerät nur einmal,
   und nie bei Plätzen mit amtlichem Beleg. Ändert den Zugang nie direkt. */
const GEFRAGT_SCHLUESSEL = "platzfrei.gefragt";
function schonGefragt(id){
  try { return (JSON.parse(localStorage.getItem(GEFRAGT_SCHLUESSEL) || "[]")).includes(String(id)); }
  catch { return false; }
}
function gefragtMerken(id){
  try {
    const l = JSON.parse(localStorage.getItem(GEFRAGT_SCHLUESSEL) || "[]");
    if (!l.includes(String(id))) l.push(String(id));
    localStorage.setItem(GEFRAGT_SCHLUESSEL, JSON.stringify(l.slice(-500)));
  } catch {}
}
function zugangFragen(id, immer){
  const o = ort(id);
  if (!o) return;
  if (!immer && (belegt(o) || BESTAETIGT.has(o.id) || schonGefragt(o.id))) return;
  document.querySelector(".einf")?.remove();
  const el = document.createElement("div");
  el.className = "einf";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-modal", "true");
  el.setAttribute("aria-label", "Darf man hier spielen?");
  const zu = () => { el.remove(); document.removeEventListener("keydown", taste); };
  const taste = e => { if (e.key === "Escape") { gefragtMerken(o.id); zu(); } };
  const st = zugangStufe(o);
  const schritt1 = () => {
    el.innerHTML = `<div class="einf-karte">
        <button class="einf-weg" data-fweg="1">Später</button>
        <div class="einf-bild">⚽️</div>
        <h2>Darf man hier spielen?</h2>
        <p>Du bist gerade bei <b>${esc(o.name)}</b>. Bisher steht dort:
          ${st.icon} ${esc(st.titel)}. Deine Antwort hilft allen, die nach dir kommen.</p>
        <div class="frage-knoepfe">
          <button class="knopf" data-fja="1">Ja, hier darf man spielen</button>
          <button class="knopf zweit" data-fnein="1">Nein, eher nicht</button>
          <button class="knopf zweit" data-fweiss="1">Weiß ich nicht</button>
        </div>
        <label class="frage-klein"><input type="file" accept="image/*" hidden data-ffoto="1">
          <span class="inline-knopf" tabindex="0" role="button">📷 Schild mit den Regeln fotografieren</span></label>
        <small class="frage-klein">Anonym, ohne Namen. Bitte nur das Schild fotografieren, keine Personen.</small>
      </div>`;
    el.querySelector("[data-fja]").focus();
  };
  const schritt2 = () => {
    el.innerHTML = `<div class="einf-karte">
        <button class="einf-weg" data-fweg="1">Schließen</button>
        <div class="einf-bild">✋</div>
        <h2>Was spricht dagegen?</h2>
        <p>Wir prüfen den Platz. Der Zugang ändert sich erst, wenn wir einen Beleg haben.</p>
        <div class="frage-knoepfe">
          <label class="knopf"><input type="file" accept="image/*" hidden data-ffoto="1">📷 Ein Schild verbietet es</label>
          <button class="knopf zweit" data-fgrund="weggeschickt">Ich wurde weggeschickt</button>
          <button class="knopf zweit" data-fgrund="abgesperrt">Tor ist zu oder abgesperrt</button>
          <button class="knopf zweit" data-fweiss="1">Nur so ein Gefühl</button>
        </div>
      </div>`;
  };
  el.addEventListener("click", e => {
    if (e.target.closest("[data-fja]"))   { gefragtMerken(o.id); zu(); return alsGepruefT(o.id); }
    if (e.target.closest("[data-fnein]")) { gefragtMerken(o.id); return schritt2(); }
    const g = e.target.closest("[data-fgrund]");
    if (g) { zu(); return meldungAbgeben(g.dataset.fgrund, o.id); }
    if (e.target.closest("[data-fweiss],[data-fweg]")) {
      gefragtMerken(o.id); zu();
      if (e.target.closest("[data-fweiss]")) melde("Kein Problem – danke fürs Einchecken.");
      return;
    }
    if (e.target === el) { gefragtMerken(o.id); zu(); }
  });
  el.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".frage-klein [role=button]")) {
      e.preventDefault(); el.querySelector("[data-ffoto]").click();
    }
  });
  el.addEventListener("change", e => {
    if (!e.target.matches("[data-ffoto]") || !e.target.files?.[0]) return;
    gefragtMerken(o.id); zu();
    schildHochladen(e.target.files[0], o.id);
  });
  document.addEventListener("keydown", taste);
  document.body.appendChild(el);
  schritt1();
}

/* Export bleibt als Sicherheitsnetz: alles als JSON herunterladen. */
async function exportieren(){
  if (!Z.admin) return;
  /* Karte und Liste haben nur die Listenfelder – für die Sicherung alles holen. */
  let orte = DATEN;

    melde("Export wird vorbereitet …");

const GEMELDET_SCHLUESSEL = "platzfrei.gemeldet";
function eigeneMeldungen(id){

/* Anzahl offener Meldungen je Ort holen. Ein Aufruf für alle. Gezählt
   werden nur die letzten 48 Stunden: Pro Anschluss ist nur eine Meldung
   am Tag erlaubt, über mehrere Tage könnte sonst eine Person allein die
   Warnung auslösen. Ohne Leserecht auf erstellt_am: alle wie bisher. */
async function meldungenLaden(){
  if (!ECHT) return;
  const seit = new Date(Date.now() - 48 * 36e5).toISOString();
  let { data, error } = await db.from("meldungen")
                               .select("ort_id").eq("erledigt", false)
                               .gte("erstellt_am", seit);
  if (error) ({ data, error } = await db.from("meldungen")
                                      .select("ort_id").eq("erledigt", false));
  if (error) return;
  const zaehler = {};
  for (const m of data) zaehler[m.ort_id] = (zaehler[m.ort_id] || 0) + 1;
  Z.meldungen = zaehler;
}

/* Alles in einem Rutsch: "Hier gespielt" der letzten zwölf Monate zählen,
   Fotos einsammeln. Fotos sieht die Datenbank-Regel nach nur freigegeben –
   außer für den Admin. Fehlt die Tabelle noch, bleibt einfach alles leer. */
async function bestaetigungenLaden(){
  if (!ECHT) return;
  const seit = new Date(Date.now() - 365 * 864e5).toISOString();
  const zeilen = [];
  const SEITE = 1000;
  for (let von = 0; ; von += SEITE) {
    const { data, error } = await db.from("bestaetigungen")
      .select("id,ort_id,art,foto,freigegeben,erstellt")
      .eq("verworfen", false)
      .order("id").range(von, von + SEITE - 1);
    if (error) { console.warn("Bestätigungen:", error.message); return; }
    zeilen.push(...data);
    if (data.length < SEITE) break;
  }
  const zaehler = {}, schilder = {};
  for (const b of zeilen) {
    if (b.art === "gespielt" && b.erstellt >= seit)
      zaehler[b.ort_id] = (zaehler[b.ort_id] || 0) + 1;
    if (b.art === "schild" && b.foto)
      (schilder[b.ort_id] ||= []).push({ id:b.id, pfad:b.foto, freigegeben:b.freigegeben, url:"" });
  }
  await fotoLinksHolen(zeilen.filter(b => b.art === "schild" && b.foto).map(b => b.foto));
  for (const liste of Object.values(schilder)) for (const f of liste) f.url = fotoUrl(f.pfad);
  Z.bestaetigungen = zaehler;
  Z.schilder = schilder;
}

/* Fotos liegen privat (supabase-missbrauchsschutz.sql). Zu sehen sind sie
   nur über Links, die nach einigen Stunden ablaufen, und die gibt die
   Datenbank nur für freigegebene Fotos heraus (dem Admin für alle). Solange
   der Speicher noch öffentlich ist, klappt der alte öffentliche Link. */
const FOTO_LINKS = new Map();
/* Server-Bremse (supabase-missbrauchsschutz.sql): verständliche Meldung. */
function bremseText(error){
  return /Zu viele Anfragen/.test(error?.message || "") ? "Gerade zu viele Anfragen von deinem Anschluss. Bitte später noch einmal." : "";
}
function fotoUrl(pfad){ return FOTO_LINKS.get(pfad) || ""; }
async function fotoLinksHolen(pfade){
  const fehlen = [...new Set(pfade.filter(p => p && !FOTO_LINKS.has(p)))];
  if (!ECHT || !fehlen.length) return;
  let data = null;
  try { ({ data } = await db.storage.from("schilder").createSignedUrls(fehlen, 6 * 3600)); } catch {}
  for (const p of fehlen) {
    const d = (data || []).find(x => x.path === p && x.signedUrl);
    FOTO_LINKS.set(p, d ? d.signedUrl : db.storage.from("schilder").getPublicUrl(p).data.publicUrl);
  }
}

/* Handyfotos sind 4–12 MB groß. Vor dem Hochladen auf 1600 px verkleinern:
   spart Datenvolumen, und das Neuzeichnen wirft nebenbei die GPS-Daten
   aus dem Foto (EXIF) weg. */
async function bildVerkleinern(datei, maxPx = 1600, qualitaet = 0.82){
  let bild;
  try { bild = await createImageBitmap(datei, { imageOrientation:"from-image" }); }
  catch {
    bild = await new Promise((ok, fehler) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = fehler;
      img.src = URL.createObjectURL(datei);
    });
  }
  const b = bild.width, h = bild.height;
  const faktor = Math.min(1, maxPx / Math.max(b, h));
  const c = document.createElement("canvas");
  c.width = Math.round(b * faktor);
  c.height = Math.round(h * faktor);
  c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
  return await new Promise((ok, fehler) =>
    c.toBlob(blob => blob ? ok(blob) : fehler(new Error("leer")), "image/jpeg", qualitaet));
}

async function schildHochladen(datei, id){
  const o = ort(id ?? Z.auswahlId);
  if (!o || !datei) return;
  if (!datei.type.startsWith("image/")) return melde("Bitte ein Foto auswählen.");

  melde("Foto wird hochgeladen …");
  let blob;
  try { blob = await bildVerkleinern(datei); }
  catch { return melde("Das Foto ließ sich nicht lesen."); }

  let eintrag;
  if (ECHT) {
    const pfad = `${o.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error:e1 } = await db.storage.from("schilder")
                                 .upload(pfad, blob, { contentType:"image/jpeg" });
    if (e1) { console.error(e1); return melde("Hochladen hat nicht geklappt."); }
    const { error:e2 } = await db.from("bestaetigungen")
      .insert({ ort_id:o.id, art:"schild", foto:pfad, geraet:geraetId() });
    if (e2) { console.error(e2); return melde(bremseText(e2) || "Hochladen hat nicht geklappt."); }
    /* Eigene Vorschau aus dem Gerät – das Foto selbst ist bis zur Freigabe privat. */
    eintrag = { id:null, pfad, freigegeben:false, url: URL.createObjectURL(blob) };
  } else {
    eintrag = { id:"lokal-" + Date.now(), pfad:null, freigegeben:false,
                url: URL.createObjectURL(blob) };
  }

  /* Der Admin sieht das Foto sofort (mit echter id nach dem Neuladen),
     alle anderen erst nach der Freigabe. */
  if (Z.admin && ECHT) await bestaetigungenLaden();
  else (Z.schilder[o.id] ||= []).push(eintrag);
  zeichne();
  melde("Danke! Das Foto geht in die Prüfung.");
  zaehle("fotos");
}

/* Route: öffnet die Karten-App des Geräts mit dem Platz als Ziel.
   Apple Maps auf iOS und Mac, sonst Google Maps. */
/* --------------------------------------------------------------------------
   Straße ergänzen: Viele Plätze aus OpenStreetMap heißen nur „Fußballplatz
   Krailling“. Öffnet jemand so einen Platz, fragen wir bei Nominatim
   (OpenStreetMap) die Straße ab und speichern sie für alle. Nominatim
   erlaubt höchstens eine Anfrage pro Sekunde – deshalb eine Warteschlange.
   -------------------------------------------------------------------------- */
const ADRESSE_WARTE = [];
const ADRESSE_VERSUCHT = new Set();
let adresseLaeuft = false;

/* Nur beim Öffnen eines Platzes und je Gerät höchstens einmal pro Platz
   (Nominatim-Nutzungsregeln: keine Massenabfragen). */
const ADRESSE_SCHLUESSEL = "platzfrei.adresse.versucht";
try { JSON.parse(localStorage.getItem(ADRESSE_SCHLUESSEL) || "[]").forEach(id => ADRESSE_VERSUCHT.add(id)); } catch {}
function adresseErgaenzen(o){
  if (!o || (o.ort && o.ort.includes(",")) || ADRESSE_VERSUCHT.has(o.id)) return;
  ADRESSE_VERSUCHT.add(o.id);
  try { localStorage.setItem(ADRESSE_SCHLUESSEL, JSON.stringify([...ADRESSE_VERSUCHT].slice(-300))); } catch {}
  ADRESSE_WARTE.push(o);
  if (!adresseLaeuft) adresseNaechste();
}

async function adresseNaechste(){
  const o = ADRESSE_WARTE.shift();
  if (!o) { adresseLaeuft = false; return; }
  adresseLaeuft = true;
  try {
    const u = new URL("https://nominatim.openstreetmap.org/reverse");
    u.search = new URLSearchParams({ format:"jsonv2", lat:o.lat, lon:o.lon, zoom:"17",
                                     addressdetails:"1", "accept-language":"de" });
    const a = (await (await fetch(u)).json()).address || {};
    const strasse = a.road || a.pedestrian || a.footway || a.path || a.cycleway
                 || a.square || a.park || a.neighbourhood || a.hamlet;
    const stadt = a.city || a.town || a.village || a.municipality;
    const teil  = a.city && (a.suburb || a.city_district);
    const ortNeu = stadt ? (teil && teil !== stadt ? `${stadt}-${teil}` : stadt) : null;
    if (strasse && ortNeu) adresseUebernehmen(o, ortNeu, strasse);
  } catch {}
  setTimeout(adresseNaechste, 1100);
}

/* Gleiche Regel wie die Datenbankfunktion adresse_ergaenzen: Endet der Name
   auf den alten Ort, wird der Ort ersetzt und die Straße angehängt. */
function neuerNameMitAdresse(name, altOrt, ortNeu, strasse, platzhalter){
  if (platzhalter && (!altOrt || altOrt === "—")) return name + " " + ortNeu + ", " + strasse;
  if (altOrt && altOrt !== "—" && name.endsWith(" " + altOrt))
    return name.slice(0, name.length - altOrt.length) + ortNeu + ", " + strasse;
  return name;
}

async function adresseUebernehmen(o, ortNeu, strasse){
  const nameNeu = neuerNameMitAdresse(o.name, o.ort, ortNeu, strasse, o.platzhalter);
  if (ECHT) {
    /* Die Datenbank antwortet mit "ok", "ok_ohne_name" oder einem Grund,
       warum sie nichts geändert hat (z. B. Ort passt nicht). */
    let antwort = null;
    try { ({ data:antwort } = await db.rpc("adresse_ergaenzen", { p_id:o.id, p_ort:ortNeu, p_strasse:strasse })); } catch {}
    if (antwort !== null && !String(antwort).startsWith("ok")) return;
    if (antwort === "ok_ohne_name") { o.ort = ortNeu + ", " + strasse; return; }
  }
  o.name = nameNeu;
  o.ort = ortNeu + ", " + strasse;
  /* Nur das Nötigste neu zeichnen, damit nichts springt. */
  if (Z.ansicht === "detail" && Z.auswahlId === o.id) {
    const n = seite.querySelector(".dname"), d = seite.querySelector(".dort");
    if (n) n.textContent = o.name;
    if (d) d.textContent = o.ort + (mitKm() ? ` · ${entfText(entfernungKm(Z.position,o))} entfernt` : ``);
  }
  const zeile = seite.querySelector(`.zeile[data-ort="${CSS.escape(String(o.id))}"] .zname`);
  if (zeile) zeile.textContent = o.name;
}

/* Teilen: Link direkt auf den Platz – zum Verabreden mit Freunden. */
async function teilen(id){
  const o = ort(id);
  if (!o) return;
  const url = location.origin + location.pathname + "#platz=" + encodeURIComponent(id);
  const text = `${o.name} – ${markeArt(o)[1]}. Lass uns da spielen!`;
  if (navigator.share) {
    try { await navigator.share({ title:o.name, text, url }); } catch {}
    return;
  }
  try { await navigator.clipboard.writeText(url); melde("Link kopiert."); }
  catch { prompt("Link zum Platz:", url); }
}
async function platzAusAdresse(){
  if (location.hash === "#partner") { Z.ansicht = "partner"; zeichne(); sheet.aufmachen(); return; }
  if (/^#(impressum|datenschutz)$/.test(location.hash)) { Z.ansicht = "rechtliches"; zeichne(); sheet.aufmachen(); return; }

function routeOeffnen(id){
  const o = ort(id);

  Z.laden = true; zeichne();

  Z.laden = false;

    zeichne();
    console.error("Anmeldung:", error);

    if (m.includes("email not confirmed"))

/* ==========================================================================
   6c. IMPORT AUS OPENSTREETMAP
   --------------------------------------------------------------------------
   Nimmt eine GeoJSON-Datei aus overpass-turbo.eu entgegen und übersetzt sie
   in unsere Orte. Grundsatz dabei: Der Zugang wird IMMER als "unklar" mit
   "nur vermutet" gespeichert – OSM weiß nicht, ob man dort spielen darf.
   Genau das ist ja die Frage, die nur ihr vor Ort beantworten könnt.
   ========================================================================== */

/* Welcher OSM-Sportwert wird welche unserer Sportarten? Alles andere
   (Tennis, Golf, Reiten …) wird bewusst übersprungen. */
const OSM_SPORT = {
  soccer:"Fußball", football:"Fußball",
  basketball:"Basketball", streetball:"Basketball",
  table_tennis:"Tischtennis",
  beachvolleyball:"Beachvolleyball", volleyball:"Beachvolleyball",
  running:"Laufen", athletics:"Laufen",
  fitness:"Calisthenics", calisthenics:"Calisthenics", exercise:"Calisthenics",
  skateboard:"Skaten",
  multi:"Fußball"   // Multifunktionsfelder sind fast immer Bolzplätze
};

const OSM_BELAG = {
  grass:"Naturrasen",
  artificial_turf:"Kunstrasen", artificial_grass:"Kunstrasen",
  asphalt:"Beton/Asphalt", concrete:"Beton/Asphalt", paved:"Beton/Asphalt",
  clay:"Asche", dirt:"Asche", earth:"Asche", fine_gravel:"Asche", compacted:"Asche",
  tartan:"Tartan", sand:"Sand"
};

function sportartenAusTags(t){
  const roh = (t.sport || "").split(";").map(s=>s.trim().toLowerCase()).filter(Boolean);
  const menge = new Set();
  for (const r of roh) {
    if (OSM_SPORT[r]) menge.add(OSM_SPORT[r]);
    if (r === "multi") menge.add("Basketball");
  }
  /* Basketballkorb oder Tor auf einem Spielplatz (playground=basketball usw.) */
  const spielgeraet = { basketball:"Basketball", football:"Fußball", soccer:"Fußball",
                        table_tennis:"Tischtennis" }[(t.playground || "").toLowerCase()];
  if (spielgeraet) menge.add(spielgeraet);
  if (!menge.size && t.leisure === "fitness_station") menge.add("Calisthenics");
  return [...menge];
}

/* Overpass liefert Punkte, Linien und Flächen. Für Flächen nehmen wir die
   Mitte des Umrisses – für "wo ist der Platz" ist das genau genug. */
function mittelpunkt(g){
  if (!g) return null;
  if (g.type === "Point") return { lat:g.coordinates[1], lon:g.coordinates[0] };
  let ring = null;
  if (g.type === "Polygon")           ring = g.coordinates[0];
  else if (g.type === "MultiPolygon") ring = g.coordinates[0][0];
  else if (g.type === "LineString")   ring = g.coordinates;
  if (!ring || !ring.length) return null;
  let lat = 0, lon = 0;
  for (const p of ring) { lon += p[0]; lat += p[1]; }
  return { lat:+(lat/ring.length).toFixed(6), lon:+(lon/ring.length).toFixed(6) };
}

function ortSchluessel(name, lat, lon){
  return name + "|" + lat.toFixed(5) + "|" + lon.toFixed(5);
}

/* --------------------------------------------------------------------------
   CSV aus dem Open-Data-Portal München
   --------------------------------------------------------------------------
   Der Datensatz "Öffentliche Spielplätze München" listet in der Spalte
   "Besondere Angebote" genau das, was uns interessiert: Bolzplatz,
   Streetball, Tischtennis, Skateanlage, Beachvolleyball, Fitness Parcours.
   Alles andere (Wasserspiel, Rodelhügel, Klettern …) wird übersprungen.

   Eigenheiten des Datensatzes, die der Import abfangen muss:
   - Felder können Kommas UND Zeilenumbrüche enthalten, in "" eingeschlossen
   - mehrere Angebote pro Feld, durch Zeilenumbruch getrennt
   - derselbe Ort erscheint mehrfach mit verschiedenen SERVICE.IDs
   -------------------------------------------------------------------------- */

/* Kleiner, aber vollständiger CSV-Parser: kommt mit Anführungszeichen,
   verdoppelten Anführungszeichen und Umbrüchen im Feld zurecht. */
function csvLesen(text){
  const zeilen = [];
  let feld = "", zeile = [], inAnf = false;

  for (let i = 0; i < text.length; i++) {
    const z = text[i];

    if (inAnf) {
      if (z === '"') {
        if (text[i+1] === '"') { feld += '"'; i++; }   // "" = ein "
        else inAnf = false;
      } else feld += z;
      continue;
    }

    if (z === '"')       { inAnf = true; }
    else if (z === ",")  { zeile.push(feld); feld = ""; }
    else if (z === "\n") { zeile.push(feld); zeilen.push(zeile); zeile = []; feld = ""; }
    else if (z !== "\r") { feld += z; }
  }
  if (feld !== "" || zeile.length) { zeile.push(feld); zeilen.push(zeile); }
  return zeilen;
}

/* Angebot aus dem München-Datensatz -> unsere Sportart */
const MUC_SPORT = {
  "bolzplatz":"Fußball",
  "streetball":"Basketball",
  "tischtennis":"Tischtennis",
  "skateanlage":"Skaten",
  "beachvolleyball":"Beachvolleyball",
  "fitness parcours":"Calisthenics"
};

/* "Spielplatz ""Luitpoldpark Bolzplatz""" -> "Luitpoldpark Bolzplatz" */
function mucName(roh){
  let n = (roh || "").replace(/\s+/g, " ").trim();
  const treffer = n.match(/"([^"]+)"/);
  if (treffer) n = treffer[1].trim();
  n = n.replace(/^(Service\s+)?Spielplatz\s*/i, "").trim();
  return n || "Sportfläche";
}

async function importMuenchen(text){
  const zeilen = csvLesen(text);
  if (zeilen.length < 2) return melde("Die CSV-Datei ist leer.");

  const kopf = zeilen[0].map(s => s.trim());
  const sp = {
    id:      kopf.indexOf("ADDRESS.ID"),
    name:    kopf.indexOf("ADDRESS.Bezeichnung"),
    lat:     kopf.indexOf("ADDRESS.Lat"),
    lon:     kopf.indexOf("ADDRESS.Lon"),
    angebot: kopf.indexOf("Besondere Angebote")
  };
  if (sp.lat < 0 || sp.angebot < 0)
    return melde("Das sieht nicht nach dem Münchner Spielplatz-Datensatz aus.");

  /* Erst alle Zeilen je Ort zusammenfassen – ein Ort kann mehrfach vorkommen. */
  const orte = new Map();
  for (let i = 1; i < zeilen.length; i++) {
    const r = zeilen[i];
    if (!r[sp.lat]) continue;

    const schluessel = r[sp.id] || (r[sp.lat] + "," + r[sp.lon]);
    if (!orte.has(schluessel))
      orte.set(schluessel, {
        name: mucName(r[sp.name]),
        lat: +(+r[sp.lat]).toFixed(6),
        lon: +(+r[sp.lon]).toFixed(6),
        sportarten: new Set()
      });

    const o = orte.get(schluessel);
    for (const a of (r[sp.angebot] || "").split(/[\n;]/)) {
      const treffer = MUC_SPORT[a.trim().toLowerCase()];
      if (treffer) o.sportarten.add(treffer);
    }
  }

  const vorhanden = new Set(DATEN.map(o => ortSchluessel(o.name, o.lat, o.lon)));
  const zeilenNeu = [];
  let ohneSportart = 0, schonDa = 0;

  for (const o of orte.values()) {
    if (!o.sportarten.size) { ohneSportart++; continue; }
    if (!Number.isFinite(o.lat) || !Number.isFinite(o.lon)) continue;

    const schluessel = ortSchluessel(o.name, o.lat, o.lon);
    if (vorhanden.has(schluessel)) { schonDa++; continue; }
    vorhanden.add(schluessel);

    zeilenNeu.push({
      name: o.name, ort: "München",
      lat: o.lat, lon: o.lon,
      sportarten: [...o.sportarten],
      zugang: "öffentlich",          // öffentliche Spielplätze der Stadt
      zeiten: "unbekannt",
      bestaetigt_durch: "Auskunft Gemeinde",
      notizen: "Aus dem Open-Data-Datensatz der Stadt München. Ausstattung und Zustand vor Ort prüfen.",
      freigegeben: true
    });
  }

  await stapelEinfuegen(zeilenNeu, { schonDa, ohneSportart });
}

/* Gemeinsames Einfügen in Stapeln – von beiden Importwegen benutzt. */
async function stapelEinfuegen(zeilen, zaehler){
  let uebernommen = 0, dubletten = 0;

  if (!zeilen.length) {
    Z.importText = `Nichts Neues: ${zaehler.schonDa} schon vorhanden, `
                 + `${zaehler.ohneSportart} ohne passende Sportart`
                 + (zaehler.eingestuft ? `, ${zaehler.eingestuft} vorhandene Plätze nach Lage eingestuft.` : `.`);
    return zeichne();
  }

  if (ECHT) {
    for (let i = 0; i < zeilen.length; i += 100) {
      const stapel = zeilen.slice(i, i + 100);
      melde(`Importiere … ${Math.min(i + 100, zeilen.length)} / ${zeilen.length}`);

      const { data, error } = await db.from("orte").insert(stapel).select();
      if (!error) { uebernommen += data.length; DATEN.push(...data.map(ausDb)); continue; }

      if (!(error.message || "").includes("duplicate")) {
        console.error(error);
        melde("Import abgebrochen: " + error.message);
        break;
      }
      for (const z of stapel) {
        const r = await db.from("orte").insert(z).select().single();
        if (r.error) {
          if ((r.error.message || "").includes("duplicate")) dubletten++;
          else console.error(r.error);
        } else { uebernommen++; DATEN.push(ausDb(r.data)); }
      }
    }
  } else {
    for (const z of zeilen) DATEN.push(ausDb({ ...z, id:"T" + (DATEN.length + 1) }));
    uebernommen = zeilen.length;
  }

  Z.importText = `${uebernommen} Orte übernommen · `
               + `${zaehler.schonDa + dubletten} lagen auf bekannten Flächen`
               + (zaehler.alsOeffentlichErkannt
                   ? ` (davon ${zaehler.alsOeffentlichErkannt} amtlich als öffentlich bestätigt)` : ``)
               + ` · ${zaehler.ohneSportart} ohne passende Sportart übersprungen`
               + (zaehler.eingestuft ? ` · ${zaehler.eingestuft} vorhandene Plätze nach Lage eingestuft.` : `.`);
  zeichne();
  melde(`Fertig: ${uebernommen} Orte übernommen.`);
}

/* --------------------------------------------------------------------------
   Kodierung reparieren
   --------------------------------------------------------------------------
   Behördliche CSV-Exporte kommen in drei Varianten daher, und man sieht es
   erst am Ergebnis:
     1. saubere UTF-8-Datei                        -> nichts zu tun
     2. Windows-1252 / Latin-1                     -> als UTF-8 gelesen gibt
                                                      es Ersatzzeichen
     3. UTF-8, die schon einmal falsch gelesen und
        wieder gespeichert wurde ("StraÃŸe")       -> doppelt kodiert
   Diese Funktion erkennt alle drei Fälle und macht daraus lesbaren Text.
   -------------------------------------------------------------------------- */
function textReparieren(puffer){
  let text = new TextDecoder("utf-8").decode(puffer);

  // Fall 2: Ersatzzeichen im Text -> die Datei war gar kein UTF-8.
  if (text.includes("\uFFFD")) {
    const latin = new TextDecoder("windows-1252").decode(puffer);
    console.info("Kodierung: Datei als Windows-1252 gelesen.");
    return latin;
  }

  // Fall 3: typische Doppelkodierung. Ã¤ Ã¶ Ã¼ ÃŸ Ã„ Ã– Ãœ
  if (/Ã[¤¶¼\u009f„–œ]/.test(text)) {
    try {
      const bytes = new Uint8Array([...text].map(z => z.charCodeAt(0) & 0xFF));
      const repariert = new TextDecoder("utf-8", { fatal:true }).decode(bytes);
      console.info("Kodierung: Doppelkodierung repariert.");
      return repariert;
    } catch {
      console.warn("Kodierung: Doppelkodierung erkannt, Reparatur fehlgeschlagen.");
    }
  }

  return text;
}

/* Weiche: GeoJSON oder CSV? */
async function importVerarbeiten(datei){
  const text = textReparieren(await datei.arrayBuffer());
  const anfang = text.trimStart().slice(0, 1);

  if (anfang === "{" || anfang === "[") return importGeoJson(text);
  return importMuenchen(text);
}

const NACHBAR_RINGE = [];
for (const [land, flaechen] of Object.entries(NACHBARN))
  for (const f of flaechen) {
    const r = f[0];
    let s = 90, n = -90, w = 180, e = -180;
    for (const [x, y] of r) { if (y < s) s = y; if (y > n) n = y; if (x < w) w = x; if (x > e) e = x; }
    NACHBAR_RINGE.push({ land, r, s, n, w, e });
  }
function imRing(r, lat, lon){
  let drin = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) drin = !drin;
  }
  return drin;
}
function inDeutschland(lat, lon){
  let ausland = false;
  for (const g of NACHBAR_RINGE) {
    if (lat < g.s || lat > g.n || lon < g.w || lon > g.e || !imRing(g.r, lat, lon)) continue;
    if (g.land === "DEU") return true;     // Exklave
    ausland = true;
  }
  return !ausland;
}

function bekannterOrtInDerNaehe(lat, lon, radiusM = MISCH_RADIUS_M){
  for (const o of DATEN) {
    if (entfernungKm({lat, lon}, o) * 1000 <= radiusM) return o;
  }
  return null;
}

/* Versucht, einen neuen Eintrag mit einem bereits gesammelten neuen Eintrag
   zu verschmelzen. Regeln wie im Aufräum-SQL:
     gleiche Sportart bis 100 m, beliebige Sportart bis 40 m.
   So wird eine Calisthenics-Anlage aus fünf Geräte-Punkten EIN Ort. */
function mitNeuenMischen(gesammelt, k){
  for (const z of gesammelt) {
    const abstand = entfernungKm({lat:z.lat, lon:z.lon}, {lat:k.lat, lon:k.lon}) * 1000;
    const gleicherSport = z.sportarten.some(s => k.sportarten.includes(s));
    if (!(abstand <= 40 || (gleicherSport && abstand <= MISCH_RADIUS_M))) continue;

    for (const s of k.sportarten)
      if (!z.sportarten.includes(s)) z.sportarten.push(s);
    if (!z.untergrund && k.untergrund) z.untergrund = k.untergrund;

    // Ein echter Name schlägt den Platzhalter "…-Fläche".
    if ((z.platzhalter || /-Fläche$/.test(z.name)) && !k.platzhalter && !/-Fläche$/.test(k.name)) { z.name = k.name; z.platzhalter = false; }

    z._teile = (z._teile || 1) + 1;
    return true;
  }
  return false;
}

async function importGeoJson(text){
  let geo;
  try { geo = JSON.parse(text); }
  catch { return melde("Das ist keine gültige GeoJSON-Datei."); }

  /* Auch rohes Overpass-JSON annehmen (elements statt features). */
  const features = geo.features || (geo.elements || []).map(e => ({
    properties: e.tags || {},
    bounds: e.bounds || null,      // nur bei Parks, Spielplätzen, Schulen
    geometry: e.type === "node" ? { type:"Point", coordinates:[e.lon, e.lat] }
            : e.center ? { type:"Point", coordinates:[e.center.lon, e.center.lat] }
            : e.bounds ? { type:"Point", coordinates:[(e.bounds.minlon + e.bounds.maxlon) / 2,
                                                      (e.bounds.minlat + e.bounds.maxlat) / 2] } : null
  }));
  const umgebung = umgebungAufbauen(features);
  if (!features.length) return melde("Die Datei enthält keine Einträge.");

  const vorhanden = new Set(DATEN.map(o => ortSchluessel(o.name, o.lat, o.lon)));
  const bekannt = new Map();
  for (const o of DATEN) rasterRein(bekannt, o);
  const neuRaster = new Map();

  /* Erster Durchgang: Vereinsgelände einsammeln (sports_centre, club=sport).
     Sie werden nicht selbst als Orte importiert – sie dienen als Anker:
     Jeder ungeklärte Platz im Umkreis von 180 m gilt als vermutliche
     Vereinsanlage und bekommt den Vereinsnamen. */
  const vereine = new Map();
  for (const f of features) {
    const t = f.properties || {};
    if (f.bounds) continue;
    if (t.leisure === "sports_centre" || t.club === "sport") {
      const p = mittelpunkt(f.geometry);
      if (p) rasterRein(vereine, { lat:p.lat, lon:p.lon, name:(t.name || "").trim() });
    }
  }
  function vereinInDerNaehe(lat, lon){
    for (const v of rasterNah(vereine, lat, lon))
      if (entfernungKm({lat, lon}, {lat:v.lat, lon:v.lon}) * 1000 <= 180) return v;
    return null;
  }

  const zeilen = [];
  let ohneSportart = 0, schonDa = 0, alsOeffentlichErkannt = 0, ausland = 0;
  const nachMerkmal = new Map();   // vorhandener Ort -> neue Stufe

  for (const f of features) {
    const t = f.properties || {};
    if (f.bounds) continue;   // Umgebung, kein Platz

    /* Vereinsgelände selbst überspringen – die Spielfelder darauf kommen
       als eigene OSM-Einträge und werden gleich richtig eingefärbt. */
    if (t.leisure === "sports_centre" || t.club === "sport") continue;

    const sp = sportartenAusTags(t);
    if (!sp.length) { ohneSportart++; continue; }

    const p = mittelpunkt(f.geometry);
    if (!p) continue;
    if (!inDeutschland(p.lat, p.lon)) { ausland++; continue; }

    /* Abgleich: Liegt hier schon eine Fläche aus einer amtlichen Liste?
       Dann ist es dieselbe Anlage – wir übernehmen sie nicht doppelt,
       ergänzen aber fehlende Sportarten und den Untergrund aus OSM. */
    const treffer = rasterNah(bekannt, p.lat, p.lon)
      .find(o => entfernungKm({ lat:p.lat, lon:p.lon }, o) * 1000 <= MISCH_RADIUS_M);
    if (treffer) {
      schonDa++;
      if (treffer.bestaetigt_durch === "Auskunft Gemeinde" || treffer.zugang === "öffentlich")
        alsOeffentlichErkannt++;

      /* Liegt der bekannte Ort ungeklärt neben einem Verein? Dann jetzt
         kennzeichnen – so bekommen auch früher importierte Punkte die Farbe. */
      if (treffer.zugang === "unklar" && !treffer.verein) {
        const v = vereinInDerNaehe(p.lat, p.lon);
        if (v) {
          const name = v.name || "Verein in der Nähe";
          if (ECHT) {
            const { error } = await db.from("orte").update({ verein:name }).eq("id", treffer.id);
            if (!error) treffer.verein = name;
          } else treffer.verein = name;
        }
      }

      /* Ungeklärt und kein Verein: mit den OSM-Merkmalen einstufen. */
      if (treffer.zugang === "unklar" && treffer.bestaetigtDurch === "nur vermutet"
          && !treffer.verein && !vereinsMarke(treffer)) {
        const lage = lageEinstufen(umgebung, p.lat, p.lon, t);
        if (lage) nachMerkmal.set(treffer, lage.zugang);
      }

      const fehlende = sp.filter(s => !treffer.sportarten.includes(s));
      const belag = OSM_BELAG[(t.surface || "").toLowerCase()];
      if (ECHT && (fehlende.length || (belag && (!treffer.untergrund || treffer.untergrund === "—")))) {
        const zeile = {};
        if (fehlende.length) zeile.sportarten = [...treffer.sportarten, ...fehlende];
        if (belag && (!treffer.untergrund || treffer.untergrund === "—")) zeile.untergrund = belag;
        const { error } = await db.from("orte").update(zeile).eq("id", treffer.id);

      name, ort: t["addr:city"] || null,
      lat: p.lat, lon: p.lon,

      zugang: lage ? lage.zugang : "unklar", zeiten: "unbekannt",
      bestaetigt_durch: lage ? "Lage (OSM)" : "nur vermutet",
      untergrund: OSM_BELAG[(t.surface || "").toLowerCase()] || null,
      beleuchtung: t.lit === "yes" ? "ja" : (t.lit === "no" ? "nein" : null),

                          || !!t.club || t.leisure === "sports_centre"
